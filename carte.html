<style>
/* Polices auto-hebergees (T17). Inserees par le marqueur __POLICES__ (gabarit.injecter).
   Sources : @fontsource-variable/archivo 5.3.0 et @fontsource-variable/source-serif-4 5.3.1,
   sous-ensemble latin, licence OFL (polices/OFL.txt). Chemins relatifs : le site est servi
   sous /bra_analytics/, pas a la racine du domaine. */
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;
  src:url(polices/archivo-latin-wdth-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Serif 4";font-style:normal;font-display:swap;font-weight:200 900;
  src:url(polices/source-serif-4-latin-opsz-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Feuille de releve : base visuelle commune aux quatre ecrans, inseree par le
   marqueur __STYLE__ (gabarit.injecter). Papier et encre, pas de cartes : les
   blocs se separent par des filets, comme sur une planche topographique.
   Les jetons --o1..--o5 (rampe ordinale) et --s1..--s4 (series) gardent leur nom :
   le JavaScript des ecrans les lit tels quels. */
:root{
  color-scheme:light;
  --page:#f1f2ee; --surface:#f1f2ee; --surface-2:#e5e8e2;
  --ink:#1b282c; --ink-2:#46575b; --ink-muted:#6f8084;
  --grid:#d9ded8; --rule:#bcc5bf; --ring:rgba(27,40,44,.14);
  --s1:#1d6a8c; --s2:#c4481b; --s3:#3b7d5a; --s4:#87559c;
  --band:#8d9d9c; --coeur:rgba(29,106,140,.08); --hors:rgba(111,128,132,.16); --manque:#b83a2e;
  --o1:#c9dde3; --o2:#8fbac8; --o3:#4f90a8; --o4:#2a6580; --o5:#123a4d;
  --hachure:#6f8084; --vide:#e1e5df;
  --serif:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#121819; --surface:#121819; --surface-2:#1b2325;
    --ink:#e8eeea; --ink-2:#b0bfbc; --ink-muted:#82938f;
    --grid:#232d2f; --rule:#374447; --ring:rgba(232,238,234,.16);
    --s1:#4aa5c9; --s2:#e2703f; --s3:#52a67c; --s4:#b184c7;
    --band:#566766; --coeur:rgba(74,165,201,.10); --hors:rgba(130,147,143,.14); --manque:#e0695e;
    --o1:#1c4251; --o2:#2b667d; --o3:#418ca8; --o4:#80b8cc; --o5:#c4e0ea;
    --hachure:#82938f; --vide:#1d2628;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121819; --surface:#121819; --surface-2:#1b2325;
  --ink:#e8eeea; --ink-2:#b0bfbc; --ink-muted:#82938f;
  --grid:#232d2f; --rule:#374447; --ring:rgba(232,238,234,.16);
  --s1:#4aa5c9; --s2:#e2703f; --s3:#52a67c; --s4:#b184c7;
  --band:#566766; --coeur:rgba(74,165,201,.10); --hors:rgba(130,147,143,.14); --manque:#e0695e;
  --o1:#1c4251; --o2:#2b667d; --o3:#418ca8; --o4:#80b8cc; --o5:#c4e0ea;
  --hachure:#82938f; --vide:#1d2628;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px 80px}
@media (max-width:600px){.wrap{padding:0 16px 56px}}
a{color:inherit;text-underline-offset:2px}
:is(a,button,select,input,summary):focus-visible{outline:2px solid var(--s1);outline-offset:3px}

/* Cartouche : un filet epais, la source en ligne courante, puis le titre. */
header{padding:20px 0 26px;border-top:6px solid var(--ink);margin-top:14px}
.eyebrow{font-size:13px;color:var(--ink-muted);margin:0 0 22px}
h1{font-family:var(--serif);font-size:clamp(34px,5.6vw,62px);font-weight:500;letter-spacing:-.022em;line-height:1.02;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--sans);font-size:clamp(16px,2vw,20px);font-weight:400;color:var(--ink-2);letter-spacing:0;line-height:1.3;margin-top:12px}
.lede{margin:18px 0 0;max-width:58ch;font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink-2)}
.lede b{color:var(--ink);font-weight:600}

/* Commandes : des champs de formulaire a soulignement, des boutons-textes. */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;
  padding:12px 0 11px;margin-bottom:26px;background:var(--page);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bar label,.lab{font-size:13px;color:var(--ink-muted)}
.champ,.bar>span[id^="zone-"]{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.bar+.panel,.bar+.kpis{border-top:0}
.bar+.panel{padding-top:2px}
select{font-family:var(--sans);font-size:14.5px;color:var(--ink);background:transparent;border:0;
  border-bottom:1.5px solid var(--ink);border-radius:0;padding:3px 2px;cursor:pointer;max-width:100%}
select option{background:var(--page);color:var(--ink)}
select:disabled{opacity:.45;cursor:not-allowed}
option:disabled{color:var(--ink-muted)}
.toggle{font:inherit;font-size:14px;color:var(--ink-2);background:none;border:0;border-bottom:1.5px dotted var(--ink-muted);
  border-radius:0;padding:3px 1px;cursor:pointer}
.toggle:hover{color:var(--ink)}
.toggle[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.seg{display:inline-flex;gap:16px}
.spacer{flex:1 1 auto}
.chk{font-size:13px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--s1)}
.alerte{border-left:3px solid var(--manque);padding:6px 0 6px 12px;margin:0 0 18px;font-size:13.5px;color:var(--ink-2)}
.alerte b{color:var(--ink)}
.alerte:empty{display:none}

/* Chiffres cles : un releve, chaque valeur sous un filet, alignee a gauche. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 30px;margin:0 0 38px}
.kpi{display:flex;flex-direction:column;gap:3px;padding:10px 0 16px;border-top:2px solid var(--ink)}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.015em;line-height:1.12;font-variant-numeric:lining-nums tabular-nums}
.kpi .n{font-size:12.5px;color:var(--ink-muted);line-height:1.4}
.kpi .n b{color:var(--ink-2);font-weight:600}

/* Blocs : separes par un filet, sans boite. */
.panel{padding:26px 0 10px;border-top:1px solid var(--rule)}
h2{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.012em;line-height:1.15;margin:0}
.sous{margin:6px 0 14px;max-width:70ch;font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.sous b{color:var(--ink);font-weight:600}

/* Traces. Les chiffres d'axe en capitales etroites, a la facon des cartes. */
.plot svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.tick{font-size:11px;font-stretch:78%;fill:var(--ink-muted);font-variant-numeric:tabular-nums}
.cov{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cov b{color:var(--ink);font-weight:600}
.cov .trou{color:var(--manque)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:3px;border-radius:0}
.sw.tirets{height:0;border-top:2px dashed currentColor;background:none!important}
.sw.box{height:10px}

table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);border-bottom:1.5px solid var(--ink)}
caption{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding-bottom:8px}

#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--page);color:var(--ink);
  border:1px solid var(--ink);padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:290px}
#tip b{font-weight:600}
.notes{font-size:13px;color:var(--ink-2);max-width:96ch;margin:26px 0 0}
.notes li{margin:3px 0}
footer{border-top:1px solid var(--rule);margin-top:44px;padding-top:18px;color:var(--ink-muted);
  font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.carte svg{display:block;width:100%;height:auto;max-width:640px;margin:0}
.pays{fill:var(--surface-2);stroke:var(--ink-muted);stroke-width:.8;stroke-linejoin:round;pointer-events:none}
.massif{stroke:var(--surface);stroke-width:1.1;stroke-linejoin:round;cursor:crosshair}
.massif:hover,.massif:focus-visible{stroke:var(--ink);stroke-width:1.8;outline:none}
.zonelab{font-family:var(--serif);font-style:italic;font-size:17px;fill:var(--ink-muted)}
.legend{gap:8px 18px;margin:16px 0 0}
.legend .titre{color:var(--ink-muted)}
.legend svg{width:16px;height:16px;flex:none;box-shadow:inset 0 0 0 1px var(--ring)}
.echelle{margin:8px 0 0;font-size:12.5px;color:var(--ink-muted);max-width:86ch}
.attrib{margin:16px 0 0;padding-top:10px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink-muted)}
.attrib a{color:var(--ink-2)}
.tables{margin-top:24px}
.tables[hidden]{display:none}
.scroller{overflow-x:auto}
table{font-size:12.5px}
th,td{padding:5px 10px;white-space:nowrap}
td.g{text-align:left;white-space:normal}
#tip .num{font-variant-numeric:tabular-nums;font-weight:600}
#tip .z{color:var(--ink-muted)}
#tip .alerte{display:block;margin-top:4px;padding:0;border:0;color:var(--ink-2)}
/* Large : la carte a gauche, sa cle a droite, au lieu d'une legende sous un grand vide. */
@media (min-width:980px){
  .panel{display:grid;grid-template-columns:minmax(0,640px) minmax(240px,1fr);column-gap:56px;align-content:start}
  .panel>*{grid-column:1/-1}
  .panel>.carte{grid-column:1;grid-row:3/span 3}
  .panel>.exports{grid-column:1;grid-row:6}
  .panel>.legend{grid-column:2;grid-row:3;flex-direction:column;align-items:flex-start;margin-top:4px}
  .panel>.echelle{grid-column:2;grid-row:4;margin-top:14px}
}
@media (forced-colors:active){.massif{stroke:CanvasText}}
</style>

<div class="wrap">
<header>
  <p class="eyebrow">Météo-France · Bulletins d'estimation du risque d'avalanche</p>
  <h1 id="titre">Le risque d'avalanche, massif par massif</h1>
  <p class="lede" id="lede"></p>
</header>

<div class="bar">
  <label for="met">Métrique</label>
  <select id="met"></select>
  <span class="spacer"></span>
  <button class="toggle" id="tbl" aria-pressed="false">Voir les données</button>
</div>

<div class="kpis" id="kpis"></div>

<section class="panel">
  <h2 id="h2"></h2>
  <p class="sous" id="sous"></p>
  <div class="carte"><svg id="carte" role="img" aria-labelledby="h2"></svg></div>
  <div class="legend" id="legende"></div>
  <p class="echelle" id="echelle"></p>
  <p class="attrib" id="attribution-contours"></p>
  <div class="tables" hidden><div class="scroller"><table id="table"></table></div></div>
</section>

<footer>
  <span id="attribution"></span>
  <span>Page générée par <code>bra carte</code></span>
</footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>
/* Mecanisme transverse aux ecrans (T15) : navigation, attribution, etat dans l'URL,
   exports CSV et PNG. Insere dans chaque page par le marqueur de gabarit
   (gabarit.injecter) ; la liste des ecrans vient de partage.py.

   Il n'expose qu'un nom global, `PARTAGE`, et n'en emprunte aucun aux ecrans :
   les uns definissent `$`, `el`, `esc`, les autres non.

   Contrat d'un ecran (voir aussi partage.py) :
   - PARTAGE.demarrer({ ecran, ...D.partage })     une fois, apres le DOM ;
   - PARTAGE.lire() / PARTAGE.ecrire({ cle: val }) l'etat vit dans le fragment d'URL ;
   - PARTAGE.enregistrer(svg, { nom, colonnes, lignes })
        a la fin de chaque trace, avec les valeurs que la trace vient d'employer.
        Les lignes ne sont jamais recalculees ailleurs : un export reconstruit
        finit toujours par diverger de ce qu'on voit.

   Cles d'URL communes a tous les ecrans (un ecran ignore celles qu'il ne connait
   pas, mais ne les efface pas) :
     m  massif_id           s  saison "2021-2022"        f  fenetre (nom, fenetres.py)
     t  tranche d'altitude  v  versant du vent (nord|sud)
   x  mode de comparaison (saison|choix|massifs)   d  1 = tableaux de donnees ouverts
   Les cles propres a un ecran ne doivent pas reprendre une cle ci-dessus pour un
   autre sens. */
const PARTAGE = (() => {
  const ECRANS = [{"id": "carte", "fichier": "carte.html", "libelle": "Carte"}, {"id": "fiche", "fichier": "fiche.html", "libelle": "Fiche massif-saison"}, {"id": "comparaison", "fichier": "comparaison.html", "libelle": "Comparaison"}, {"id": "exploration", "fichier": "exploration.html", "libelle": "Exploration"}];
  const NS_SVG = "http://www.w3.org/2000/svg";
  const registre = new Map();            // svg -> { nom, colonnes, lignes, csv, png }
  let ecran = null, attribution = null;

  const etat = () => new URLSearchParams(location.hash.slice(1));
  const lire = () => etat();

  /* Ecrit les cles donnees (null ou "" les retire) et garde toutes les autres :
     c'est ce qui permet de passer d'un ecran a l'autre sans rien reinitialiser. */
  function ecrire(valeurs) {
    const p = etat();
    for (const k in valeurs) {
      const v = valeurs[k];
      if (v == null || v === "") p.delete(k); else p.set(k, v);
    }
    history.replaceState(null, "", "#" + p);
    liens();
  }

  /* ---------- navigation ---------- */
  function liens() {
    document.querySelectorAll(".partage-nav a[data-ecran]").forEach(a => {
      const e = ECRANS.find(x => x.id === a.dataset.ecran);
      a.href = e.fichier + location.hash;
    });
  }
  const echapper = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dateLongue = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

  function style() {
    const s = document.createElement("style");
    s.textContent = `
.partage-nav{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 22px;padding:14px 0 0;font-size:14px}
.partage-nav a,.partage-nav button{font:inherit;color:var(--ink-2,#46575b);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:2px 0;text-decoration:none;cursor:pointer}
.partage-nav a[aria-current="page"]{color:var(--ink,#1b282c);font-weight:600;border-bottom-color:var(--ink,#1b282c)}
.partage-nav .espace{flex:1 1 auto}
.partage-nav button{font-size:13px;text-decoration:underline;text-underline-offset:3px}
.exports{display:flex;gap:16px;justify-content:flex-end;margin:4px 0 0;font-size:12.5px}
.exports a,.exports button{font:inherit;color:var(--ink-muted,#6f8084);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.exports a:hover,.exports button:hover,.partage-nav a:hover,.partage-nav button:hover{color:var(--ink,#1b282c)}
:is(.exports a,.exports button,.partage-nav a,.partage-nav button):focus-visible{outline:2px solid var(--s1,#1d6a8c);outline-offset:3px}
.attribution a{color:inherit}
details.plus{display:inline;font-size:inherit}
details.plus>summary{display:inline;cursor:pointer;color:var(--ink-muted,#6b7480);font-size:.92em;margin-left:4px;list-style:none}
details.plus>summary::-webkit-details-marker{display:none}
details.plus>summary::before{content:"+ "}
details.plus[open]>summary::before{content:"\u2212 "}
details.plus[open]>.corps{display:block;margin-top:4px}
details.plus.bloc{display:block}
details.plus.bloc>summary{display:block;margin:0}`;
    document.head.appendChild(s);
  }

  /* Barre de navigation, pied d'attribution, lien copiable. `donnees`, `archive`,
     `genere`, `contours` viennent de partage.bloc() dans le payload. */
  function demarrer(o) {
    ecran = o.ecran;
    attribution = o;
    style();
    const racine = document.querySelector(".wrap") || document.body;
    const nav = document.createElement("nav");
    nav.className = "partage-nav";
    nav.setAttribute("aria-label", "Écrans");
    nav.innerHTML = ECRANS.map(e =>
      `<a data-ecran="${e.id}" href="${e.fichier}"${e.id === ecran ? ' aria-current="page"' : ""}>${echapper(e.libelle)}</a>`).join("")
      + `<span class="espace"></span><button type="button" id="partage-copier">Copier le lien</button>`;
    racine.insertBefore(nav, racine.firstChild);
    nav.querySelector("#partage-copier").addEventListener("click", ev => {
      const b = ev.currentTarget;
      const ok = () => { b.textContent = "Lien copié"; setTimeout(() => { b.textContent = "Copier le lien"; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok, () => {});
    });
    liens();
    addEventListener("hashchange", liens);

    const pied = document.getElementById("attribution");
    if (pied) {
      pied.className = "attribution";
      pied.innerHTML = `${echapper(o.donnees)}` + (o.archive ? ` · archive arrêtée au ${dateLongue(o.archive)}` : "")
        + ` · page générée le ${dateLongue(o.genere)}`
        + (o.contours ? ` · ${echapper(o.contours)}` : "")
        + ` · <a href="${o.source_url}">source</a>, <a href="${o.licence_url}">licence</a>`;
    }
    /* Sur la carte, l'attribution des contours est aussi sous la carte (spec section 7). */
    const sousCarte = document.getElementById("attribution-contours");
    if (sousCarte && o.contours) sousCarte.textContent = `${o.donnees}, archive arrêtée au ${dateLongue(o.archive)}. ${o.contours}.`;
  }

  /* ---------- exports ---------- */
  const cellule = v => {
    if (v == null) return "";
    const s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  /* Les lignes `#` portent l'attribution : un export est une reutilisation, et la
     Licence Ouverte demande la mention de la source et de sa date. Les lecteurs de
     CSV courants les sautent (pandas comment="#", polars comment_prefix="#"). */
  function texteCsv(d) {
    const tete = [
      `# ${d.titre || d.nom}`,
      `# ${attribution.donnees}` + (attribution.archive ? `, archive arrêtée au ${attribution.archive}` : ""),
      `# ${location.href}`,
    ];
    return "﻿" + [...tete, d.colonnes.map(cellule).join(","), ...d.lignes.map(l => l.map(cellule).join(","))].join("\r\n") + "\r\n";
  }
  const nomFichier = (nom, ext) => `bra-${ecran}-${nom}.${ext}`.replace(/[^\w.-]+/g, "-");

  function barre(svg) {
    const hote = svg.closest(".plot") || svg.parentNode;
    let b = hote.nextElementSibling;
    if (b && b.classList.contains("exports")) return b;
    b = document.createElement("div");
    b.className = "exports";
    b.innerHTML = `<a class="exp-csv" role="button">Exporter CSV</a><button type="button" class="exp-png">Exporter PNG</button>`;
    hote.insertAdjacentElement("afterend", b);
    b.querySelector(".exp-png").addEventListener("click", () => {
      const d = registre.get(svg);
      png(svg).then(url => telecharger(url, nomFichier(d ? d.nom : "graphe", "png")));
    });
    return b;
  }
  function telecharger(url, fichier) {
    const a = document.createElement("a");
    a.href = url; a.download = fichier;
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* Enregistre les donnees d'un graphe. A appeler a chaque trace : le lien CSV est
     remplace, il reflete donc toujours l'etat affiche (filtres compris).
     colonnes : [nom, ...] ; lignes : [[valeur, ...], ...] en valeurs brutes
     (nombres non formates, decimale au point, null = vide). */
  function enregistrer(svg, d) {
    if (typeof svg === "string") svg = document.getElementById(svg);
    if (!svg) return;
    registre.set(svg, d);
    const a = barre(svg).querySelector(".exp-csv");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(texteCsv(d));
    a.download = nomFichier(d.nom, "csv");
    a.dataset.lignes = d.lignes.length;
  }

  /* PNG : le SVG de la page s'appuie sur des variables CSS et des classes qui
     n'existent pas une fois l'image sortie de la page. On recopie donc les
     proprietes calculees de chaque noeud, puis on ajoute un titre et l'attribution
     sur fond plein. Retourne une promesse de data URL. */
  const PROPS = ["fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linejoin", "stroke-linecap", "opacity",
    "fill-opacity", "stroke-opacity", "font-family", "font-size", "font-weight", "text-anchor", "dominant-baseline", "letter-spacing"];

    const copie = svg.cloneNode(true);
    figer(svg, copie);
    copie.querySelectorAll("title").forEach(t => t.remove());
    copie.setAttribute("x", 0); copie.setAttribute("y", 30);
    copie.setAttribute("width", L); copie.setAttribute("height", H);
    copie.setAttribute("viewBox", `0 0 ${L} ${H}`);
    const cs = getComputedStyle(document.body);
    const fond = cs.getPropertyValue("background-color"), encre = cs.getPropertyValue("color");
    const titre = (svg.closest(".panel") || document).querySelector("h2");
    const d = registre.get(svg);
    const pied = `${attribution.donnees}` + (attribution.archive ? `, archive arrêtée au ${attribution.archive}` : "");
    const EXTRA = attribution.contours ? 68 : 54;       // une ligne de plus pour les contours : sinon elle deborde
    const ext = document.createElementNS(NS_SVG, "svg");
    ext.setAttribute("xmlns", NS_SVG);
    ext.setAttribute("width", L); ext.setAttribute("height", H + EXTRA);
    ext.setAttribute("viewBox", `0 0 ${L} ${H + EXTRA}`);
    const fondR = document.createElementNS(NS_SVG, "rect");
    fondR.setAttribute("width", L); fondR.setAttribute("height", H + EXTRA); fondR.setAttribute("fill", fond);
    ext.appendChild(fondR);
    const texte = (y, taille, s, op) => {
      const t = document.createElementNS(NS_SVG, "text");
      t.setAttribute("x", 12); t.setAttribute("y", y);
      t.setAttribute("font-size", taille); t.setAttribute("fill", encre);
      t.setAttribute("font-family", "system-ui, sans-serif"); t.setAttribute("opacity", op);
      t.textContent = s; ext.appendChild(t);
    };
    texte(20, 15, ((d && d.titre) || (titre ? titre.textContent : "")), 1);
    ext.appendChild(copie);
    texte(H + 46, 11, pied, .7);
    if (attribution.contours) texte(H + 61, 11, attribution.contours, .7);
    const xml = new XMLSerializer().serializeToString(ext);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = L * 2; c.height = (H + EXTRA) * 2;
        const g = c.getContext("2d");
        g.scale(2, 2); g.drawImage(img, 0, 0, L, H + EXTRA);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = () => reject(new Error("rasterisation impossible"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    });
  }

  /* Texte replie : une phrase visible, le reste dans un « + details » (aucun texte supprime,
     les exports et les tests le lisent toujours). `bloc` : le repli occupe sa propre ligne. */
  function plus(detail, titre = "détails", bloc = false) {
    return detail ? `<details class="plus${bloc ? " bloc" : ""}"><summary>${titre}</summary><span class="corps">${detail}</span></details>` : "";
  }

  return { demarrer, lire, ecrire, enregistrer, png, registre, plus };
})();

const NS = "http://www.w3.org/2000/svg";

const zoneFr = z => z === "Pyrenees" ? "Pyrénées" : z;

/* ---------- utilitaires ---------- */
const el = (t, at = {}) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); return e; };
const nb = n => n == null ? "—" : n.toLocaleString("fr-FR");
// Tout texte venu du payload passe par `esc` avant `innerHTML` : les noms et

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const F = D.fenetre;
const fenetreTexte = `${F.debut[1]} ${MOIS[F.debut[0] - 1]} → ${F.fin[1]} ${MOIS[F.fin[0] - 1]}`;

/* ---------- projection ----------
   Equirectangulaire corrigee du cosinus de la latitude moyenne : sur 5 degres
   de latitude, l'ecart a une projection conforme est invisible, et le calcul
   tient en deux lignes sans bibliotheque cartographique. */
const anneaux = f => f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

for (const f of [...D.france.features, ...D.contours.features]) for (const poly of anneaux(f)) for (const r of poly) for (const [x, y] of r) {

const W = 900, PAD = 18;

const py = y => PAD + (maxY - y) * ECH;
const chemin = f => anneaux(f).map(poly => poly.map(r =>

  const pas = v => Math.min(4, Math.max(0, Math.floor((v - lo) / larg)));
  const fmt = v => entier ? nb(Math.round(v)) : dec(v, 2);
  return { pas, lo, hi, bornes: RAMPE.map((_, k) => `${fmt(lo + larg * k)} – ${fmt(lo + larg * (k + 1))}`), niveaux: false };
}

/* ---------- valeur affichee ---------- */
function valeurTexte(m, cle) {
  const v = m[cle];
  if (v == null) return "aucune donnée";
  if (cle === "risque_moyen") return dec(v);
  if (cle === "risque_max") return `${v} — ${NIVEAUX[v - 1]}`;
  if (cle === "jours_3_plus_par_saison") return `${dec(v, 1)} jours par saison`;
  return nb(v) + " jours";
}

/* ---------- infobulle ----------
   Une moyenne d'indice ordinal ne se lit jamais seule : jours couverts et jours
   a 4 ou 5 l'accompagnent toujours, quelle que soit la metrique choisie. */
const tip = document.getElementById("tip");
function contenu(m) {
  const cle = metrique, def = defMetrique();
  let h = `<b>${esc(m.nom)}</b> <span class="z">· ${zoneFr(m.zone)}</span><br>`;
  if (m.diffusion === "absente") {
    return h + `Aucun jour couvert sur la période : massif non diffusé sur ${D.libelle_saisons}.`;
  }
  h += `${def.libelle} <span class="num">${valeurTexte(m, cle)}</span><br>`;
  if (cle !== "risque_moyen") h += `indice moyen <span class="num">${dec(m.risque_moyen)}</span><br>`;
  h += `<span class="num">${nb(m.jours_couverts)}</span> jours couverts sur <span class="num">${nb(m.jours_periode)}</span>
        (<span class="num">${pct(m.jours_couverts, m.jours_periode)}</span>)<br>
        <span class="num">${nb(m.jours_4_plus)}</span> jours à risque 4 ou 5`;
  if (m.jours_5) h += ` <span class="z">(dont <span class="num">${nb(m.jours_5)}</span> à 5)</span>`;
  if (cle === "jours_3_plus_par_saison" && m.jours_3_plus != null) {
    h += `<span class="num">${nb(m.jours_3_plus)}</span> jours à 3 ou plus sur <span class="num">${m.saisons}</span> saison${m.saisons > 1 ? "s" : ""}<br>`;
  }
  if (cle === "risque_max" && m.risque_max != null) {
    h += `<br>atteint <span class="num">${nb(m.jours_au_max)}</span> jour${m.jours_au_max > 1 ? "s" : ""}, la première fois le ${dateFr(m.date_max)}`;
  }
  const sansIndice = m.jours_couverts - m.jours_avec_indice;
  if (sansIndice > 0) h += `<br><span class="num">${nb(sansIndice)}</span> jour${sansIndice > 1 ? "s" : ""} sans indice, hors moyenne`;
  h += `<br><span class="num">${m.saisons_presentes.length}</span> saison${m.saisons_presentes.length > 1 ? "s" : ""} sur <span class="num">${NB_COMP}</span> comparables`;
  if (m.diffusion === "partielle") {
    h += `<span class="alerte"><b>Diffusion partielle</b> — pas de bulletin sur : ${esc(m.saisons_manquantes.join(", "))}.`;
    if (cle === "jours_3_plus_par_saison") h += " La moyenne par saison porte sur les seules saisons diffusées.";
    h += `</span>`;
  }
  return h;
}
function place(ev) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(8, ev.clientX + 14), innerWidth - r.width - 8) + "px";
  tip.style.top = Math.min(Math.max(8, ev.clientY + 16), innerHeight - r.height - 8) + "px";
}

/* ---------- motifs : absence et diffusion partielle ----------
   Deux textures distinctes, pour que l'absence ne se lise jamais comme un zero :
   un massif sans donnee est hachure sur fond neutre, hors de la rampe ; un
   massif diffuse une partie de la periode garde sa couleur, surchargee d'une
   hachure fine dans l'autre sens. */
function motifs(svg) {
  const defs = el("defs");
  const absent = el("pattern", { id: "absent", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  absent.append(el("rect", { width: 6, height: 6, fill: "var(--vide)" }), el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: "var(--hachure)", "stroke-width": 1.4 }));
  const partiel = el("pattern", { id: "partiel", width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(135)" });
  partiel.append(el("line", { x1: 0, y1: 0, x2: 0, y2: 5, stroke: "var(--surface)", "stroke-width": 1.6 }));
  defs.append(absent, partiel);
  svg.appendChild(defs);
}

/* ---------- carte ---------- */
function carte() {
  const svg = document.getElementById("carte");
  svg.textContent = "";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  motifs(svg);
  const sc = echelle(metrique);
  const zones = new Map();
  /* Fond : silhouette de la France, sous les massifs et hors de toute interaction. */
  for (const f of D.france.features) svg.appendChild(el("path", { d: chemin(f), class: "pays", "aria-hidden": "true" }));
  const lignesExport = [];
  for (const f of D.contours.features) {
    const m = PAR_ID.get(f.properties.code);
    if (!m) continue;
    lignesExport.push([m.id, m.nom, zoneFr(m.zone), metrique, m[metrique], m.jours_couverts, m.jours_periode, m.jours_4_plus, m.saisons_presentes.length, m.diffusion]);
    const d = chemin(f);
    const v = m[metrique];
    const fill = v == null ? "url(#absent)" : `var(${RAMPE[sc.pas(v)]})`;
    const p = el("path", { d, fill, class: "massif", tabindex: 0, "aria-label": `${m.nom} : ${valeurTexte(m, metrique)}` });
    p.addEventListener("pointerenter", ev => { tip.innerHTML = contenu(m); tip.style.opacity = "1"; place(ev); });
    p.addEventListener("pointermove", place);
    p.addEventListener("pointerleave", () => { tip.style.opacity = "0"; });
    p.addEventListener("focus", () => {
      tip.innerHTML = contenu(m); tip.style.opacity = "1";
      const b = p.getBoundingClientRect(); place({ clientX: b.right, clientY: b.top });
    });
    p.addEventListener("blur", () => { tip.style.opacity = "0"; });
    svg.appendChild(p);
    if (m.diffusion === "partielle") svg.appendChild(el("path", { d, fill: "url(#partiel)", "pointer-events": "none" }));
    /* Etiquettes de zone : boite englobante des massifs de chaque zone. */
    const b = p.getBBox();
    const z = zones.get(m.zone) || { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity };
    zones.set(m.zone, { x0: Math.min(z.x0, b.x), x1: Math.max(z.x1, b.x + b.width), y0: Math.min(z.y0, b.y), y1: Math.max(z.y1, b.y + b.height) });
  }
  for (const [nom, z] of zones) {
    /* Alpes du Nord et Corse : etiquette a gauche du haut du bloc ; les autres dessous. */
    const gauche = nom !== "Pyrenees" && nom !== "Alpes du Sud";
    const t = gauche
      ? el("text", { x: z.x0 - 12, y: z.y0 + 24, "text-anchor": "end", class: "zonelab" })
      : el("text", { x: (z.x0 + z.x1) / 2, y: z.y1 + 18, "text-anchor": "middle", class: "zonelab" });
    t.textContent = zoneFr(nom);
    svg.appendChild(t);
  }
  /* Une ligne par massif colore : la valeur est celle qui a choisi la teinte. */
  PARTAGE.enregistrer(svg, {
    nom: `carte-${metrique}`,
    titre: `${defMetrique().libelle}, ${D.libelle_saisons}`,
    colonnes: ["massif_id", "massif", "zone", "metrique", "valeur", "jours_couverts", "jours_periode", "jours_4_plus", "saisons_presentes", "diffusion"],
    lignes: lignesExport,
  });
  legende(sc);
}

function pastille(fill, surcharge) {
  const s = el("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
  s.appendChild(el("rect", { width: 16, height: 16, fill }));
  if (surcharge) for (let k = -16; k < 32; k += 5) s.appendChild(el("line", { x1: k, y1: 16, x2: k + 16, y2: 0, stroke: "var(--surface)", "stroke-width": 1.6 }));
  return s;
}
function pastilleAbsente() {
  const s = el("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
  s.appendChild(el("rect", { width: 16, height: 16, fill: "var(--vide)" }));
  for (let k = -16; k < 32; k += 6) s.appendChild(el("line", { x1: k, y1: 0, x2: k + 16, y2: 16, stroke: "var(--hachure)", "stroke-width": 1.4 }));
  return s;
}

function legende(sc) {
  const box = document.getElementById("legende");
  box.textContent = "";
  const titre = document.createElement("span");
  titre.className = "titre"; titre.textContent = defMetrique().libelle;
  box.appendChild(titre);
  const present = new Set(D.massifs.map(m => m[metrique]).filter(v => v != null).map(sc.pas));
  sc.bornes.forEach((txt, k) => {
    if (sc.niveaux && !present.has(k)) return;
    const s = document.createElement("span");
    s.append(pastille(`var(${RAMPE[k]})`), document.createTextNode(txt));
    box.appendChild(s);
  });
  const partiels = D.massifs.filter(m => m.diffusion === "partielle");
  const absents = D.massifs.filter(m => m.diffusion === "absente");
  if (partiels.length) {
    const s = document.createElement("span");
    s.append(pastille(`var(${RAMPE[2]})`, true), document.createTextNode(`Diffusé une partie de la période (${partiels.map(m => m.nom).join(", ")})`));
    box.appendChild(s);
  }
  const s = document.createElement("span");
  s.append(pastilleAbsente(), document.createTextNode(absents.length ? `Aucune donnée (${absents.length} massif${absents.length > 1 ? "s" : ""})` : "Aucune donnée (aucun massif)"));
  box.appendChild(s);

  const e = document.getElementById("echelle");
  const cle = metrique;
  if (cle === "risque_moyen") {
    e.textContent = `Classes réparties sur l'étendue observée (${dec(sc.lo)} à ${dec(sc.hi)}) : deux teintes voisines peuvent ne différer que de quelques centièmes. L'échelle européenne va de 1 à 5 ; une moyenne d'indices ordinaux se lit avec ses jours, au survol.`;
  } else if (cle === "jours_3_plus_par_saison") {
    e.textContent = `Classes réparties sur l'étendue observée (${dec(sc.lo, 1)} à ${dec(sc.hi, 1)} jours par saison). Le compte est rapporté aux saisons diffusées, pour que les massifs hachurés, diffusés moins longtemps, se comparent aux autres ; le compte brut est au survol. Zéro jour est une valeur, colorée comme telle ; l'absence de donnée est hachurée à part.`;
  } else {
    e.textContent = "Indice le plus haut publié sur la période, sur l'échelle européenne. Le survol donne le nombre de jours où il a été atteint.";
  }
}

/* ---------- tuiles ---------- */
function tuiles() {
  const avec = D.massifs.filter(m => m.risque_moyen != null);
  const tri = [...avec].sort((a, b) => b.risque_moyen - a.risque_moyen);
  const haut = tri[0], bas = tri[tri.length - 1];
  const decrit = m => `${dec(m.risque_moyen)} — ${nb(m.jours_couverts)} jours couverts, ${nb(m.jours_4_plus)} à 4 ou 5`;
  const partiels = D.massifs.filter(m => m.diffusion === "partielle");
  const cases = [
    ["Indice moyen le plus haut", haut ? haut.nom : "—", haut ? decrit(haut) : ""],
    ["Indice moyen le plus bas", bas ? bas.nom : "—", bas ? decrit(bas) : ""],
    ["Diffusion partielle", nb(partiels.length) + " massif" + (partiels.length > 1 ? "s" : ""),
      partiels.map(m => `${m.nom} : ${m.saisons_presentes.length} saisons sur ${NB_COMP}`).join(" · ") || "tous diffusés sur toute la période"],
  ];
  document.getElementById("kpis").innerHTML = cases
    .map(([k, v, n]) => `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`).join("");
}

/* ---------- table ---------- */
function table() {
  const cle = metrique;
  const lignes = [...D.massifs].sort((a, b) => (b[cle] ?? -Infinity) - (a[cle] ?? -Infinity) || a.id - b.id);
  const statut = m => m.diffusion === "complete" ? "complète"
    : m.diffusion === "partielle" ? `partielle — manque ${m.saisons_manquantes.join(", ")}` : "aucune donnée";
  const t = document.getElementById("table");
  t.innerHTML = `<caption>${defMetrique().libelle} par massif · ${D.libelle_saisons}</caption>
    <thead><tr>${["Massif", "Zone", "Indice moyen", "Jours ≥ 3 par saison", "Jours ≥ 3", "Maximum", "Jours couverts", "Jours à 4 ou 5", "Saisons", "Diffusion"].map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead>
    <tbody>${lignes.map(m => `<tr><th scope="row">${esc(m.nom)}</th><td class="g">${zoneFr(m.zone)}</td><td>${dec(m.risque_moyen)}</td>
      <td>${dec(m.jours_3_plus_par_saison, 1)}</td><td>${nb(m.jours_3_plus)}</td><td>${m.risque_max ?? "—"}</td><td>${nb(m.jours_couverts)}</td><td>${nb(m.jours_4_plus)}</td>
      <td>${m.saisons_presentes.length} / ${NB_COMP}</td><td class="g">${statut(m)}</td></tr>`).join("")}</tbody>`;
}

/* ---------- textes ---------- */
function textes() {
  const def = defMetrique();
  document.getElementById("h2").textContent = `${def.libelle}, ${D.libelle_saisons}`;
  const ecartees = Object.entries(D.saisons_ecartees).map(([s, motif]) => `${s} (${motif})`).join(" ; ");
  document.getElementById("sous").innerHTML =
    `${def.description[0].toUpperCase() + def.description.slice(1)}, une valeur par massif.`
    + PARTAGE.plus(`Fenêtre <b>${F.nom}</b> (${fenetreTexte}) de chaque saison, toutes saisons comparables confondues. Saisons écartées : ${esc(ecartees) || "aucune"}.`);
}

/* ---------- assemblage ---------- */
const sel = document.getElementById("met");
sel.innerHTML = METRIQUES.map(m => m.disponible
  ? `<option value="${m.cle}"${m.cle === metrique ? " selected" : ""}>${m.libelle}</option>`
  : `<option value="${m.cle}" disabled>${m.libelle} — ${m.motif.split(" :")[0]}</option>`).join("");
const indispo = METRIQUES.filter(m => !m.disponible);

document.getElementById("lede").innerHTML =
  `Chaque massif est coloré par son indice de risque moyen sur <b>${D.libelle_saisons}</b>, fenêtre <b>${F.nom}</b>. Survolez un massif pour le détail.`
  + PARTAGE.plus(`La fenêtre ${F.nom} (${fenetreTexte}) est la seule où les saisons se comparent : avant juin 2021, les journées à manteau insuffisant
   (début et fin de saison) ne recevaient pas d'indice et sortaient des moyennes. Le survol donne les jours couverts et les jours à risque 4 ou 5.`
  + (indispo.length ? ` <span style="color:var(--ink-muted)">${indispo.map(m => `${esc(m.libelle)} : ${esc(m.motif)}.`).join(" ")}</span>` : ""));

PARTAGE.demarrer({ ecran: "carte", ...D.partage });

/* L'URL est ecrite avant la carte : l'en-tete de l'export cite le lien courant. */
function dessine() { PARTAGE.ecrire({ mc: metrique }); textes(); carte(); table(); }
sel.addEventListener("change", () => { metrique = sel.value; dessine(); });
addEventListener("hashchange", () => { metrique = depuisUrl(); sel.value = metrique; dessine(); tables(PARTAGE.lire().get("d") === "1"); });
const bouton = document.getElementById("tbl");
/* Tableaux ouverts : cle `d=1`, comme sur le tableau de bord, pour qu'une URL collee rouvre le meme ecran. */
function tables(on) {
  bouton.setAttribute("aria-pressed", String(on));
  bouton.textContent = on ? "Masquer les données" : "Voir les données";
  document.querySelectorAll(".tables").forEach(t => { t.hidden = !on; });
}
bouton.addEventListener("click", () => {
  const on = bouton.getAttribute("aria-pressed") !== "true";
  tables(on);
  PARTAGE.ecrire({ d: on ? 1 : null });
});
tuiles();
dessine();
tables(PARTAGE.lire().get("d") === "1");
</script>
</html>
