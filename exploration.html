<style>
/* Polices auto-hebergees (T17). Inserees par le marqueur __POLICES__ (gabarit.injecter).
   Sources : @fontsource-variable/archivo 5.3.0 et @fontsource-variable/source-serif-4 5.3.1,
   sous-ensemble latin, licence OFL (polices/OFL.txt). Chemins relatifs : le site est servi
   sous /bra_analytics/, pas a la racine du domaine. */
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;
  src:url(polices/archivo-latin-wdth-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Serif 4";font-style:normal;font-display:swap;font-weight:200 900;
  src:url(polices/source-serif-4-latin-opsz-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Feuille de releve : base visuelle commune aux quatre ecrans, inseree par le
   marqueur __STYLE__ (gabarit.injecter). Papier et encre, pas de cartes : les
   blocs se separent par des filets, comme sur une planche topographique.
   Les jetons --o1..--o5 (rampe ordinale) et --s1..--s4 (series) gardent leur nom :
   le JavaScript des ecrans les lit tels quels. */
:root{
  color-scheme:light;
  --page:#f1f2ee; --surface:#f1f2ee; --surface-2:#e5e8e2;
  --ink:#1b282c; --ink-2:#46575b; --ink-muted:#6f8084;
  --grid:#d9ded8; --rule:#bcc5bf; --ring:rgba(27,40,44,.14);
  --s1:#1d6a8c; --s2:#c4481b; --s3:#3b7d5a; --s4:#87559c;
  --band:#8d9d9c; --coeur:rgba(29,106,140,.08); --hors:rgba(111,128,132,.16); --manque:#b83a2e;
  --o1:#c9dde3; --o2:#8fbac8; --o3:#4f90a8; --o4:#2a6580; --o5:#123a4d;
  --hachure:#6f8084; --vide:#e1e5df;
  --serif:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#121819; --surface:#121819; --surface-2:#1b2325;
    --ink:#e8eeea; --ink-2:#b0bfbc; --ink-muted:#82938f;
    --grid:#232d2f; --rule:#374447; --ring:rgba(232,238,234,.16);
    --s1:#4aa5c9; --s2:#e2703f; --s3:#52a67c; --s4:#b184c7;
    --band:#566766; --coeur:rgba(74,165,201,.10); --hors:rgba(130,147,143,.14); --manque:#e0695e;
    --o1:#1c4251; --o2:#2b667d; --o3:#418ca8; --o4:#80b8cc; --o5:#c4e0ea;
    --hachure:#82938f; --vide:#1d2628;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121819; --surface:#121819; --surface-2:#1b2325;
  --ink:#e8eeea; --ink-2:#b0bfbc; --ink-muted:#82938f;
  --grid:#232d2f; --rule:#374447; --ring:rgba(232,238,234,.16);
  --s1:#4aa5c9; --s2:#e2703f; --s3:#52a67c; --s4:#b184c7;
  --band:#566766; --coeur:rgba(74,165,201,.10); --hors:rgba(130,147,143,.14); --manque:#e0695e;
  --o1:#1c4251; --o2:#2b667d; --o3:#418ca8; --o4:#80b8cc; --o5:#c4e0ea;
  --hachure:#82938f; --vide:#1d2628;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px 80px}
@media (max-width:600px){.wrap{padding:0 16px 56px}}
a{color:inherit;text-underline-offset:2px}
:is(a,button,select,input,summary):focus-visible{outline:2px solid var(--s1);outline-offset:3px}

/* Cartouche : un filet epais, la source en ligne courante, puis le titre. */
header{padding:20px 0 26px;border-top:6px solid var(--ink);margin-top:14px}
.eyebrow{font-size:13px;color:var(--ink-muted);margin:0 0 22px}
h1{font-family:var(--serif);font-size:clamp(34px,5.6vw,62px);font-weight:500;letter-spacing:-.022em;line-height:1.02;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--sans);font-size:clamp(16px,2vw,20px);font-weight:400;color:var(--ink-2);letter-spacing:0;line-height:1.3;margin-top:12px}
.lede{margin:18px 0 0;max-width:58ch;font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink-2)}
.lede b{color:var(--ink);font-weight:600}

/* Commandes : des champs de formulaire a soulignement, des boutons-textes. */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;
  padding:12px 0 11px;margin-bottom:26px;background:var(--page);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bar label,.lab{font-size:13px;color:var(--ink-muted)}
.champ,.bar>span[id^="zone-"]{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.bar+.panel,.bar+.kpis{border-top:0}
.bar+.panel{padding-top:2px}
select{font-family:var(--sans);font-size:14.5px;color:var(--ink);background:transparent;border:0;
  border-bottom:1.5px solid var(--ink);border-radius:0;padding:3px 2px;cursor:pointer;max-width:100%}
select option{background:var(--page);color:var(--ink)}
select:disabled{opacity:.45;cursor:not-allowed}
option:disabled{color:var(--ink-muted)}
.toggle{font:inherit;font-size:14px;color:var(--ink-2);background:none;border:0;border-bottom:1.5px dotted var(--ink-muted);
  border-radius:0;padding:3px 1px;cursor:pointer}
.toggle:hover{color:var(--ink)}
.toggle[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.seg{display:inline-flex;gap:16px}
.spacer{flex:1 1 auto}
.chk{font-size:13px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--s1)}
.alerte{border-left:3px solid var(--manque);padding:6px 0 6px 12px;margin:0 0 18px;font-size:13.5px;color:var(--ink-2)}
.alerte b{color:var(--ink)}
.alerte:empty{display:none}

/* Chiffres cles : un releve, chaque valeur sous un filet, alignee a gauche. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 30px;margin:0 0 38px}
.kpi{display:flex;flex-direction:column;gap:3px;padding:10px 0 16px;border-top:2px solid var(--ink)}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.015em;line-height:1.12;font-variant-numeric:lining-nums tabular-nums}
.kpi .n{font-size:12.5px;color:var(--ink-muted);line-height:1.4}
.kpi .n b{color:var(--ink-2);font-weight:600}

/* Blocs : separes par un filet, sans boite. */
.panel{padding:26px 0 10px;border-top:1px solid var(--rule)}
h2{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.012em;line-height:1.15;margin:0}
.sous{margin:6px 0 14px;max-width:70ch;font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.sous b{color:var(--ink);font-weight:600}

/* Traces. Les chiffres d'axe en capitales etroites, a la facon des cartes. */
.plot svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.tick{font-size:11px;font-stretch:78%;fill:var(--ink-muted);font-variant-numeric:tabular-nums}
.cov{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cov b{color:var(--ink);font-weight:600}
.cov .trou{color:var(--manque)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:3px;border-radius:0}
.sw.tirets{height:0;border-top:2px dashed currentColor;background:none!important}
.sw.box{height:10px}

table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);border-bottom:1.5px solid var(--ink)}
caption{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding-bottom:8px}

#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--page);color:var(--ink);
  border:1px solid var(--ink);padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:290px}
#tip b{font-weight:600}
.notes{font-size:13px;color:var(--ink-2);max-width:96ch;margin:26px 0 0}
.notes li{margin:3px 0}
footer{border-top:1px solid var(--rule);margin-top:44px;padding-top:18px;color:var(--ink-muted);
  font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.puces{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.puce{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-left-width:4px;background:var(--surface-2);padding:2px 4px 2px 9px;font-size:13px}
.puce button{border:0;background:none;color:var(--ink-muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px}
.puce button:hover{color:var(--ink)}
.plafond{font-size:12px;color:var(--ink-muted)}
.phrase{margin:6px 0 12px;font-family:var(--serif);font-size:17px;max-width:70ch}
.etiq{font-size:12.5px;fill:var(--ink)}
.etiq.nc{fill:var(--ink-muted)}
.val{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:8px 0 6px}
tr.nc td{color:var(--ink-muted)}
tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--s1)}
td small{display:block;color:var(--ink-muted);font-size:11.5px;text-align:left;white-space:normal;max-width:46ch}
.badge{display:inline-block;font-size:11.5px;border:1px solid var(--manque);color:var(--manque);padding:0 5px;margin-left:6px;vertical-align:1px}
.hint{font-size:12.5px;color:var(--ink-2)}
.hint b{color:var(--ink)}
.tablewrap{overflow-x:auto}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px 28px;margin:10px 0 6px}
.carte{border-top:1.5px solid var(--ink);padding:8px 0 8px}
.carte h3{font-family:var(--serif);font-size:17px;font-weight:500;margin:0 0 2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.carte svg{display:block;width:100%;height:auto}
.carte .cov{margin-top:4px}
.alt{display:inline-block;font-family:var(--sans);font-size:11.5px;border:1px solid var(--ink-muted);color:var(--ink-2);padding:0 5px;font-weight:400}
.carte.nc .wedge,.carte.nc .barre{stroke-dasharray:4 3}
.vide{color:var(--ink-muted);font-size:13px;margin:18px 0}
</style>

<div class="wrap">

<script>
/* Mecanisme transverse aux ecrans (T15) : navigation, attribution, etat dans l'URL,
   exports CSV et PNG. Insere dans chaque page par le marqueur de gabarit
   (gabarit.injecter) ; la liste des ecrans vient de partage.py.

   Il n'expose qu'un nom global, `PARTAGE`, et n'en emprunte aucun aux ecrans :
   les uns definissent `$`, `el`, `esc`, les autres non.

   Contrat d'un ecran (voir aussi partage.py) :
   - PARTAGE.demarrer({ ecran, ...D.partage })     une fois, apres le DOM ;
   - PARTAGE.lire() / PARTAGE.ecrire({ cle: val }) l'etat vit dans le fragment d'URL ;
   - PARTAGE.enregistrer(svg, { nom, colonnes, lignes })
        a la fin de chaque trace, avec les valeurs que la trace vient d'employer.
        Les lignes ne sont jamais recalculees ailleurs : un export reconstruit
        finit toujours par diverger de ce qu'on voit.

   Cles d'URL communes a tous les ecrans (un ecran ignore celles qu'il ne connait
   pas, mais ne les efface pas) :
     m  massif_id           s  saison "2021-2022"        f  fenetre (nom, fenetres.py)
     t  tranche d'altitude  v  versant du vent (nord|sud)
   x  mode de comparaison (saison|choix|massifs)   d  1 = tableaux de donnees ouverts
   Les cles propres a un ecran ne doivent pas reprendre une cle ci-dessus pour un
   autre sens. */
const PARTAGE = (() => {
  const ECRANS = [{"id": "carte", "fichier": "carte.html", "libelle": "Carte"}, {"id": "fiche", "fichier": "fiche.html", "libelle": "Fiche massif-saison"}, {"id": "comparaison", "fichier": "comparaison.html", "libelle": "Comparaison"}, {"id": "exploration", "fichier": "exploration.html", "libelle": "Exploration"}];
  const NS_SVG = "http://www.w3.org/2000/svg";
  const registre = new Map();            // svg -> { nom, colonnes, lignes, csv, png }
  let ecran = null, attribution = null;

  const etat = () => new URLSearchParams(location.hash.slice(1));
  const lire = () => etat();

  /* Ecrit les cles donnees (null ou "" les retire) et garde toutes les autres :
     c'est ce qui permet de passer d'un ecran a l'autre sans rien reinitialiser. */
  function ecrire(valeurs) {
    const p = etat();
    for (const k in valeurs) {
      const v = valeurs[k];
      if (v == null || v === "") p.delete(k); else p.set(k, v);
    }
    history.replaceState(null, "", "#" + p);
    liens();
  }

  /* ---------- navigation ---------- */
  function liens() {
    document.querySelectorAll(".partage-nav a[data-ecran]").forEach(a => {
      const e = ECRANS.find(x => x.id === a.dataset.ecran);
      a.href = e.fichier + location.hash;
    });
  }
  const echapper = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dateLongue = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

  function style() {
    const s = document.createElement("style");
    s.textContent = `
.partage-nav{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 22px;padding:14px 0 0;font-size:14px}
.partage-nav a,.partage-nav button{font:inherit;color:var(--ink-2,#46575b);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:2px 0;text-decoration:none;cursor:pointer}
.partage-nav a[aria-current="page"]{color:var(--ink,#1b282c);font-weight:600;border-bottom-color:var(--ink,#1b282c)}
.partage-nav .espace{flex:1 1 auto}
.partage-nav button{font-size:13px;text-decoration:underline;text-underline-offset:3px}
.exports{display:flex;gap:16px;justify-content:flex-end;margin:4px 0 0;font-size:12.5px}
.exports a,.exports button{font:inherit;color:var(--ink-muted,#6f8084);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.exports a:hover,.exports button:hover,.partage-nav a:hover,.partage-nav button:hover{color:var(--ink,#1b282c)}
:is(.exports a,.exports button,.partage-nav a,.partage-nav button):focus-visible{outline:2px solid var(--s1,#1d6a8c);outline-offset:3px}
.attribution a{color:inherit}
details.plus{display:inline;font-size:inherit}
details.plus>summary{display:inline;cursor:pointer;color:var(--ink-muted,#6b7480);font-size:.92em;margin-left:4px;list-style:none}
details.plus>summary::-webkit-details-marker{display:none}
details.plus>summary::before{content:"+ "}
details.plus[open]>summary::before{content:"\u2212 "}
details.plus[open]>.corps{display:block;margin-top:4px}
details.plus.bloc{display:block}
details.plus.bloc>summary{display:block;margin:0}`;
    document.head.appendChild(s);
  }

  /* Barre de navigation, pied d'attribution, lien copiable. `donnees`, `archive`,
     `genere`, `contours` viennent de partage.bloc() dans le payload. */
  function demarrer(o) {
    ecran = o.ecran;
    attribution = o;
    style();
    const racine = document.querySelector(".wrap") || document.body;
    const nav = document.createElement("nav");
    nav.className = "partage-nav";
    nav.setAttribute("aria-label", "Écrans");
    nav.innerHTML = ECRANS.map(e =>
      `<a data-ecran="${e.id}" href="${e.fichier}"${e.id === ecran ? ' aria-current="page"' : ""}>${echapper(e.libelle)}</a>`).join("")
      + `<span class="espace"></span><button type="button" id="partage-copier">Copier le lien</button>`;
    racine.insertBefore(nav, racine.firstChild);
    nav.querySelector("#partage-copier").addEventListener("click", ev => {
      const b = ev.currentTarget;
      const ok = () => { b.textContent = "Lien copié"; setTimeout(() => { b.textContent = "Copier le lien"; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok, () => {});
    });
    liens();
    addEventListener("hashchange", liens);

    const pied = document.getElementById("attribution");
    if (pied) {
      pied.className = "attribution";
      pied.innerHTML = `${echapper(o.donnees)}` + (o.archive ? ` · archive arrêtée au ${dateLongue(o.archive)}` : "")
        + ` · page générée le ${dateLongue(o.genere)}`
        + (o.contours ? ` · ${echapper(o.contours)}` : "")
        + ` · <a href="${o.source_url}">source</a>, <a href="${o.licence_url}">licence</a>`;
    }
    /* Sur la carte, l'attribution des contours est aussi sous la carte (spec section 7). */
    const sousCarte = document.getElementById("attribution-contours");
    if (sousCarte && o.contours) sousCarte.textContent = `${o.donnees}, archive arrêtée au ${dateLongue(o.archive)}. ${o.contours}.`;
  }

  /* ---------- exports ---------- */
  const cellule = v => {
    if (v == null) return "";
    const s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  /* Les lignes `#` portent l'attribution : un export est une reutilisation, et la
     Licence Ouverte demande la mention de la source et de sa date. Les lecteurs de
     CSV courants les sautent (pandas comment="#", polars comment_prefix="#"). */
  function texteCsv(d) {
    const tete = [
      `# ${d.titre || d.nom}`,
      `# ${attribution.donnees}` + (attribution.archive ? `, archive arrêtée au ${attribution.archive}` : ""),
      `# ${location.href}`,
    ];
    return "﻿" + [...tete, d.colonnes.map(cellule).join(","), ...d.lignes.map(l => l.map(cellule).join(","))].join("\r\n") + "\r\n";
  }
  const nomFichier = (nom, ext) => `bra-${ecran}-${nom}.${ext}`.replace(/[^\w.-]+/g, "-");

  function barre(svg) {
    const hote = svg.closest(".plot") || svg.parentNode;
    let b = hote.nextElementSibling;
    if (b && b.classList.contains("exports")) return b;
    b = document.createElement("div");
    b.className = "exports";
    b.innerHTML = `<a class="exp-csv" role="button">Exporter CSV</a><button type="button" class="exp-png">Exporter PNG</button>`;
    hote.insertAdjacentElement("afterend", b);
    b.querySelector(".exp-png").addEventListener("click", () => {
      const d = registre.get(svg);
      png(svg).then(url => telecharger(url, nomFichier(d ? d.nom : "graphe", "png")));
    });
    return b;
  }
  function telecharger(url, fichier) {
    const a = document.createElement("a");
    a.href = url; a.download = fichier;
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* Enregistre les donnees d'un graphe. A appeler a chaque trace : le lien CSV est
     remplace, il reflete donc toujours l'etat affiche (filtres compris).
     colonnes : [nom, ...] ; lignes : [[valeur, ...], ...] en valeurs brutes
     (nombres non formates, decimale au point, null = vide). */
  function enregistrer(svg, d) {
    if (typeof svg === "string") svg = document.getElementById(svg);
    if (!svg) return;
    registre.set(svg, d);
    const a = barre(svg).querySelector(".exp-csv");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(texteCsv(d));
    a.download = nomFichier(d.nom, "csv");
    a.dataset.lignes = d.lignes.length;
  }

  /* PNG : le SVG de la page s'appuie sur des variables CSS et des classes qui
     n'existent pas une fois l'image sortie de la page. On recopie donc les
     proprietes calculees de chaque noeud, puis on ajoute un titre et l'attribution
     sur fond plein. Retourne une promesse de data URL. */
  const PROPS = ["fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linejoin", "stroke-linecap", "opacity",
    "fill-opacity", "stroke-opacity", "font-family", "font-size", "font-weight", "text-anchor", "dominant-baseline", "letter-spacing"];
  function figer(origine, copie) {
    const cs = getComputedStyle(origine);
    for (const p of PROPS) copie.style.setProperty(p, cs.getPropertyValue(p));
    const a = origine.children, b = copie.children;
    for (let i = 0; i < a.length; i++) figer(a[i], b[i]);

    const L = vb && vb.width ? vb.width : Math.round(r.width), H = vb && vb.height ? vb.height : Math.round(r.height);
    const copie = svg.cloneNode(true);
    figer(svg, copie);
    copie.querySelectorAll("title").forEach(t => t.remove());
    copie.setAttribute("x", 0); copie.setAttribute("y", 30);
    copie.setAttribute("width", L); copie.setAttribute("height", H);
    copie.setAttribute("viewBox", `0 0 ${L} ${H}`);
    const cs = getComputedStyle(document.body);
    const fond = cs.getPropertyValue("background-color"), encre = cs.getPropertyValue("color");
    const titre = (svg.closest(".panel") || document).querySelector("h2");
    const d = registre.get(svg);
    const pied = `${attribution.donnees}` + (attribution.archive ? `, archive arrêtée au ${attribution.archive}` : "");
    const EXTRA = attribution.contours ? 68 : 54;       // une ligne de plus pour les contours : sinon elle deborde
    const ext = document.createElementNS(NS_SVG, "svg");
    ext.setAttribute("xmlns", NS_SVG);
    ext.setAttribute("width", L); ext.setAttribute("height", H + EXTRA);
    ext.setAttribute("viewBox", `0 0 ${L} ${H + EXTRA}`);
    const fondR = document.createElementNS(NS_SVG, "rect");
    fondR.setAttribute("width", L); fondR.setAttribute("height", H + EXTRA); fondR.setAttribute("fill", fond);
    ext.appendChild(fondR);
    const texte = (y, taille, s, op) => {
      const t = document.createElementNS(NS_SVG, "text");
      t.setAttribute("x", 12); t.setAttribute("y", y);
      t.setAttribute("font-size", taille); t.setAttribute("fill", encre);
      t.setAttribute("font-family", "system-ui, sans-serif"); t.setAttribute("opacity", op);
      t.textContent = s; ext.appendChild(t);
    };
    texte(20, 15, ((d && d.titre) || (titre ? titre.textContent : "")), 1);
    ext.appendChild(copie);
    texte(H + 46, 11, pied, .7);
    if (attribution.contours) texte(H + 61, 11, attribution.contours, .7);
    const xml = new XMLSerializer().serializeToString(ext);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = L * 2; c.height = (H + EXTRA) * 2;
        const g = c.getContext("2d");
        g.scale(2, 2); g.drawImage(img, 0, 0, L, H + EXTRA);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = () => reject(new Error("rasterisation impossible"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    });
  }

  /* Texte replie : une phrase visible, le reste dans un « + details » (aucun texte supprime,
     les exports et les tests le lisent toujours). `bloc` : le repli occupe sa propre ligne. */
  function plus(detail, titre = "détails", bloc = false) {
    return detail ? `<details class="plus${bloc ? " bloc" : ""}"><summary>${titre}</summary><span class="corps">${detail}</span></details>` : "";
  }

  return { demarrer, lire, ecrire, enregistrer, png, registre, plus };
})();

const pad = n => String(n).padStart(2, "0");

function el(nom, attrs, parent) {
  const n = document.createElementNS(NS, nom);

}
function chemin(points) {           // points : [x, y] ou null ; un null rompt le trait
  let d = "", ouvert = false;
  for (const p of points) {

  return d;
}

const FEN = new Map(D.fenetres.map(f => [f.nom, f]));
const SAISON = new Map(D.saisons.map(s => [s.nom, s]));
const MASSIF = new Map(D.massifs.map(m => [m.id, m]));
const TRANCHE = new Map(D.tranches.map(t => [t.nom, t]));
const COND = new Map(D.conditions.map(c => [c.cle, c]));
const COULEURS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
const MAX = D.max_courbes;
const O = D.orientations;
const libFen = f => f.nom === D.saison_complete ? "saison entière" : f.nom;
const pct = v => v == null ? "—" : Math.round(v * 100) + " %";
const comparables = m => MASSIF.get(m).saisons.filter(s => SAISON.get(s).comparable);

/* ---------- etat, porte par l'URL ---------- */
let xBrut = null;   // "saison" ou "choix" lu dans l'URL : rendu tel quel pour ne pas casser le mode de la comparaison
const etat = { x: "saisons", m: null, s: null, c: [], n: [], f: D.fenetre_defaut, k: "toutes", t: null, d: "rose" };
function lireUrl() {
  const p = PARTAGE.lire();
  xBrut = p.get("x");
  etat.x = xBrut === "massifs" ? "massifs" : "saisons";
  const m = +p.get("m");
  etat.m = MASSIF.has(m) ? m : (MASSIF.has(65) ? 65 : D.massifs[0].id);
  const saisons = MASSIF.get(etat.m).saisons;
  etat.s = saisons.includes(p.get("s")) ? p.get("s") : (comparables(etat.m).slice(-1)[0] || saisons[saisons.length - 1]);
  const c = (p.get("c") || "").split(",").filter(s => saisons.includes(s));
  etat.c = (c.length ? c : comparables(etat.m).slice(-2)).slice(0, MAX);
  const n = (p.get("n") || "").split(",").map(Number).filter(id => D.roses[id]?.[etat.s]);
  etat.n = (n.length ? n : defautMassifs()).slice(0, MAX);
  etat.f = FEN.has(p.get("f")) ? p.get("f") : D.fenetre_defaut;
  etat.k = COND.has(p.get("q")) ? p.get("q") : "toutes";
  etat.t = TRANCHE.has(p.get("t")) ? p.get("t") : D.tranches[D.tranches.length - 1].nom;
  etat.d = p.get("g") === "barres" ? "barres" : "rose";
}
/* Massifs de la meme zone que le massif lu et diffuses la saison lue : un point de depart lisible. */
function defautMassifs() {
  const zone = MASSIF.get(etat.m).zone;
  const memes = D.massifs.filter(x => x.zone === zone && D.roses[x.id]?.[etat.s]).map(x => x.id);
  return [etat.m, ...memes.filter(id => id !== etat.m)].filter(id => D.roses[id]?.[etat.s]).slice(0, 3);
}
function ecrireUrl() {
  // q (condition) et g (rose ou barres) : k et d ont deja un autre sens sur la comparaison et le tableau de bord.
  PARTAGE.ecrire({ x: etat.x === "massifs" ? "massifs" : (xBrut === "choix" || xBrut === "saison" ? xBrut : null), m: etat.m, s: etat.s, c: etat.c.join(","), n: etat.n.join(","), f: etat.f, q: etat.k, t: etat.t, g: etat.d });
}

/* ---------- entites comparees ---------- */
function entites() {
  const liste = etat.x === "saisons"
    ? etat.c.map(s => ({ mid: etat.m, saison: s, nom: s }))
    : etat.n.map(id => ({ mid: id, saison: etat.s, nom: MASSIF.get(id).nom }));
  return liste.map((en, k) => ({ ...en, couleur: COULEURS[k], comparable: SAISON.get(en.saison).comparable, motif: SAISON.get(en.saison).motif }));
}
const casier = (en, bloc) => D[bloc]?.[en.mid]?.[en.saison]?.[etat.f];

/* ---------- lignes de donnees : une par secteur, en jours ----------
   Chaque graphe se resume a des lignes {etiquette, jours, couverts} : c'est ce que dessinent
   les roses ET les barres, et ce qu'un export reprendrait tel quel. */
function lignesPentes(en) {
  const c = casier(en, "roses");
  if (!c) return null;
  const suf = etat.k === "toutes" ? "" : etat.k.replace("ge", "");
  const sig = c["s" + suf], couv = c["c" + suf];
  return { couverts: couv, lignes: O.map((o, i) => ({ etiquette: o, jours: sig[i], couverts: couv })) };
}
function lignesCroisement(en) {
  const c = casier(en, "vent")?.[etat.t];
  if (!c) return null;
  const total = c.reduce((a, x) => a + x[0], 0);
  return { couverts: total, lignes: O.map((o, i) => ({ etiquette: o, jours: c[i][1], couverts: c[i][0] })) };
}

/* ---------- dessin ---------- */
const frac = l => l.couverts ? l.jours / l.couverts : null;
function roseSvg(lignes, couleur) {
  const S = 240, cx = S / 2, cy = S / 2, R = 78;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${S} ${S}`);
  svg.setAttribute("role", "img");
  const pt = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  for (const g of [0.25, 0.5, 0.75, 1]) {
    el("circle", { cx, cy, r: R * g, fill: "none", stroke: "var(--grid)" }, svg);
    if (g === 0.5 || g === 1) el("text", { x: cx + 3, y: cy - R * g + 10, class: "tick" }, svg).textContent = pct(g);
  }
  lignes.forEach((l, i) => {
    const a = i * Math.PI / 4, w = Math.PI / 4 * 0.42;
    const f = frac(l), r = R * (f ?? 0);
    const [x1, y1] = pt(a - w, r), [x2, y2] = pt(a + w, r);
    const p = el("path", {
      d: `M${cx} ${cy}L${x1.toFixed(1)} ${y1.toFixed(1)}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z`,
      fill: couleur, "fill-opacity": 0.5, stroke: couleur, "stroke-width": 1.5, class: "wedge",
      "data-secteur": l.etiquette, "data-jours": l.jours, "data-couverts": l.couverts,
    }, svg);
    el("title", {}, p).textContent = `${l.etiquette} : ${l.jours} jours sur ${l.couverts} (${pct(f)})`;
    const [tx, ty] = pt(a, R + 14);
    el("text", { x: tx, y: ty + 4, "text-anchor": "middle", class: "etiq" }, svg).textContent = l.etiquette;
  });
  return svg;
}
function barresSvg(lignes, couleur) {
  const LB = 62, LARG = 330, H = 22, W = 470;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${lignes.length * H + 4}`);
  svg.setAttribute("role", "img");
  lignes.forEach((l, i) => {
    const y = i * H + 2, f = frac(l);
    el("text", { x: LB - 6, y: y + 14, "text-anchor": "end", class: "etiq" }, svg).textContent = l.etiquette;
    el("rect", { x: LB, y: y + 3, width: LARG - LB, height: 14, fill: "var(--surface-2)" }, svg);
    const b = el("rect", {
      x: LB, y: y + 3, width: Math.max(0, (LARG - LB) * (f ?? 0)), height: 14, fill: couleur, "fill-opacity": 0.6,
      stroke: couleur, class: "barre", "data-secteur": l.etiquette, "data-jours": l.jours, "data-couverts": l.couverts,
    }, svg);
    el("title", {}, b).textContent = `${l.etiquette} : ${l.jours} jours sur ${l.couverts} (${pct(f)})`;
    el("text", { x: LARG + 6, y: y + 14, class: "val" }, svg).textContent = `${pct(f)} · ${l.jours}/${l.couverts}`;
  });
  return svg;
}
function enTete(en, alt) {
  const div = document.createElement("div");
  div.className = "carte" + (en.comparable ? "" : " nc");
  div.dataset.entite = en.nom;
  const badge = en.comparable ? "" : `<span class="badge" title="${esc(en.motif || "")}">non comparable</span>`;
  div.innerHTML = `<h3 style="color:${en.couleur}"><span style="color:var(--ink)">${esc(en.nom)}</span>${badge}${alt ? `<span class="alt">${esc(D.altitude)}</span>` : ""}</h3>`;
  return div;
}
/* Le graphe vit dans un .plot : la barre d'export s'insere apres lui, dans la carte, et non comme cellule de la grille. */
function enveloppe(svg) {
  const d = document.createElement("div");
  d.className = "plot";
  d.appendChild(svg);
  return d;
}
function carte(en, donnees, { forme, vide, alt }) {
  const div = enTete(en, alt);
  if (!donnees || !donnees.couverts) {
    div.insertAdjacentHTML("beforeend", `<p class="vide">${vide}</p>`);
  } else {
    div.appendChild(enveloppe(forme === "rose" ? roseSvg(donnees.lignes, en.couleur) : barresSvg(donnees.lignes, en.couleur)));
    div.insertAdjacentHTML("beforeend", `<p class="cov"><b>${donnees.couverts}</b> jours couverts${en.motif ? ` · ${esc(en.motif)}` : ""}</p>`);
  }
  return div;
}
const COLONNES = ["entite", "massif_id", "saison", "secteur", "jours", "jours_couverts", "frequence", "remarque"];
function grille(id, liste, lignes, opts) {
  const g = $(id);
  g.innerHTML = "";
  for (const en of liste) {
    const donnees = lignes(en);
    const div = carte(en, donnees, opts);
    g.appendChild(div);
    const svg = div.querySelector("svg");
    // Export : les lignes {secteur, jours, couverts} que la trace vient de dessiner.
    if (svg && donnees) PARTAGE.enregistrer(svg, {
      nom: `${id.slice(2)}-${en.mid}-${en.saison}-${etat.f}-${id === "g-pentes" ? etat.k : etat.t}`,
      titre: `${id === "g-pentes" ? "Rose des pentes" : "Croisement vent × orientation"} — ${en.nom}, fenêtre ${etat.f}`,
      colonnes: COLONNES,
      lignes: donnees.lignes.map(l => [en.nom, en.mid, en.saison, l.etiquette, l.jours, l.couverts, frac(l), en.comparable ? "" : "non comparable : " + en.motif]),
    });
  }
}

/* Situations : barres groupees, dominante puis secondaire, un code par ligne. */
function carteSituations(en) {
  const c = casier(en, "situations");
  const div = enTete(en, true);
  if (!c) {
    const avant = D.situations_depuis && en.saison < D.situations_depuis;

      ? `Aucune situation typique publiée : elles n'existent qu'à partir de la saison ${esc(D.situations_depuis)}. Ce n'est pas un zéro.`
      : "Aucun jour couvert avec situation typique."}</p>`);
    return div;
  }
  const codes = Object.keys(D.libelles_sat).map(Number);
  const jours = (rang, code) => c.l.filter(x => x[0] === rang && x[1] === code).reduce((a, x) => a + x[2], 0);
  const LB = 215, LARG = 365, H = 36, W = 480;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${codes.length * H + 4}`);
  svg.setAttribute("role", "img");
  codes.forEach((code, i) => {
    const y = i * H + 2;
    el("text", { x: LB - 6, y: y + 20, "text-anchor": "end", class: "etiq" }, svg).textContent = D.libelles_sat[code] + (code === D.code_sans_mecanisme ? " *" : "");
    [[1, "dominante", 0.65], [2, "secondaire", 0.3]].forEach(([rang, role, opa], k) => {
      const j = jours(rang, code), f = c.c ? j / c.c : 0;
      const b = el("rect", {
        x: LB, y: y + 3 + k * 15, width: Math.max(0, (LARG - LB) * f), height: 12, fill: en.couleur, "fill-opacity": opa, stroke: en.couleur, class: "barre",
        "data-code": code, "data-role": role, "data-jours": j, "data-couverts": c.c,
      }, svg);
      el("title", {}, b).textContent = `${D.libelles_sat[code]}, ${role} : ${j} jours sur ${c.c} (${pct(f)})`;
      el("text", { x: LARG + 6, y: y + 13 + k * 15, class: "val" }, svg).textContent = `${role === "dominante" ? "D" : "S"} ${pct(f)} · ${j}`;
    });
  });
  div.appendChild(enveloppe(svg));
  PARTAGE.enregistrer(svg, {
    nom: `situations-${en.mid}-${en.saison}-${etat.f}`,
    titre: `Situations avalancheuses typiques — ${en.nom}, fenêtre ${etat.f}`,
    colonnes: ["entite", "massif_id", "saison", "code", "situation", "role", "jours", "jours_avec_situation", "remarque"],
    lignes: codes.flatMap(code => [[1, "dominante"], [2, "secondaire"]].map(([rang, role]) =>
      [en.nom, en.mid, en.saison, code, D.libelles_sat[code], role, jours(rang, code), c.c, en.comparable ? "" : "non comparable : " + en.motif])),
  });
  div.insertAdjacentHTML("beforeend", `<p class="cov"><b>${c.c}</b> jours avec situation dominante · D dominante, S secondaire, parts de ces jours · * ${esc(D.libelles_sat[D.code_sans_mecanisme])} : pas un mécanisme d'avalanche</p>`);
  return div;
}

/* ---------- assemblage ---------- */
function refusComparaison(liste) {
  return etat.x === "saisons" && liste.length >= 2 ? D.refus[etat.f] : null;
}
function remplirSelecteurs() {
  $("sm").innerHTML = D.massifs.map(m => `<option value="${m.id}">${esc(m.nom)}${m.departement ? " (" + esc(m.departement) + ")" : ""}</option>`).join("");
  $("sk").innerHTML = D.conditions.map(c => `<option value="${c.cle}">${esc(c.libelle)}</option>`).join("");
  // Une fenetre refusee reste offerte : le refus s'affiche, il ne se devine pas.
  $("sf").innerHTML = D.fenetres.map(f => `<option value="${f.nom}">${esc(f.nom === D.saison_complete ? "saison entière" : f.nom + " · " + f.libelle)}</option>`).join("");
  $("st").innerHTML = D.tranches.map(t => `<option value="${t.nom}">${esc(t.nom)} · ${esc(t.libelle)}</option>`).join("");
}
function puces(conteneur, ids, libelle, retirer) {
  $(conteneur).innerHTML = ids.map((id, k) => `<span class="puce" style="border-left-color:${COULEURS[k]}">${esc(libelle(id))}<button type="button" data-id="${esc(id)}" aria-label="Retirer ${esc(libelle(id))}">×</button></span>`).join("");
  $(conteneur).querySelectorAll("button").forEach(b => b.addEventListener("click", () => retirer(b.dataset.id)));
}
function ajout(select, options, pris, ajouter) {
  const plein = pris.length >= MAX;
  select.innerHTML = `<option value="">${plein ? `maximum ${MAX} entités` : "+ ajouter"}</option>`
    + options.filter(o => !pris.map(String).includes(String(o.id))).map(o => `<option value="${esc(o.id)}">${esc(o.libelle)}</option>`).join("");
  select.disabled = plein;
  select.onchange = () => { if (select.value) ajouter(select.value); };
}
function dessine() {
  const f = FEN.get(etat.f);
  const saisons = MASSIF.get(etat.m).saisons;
  $("sm").value = etat.m;
  $("ss").innerHTML = (etat.x === "massifs" ? D.saisons.map(s => s.nom) : saisons)
    .map(s => `<option value="${s}">${s}${SAISON.get(s).comparable ? "" : " (non comparable)"}</option>`).join("");
  $("ss").value = etat.s;
  $("sk").value = etat.k; $("sf").value = etat.f; $("st").value = etat.t;
  $("mode-saisons").setAttribute("aria-pressed", etat.x === "saisons");
  $("mode-massifs").setAttribute("aria-pressed", etat.x === "massifs");
  $("aff-rose").setAttribute("aria-pressed", etat.d === "rose");
  $("aff-barres").setAttribute("aria-pressed", etat.d === "barres");
  $("zone-massif").style.display = etat.x === "massifs" ? "none" : "";
  $("zone-saison").style.display = etat.x === "saisons" ? "none" : "";
  $("zone-choix").style.display = etat.x === "saisons" ? "" : "none";
  $("zone-massifs").style.display = etat.x === "massifs" ? "" : "none";
  puces("puces-saisons", etat.c, s => s + (SAISON.get(s).comparable ? "" : " (non comparable)"), s => change("c", etat.c.filter(x => x !== s)));
  ajout($("ajout-saison"), saisons.map(s => ({ id: s, libelle: s + (SAISON.get(s).comparable ? "" : " (non comparable)") })), etat.c, s => change("c", [...etat.c, s]));
  puces("puces-massifs", etat.n, id => MASSIF.get(+id).nom, id => change("n", etat.n.filter(x => x !== +id)));
  ajout($("ajout-massif"), D.massifs.filter(m => D.roses[m.id]?.[etat.s]).map(m => ({ id: m.id, libelle: m.nom })), etat.n, id => change("n", [...etat.n, +id]));

  ecrireUrl();
  const liste = entites();
  $("titre").innerHTML = etat.x === "massifs"
    ? `${esc(liste.map(en => en.nom).join(", "))}<small>saison ${esc(etat.s)}</small>`
    : `${esc(MASSIF.get(etat.m).nom)}<small>${esc(etat.c.join(" · "))}</small>`;
  const refus = refusComparaison(liste);
  $("alerte").innerHTML = refus ? `<b>Comparaison de saisons refusée sur la fenêtre ${esc(libFen(f))}.</b> ${esc(refus)} Choisissez la fenêtre <b>${esc(D.fenetre_defaut)}</b>, ou une seule saison.` : "";
  const cond = COND.get(etat.k), tr = TRANCHE.get(etat.t);
  const fenTxt = `fenêtre ${libFen(f)}${f.debut ? " (" + f.libelle + ")" : ""}`;
  $("alt-pentes").textContent = D.altitude;
  $("alt-sit").textContent = D.altitude;
  $("sous-pentes").innerHTML = `Part des jours où chaque orientation est signalée dans la rose du bulletin (${esc(cond.libelle)}).`
    + PARTAGE.plus(`<b>${esc(D.altitude)}</b> : le bulletin ne dit pas à quelle altitude la rose s'applique. ${esc(fenTxt)}. Même échelle (0 à 100 %) pour toutes les entités, jamais superposées.`);
  $("sous-croise").innerHTML = `Pour chaque direction de vent de la tranche <b>${esc(tr.nom)}</b> (${esc(tr.libelle)}), part des jours où la pente qu'il charge est signalée dans la rose.`
    + PARTAGE.plus(`La pente chargée est celle qui est opposée au vent (<b>${esc(D.altitude)}</b>). Une seule tranche à la fois : le croisement n'est jamais lu toutes tranches confondues. ${esc(fenTxt)}.`);
  $("sous-sit").innerHTML = `Situation dominante (D) et secondaire (S) du bulletin, en part des jours avec situation dominante. Depuis la saison <b>${esc(D.situations_depuis)}</b> seulement.`
    + PARTAGE.plus(`<b>${esc(D.altitude)}</b>. Libellés inférés du descriptif (glossaire 2.7). ${esc(fenTxt)}.`);

  if (refus) {
    for (const id of ["g-pentes", "g-croise", "g-sit"]) $(id).innerHTML = "";
  } else {
    const sansVent = `Aucun vent directionnel publié pour la tranche ${tr.nom} (${tr.libelle}).`;
    grille("g-pentes", liste, lignesPentes, { forme: etat.d, alt: true, vide: "Aucun jour couvert sur cette fenêtre." });
    if (D.vent) {
      grille("g-croise", liste, lignesCroisement, { forme: "barres", alt: true, vide: sansVent });
    } else {
      $("g-croise").innerHTML = `<p class="vide">Cet entrepôt n'a pas de bloc météo : vent indisponible.</p>`;
    }
    $("g-sit").innerHTML = "";
    for (const en of liste) $("g-sit").appendChild(carteSituations(en));
  }
  notes();
  const m = MASSIF.get(etat.x === "massifs" ? etat.n[0] : etat.m);
  $("attrib").textContent = m && m.dernier_bulletin && m.dernier_bulletin !== D.archive_jusqu_au ? `Dernier bulletin de ${m.nom} : ${dateFr(m.dernier_bulletin)}` : "";
  document.title = `Exploration — ${m ? m.nom : ""}`;
}
function notes() {
  const n = [
    `Chaque fréquence est un nombre de jours rapporté aux jours couverts avec un indice de risque ; les deux nombres sont affichés. Une fréquence n'est pas une intensité.`,
    `La rose du bulletin signale souvent beaucoup de secteurs à la fois : un secteur signalé presque tous les jours discrimine peu. Les roses se comparent côte à côte, jamais superposées.`,
    `Comparer des saisons n'est permis que sur la fenêtre ${D.fenetre_defaut} : avant ${D.fin_sentinelle}, la sentinelle d'encodage des jours sans enneigement fait varier le dénominateur.`,
    `Le vent est la prévision du bulletin (${D.origine_vent}) ; son altitude est réelle et se lit par tranche. Une tranche sans vent publié reste vide, elle n'est pas complétée.`,
  ];
  $("notes").innerHTML = `<details class="plus bloc"><summary>Notes de lecture</summary><ul>${n.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>`;
}
function change(cle, valeur) {
  etat[cle] = valeur;
  if (cle === "m") {
    const s = MASSIF.get(etat.m).saisons;
    if (!s.includes(etat.s)) etat.s = comparables(etat.m).slice(-1)[0] || s[s.length - 1];
    etat.c = etat.c.filter(x => s.includes(x));
    if (!etat.c.length) etat.c = comparables(etat.m).slice(-2);
  }
  if (cle === "s") {
    etat.n = etat.n.filter(id => D.roses[id]?.[etat.s]);
    if (etat.x === "massifs" && !etat.n.length) etat.n = defautMassifs();
  }
  dessine();
}
$("mode-saisons").addEventListener("click", () => change("x", "saisons"));
$("mode-massifs").addEventListener("click", () => {
  if (!D.roses[etat.m]?.[etat.s]) etat.s = comparables(etat.m).slice(-1)[0];
  if (!etat.n.length) etat.n = defautMassifs();
  change("x", "massifs");
});
$("aff-rose").addEventListener("click", () => change("d", "rose"));
$("aff-barres").addEventListener("click", () => change("d", "barres"));
$("sm").addEventListener("change", e => change("m", +e.target.value));
$("ss").addEventListener("change", e => change("s", e.target.value));
$("sk").addEventListener("change", e => change("k", e.target.value));
$("sf").addEventListener("change", e => change("f", e.target.value));
$("st").addEventListener("change", e => change("t", e.target.value));
addEventListener("hashchange", () => { lireUrl(); dessine(); });

PARTAGE.demarrer({ ecran: "exploration", ...D.partage });
remplirSelecteurs();
lireUrl();
dessine();
</script>
</html>
