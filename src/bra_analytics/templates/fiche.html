<script>
const D = __DONNEES__;
/* Les bornes de fenetre et les seuils viennent du payload : definis une seule fois cote Python. */
const FEN = new Map(D.fenetres.map(f => [f.nom, f]));
const COEUR = FEN.get(D.fenetre_defaut);
const SAISON = new Map(D.saisons.map(s => [s.nom, s]));
const MASSIF = new Map(D.massifs.map(m => [m.id, m]));
const SLOT = new Map(D.axe.map((c, i) => [c, i]));

/* ---------- etat, porte par l'URL ---------- */
const etat = { m: null, s: null, a: "cal", t: "moyenne", f: D.fenetre_defaut, o: true };
/* Premiere tranche qui porte du vent pour ce massif (Aspe n'a que basse et haute). */
function trancheDefaut(m) {
  const t = D.tranches.find(t => Object.values(D.series[m]).some(e => e.vent?.[t.nom]));
  return t ? t.nom : D.tranches[0].nom;
}
function lireUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  const m = +p.get("m");
  etat.m = MASSIF.has(m) ? m : (MASSIF.has(65) ? 65 : D.massifs[0].id);
  const saisons = MASSIF.get(etat.m).saisons;
  etat.s = saisons.includes(p.get("s")) ? p.get("s") : saisons[saisons.length - 1];
  etat.a = p.get("a") === "rang" ? "rang" : "cal";
  etat.t = D.tranches.some(t => t.nom === p.get("t")) ? p.get("t") : trancheDefaut(etat.m);
  etat.f = FEN.has(p.get("f")) ? p.get("f") : D.fenetre_defaut;
  etat.o = p.get("o") !== "0";
}
function ecrireUrl() {
  const p = new URLSearchParams({ m: etat.m, s: etat.s, a: etat.a, t: etat.t, f: etat.f, o: etat.o ? 1 : 0 });
  history.replaceState(null, "", "#" + p);
}

/* ---------- axe : chaque jour d'une serie recoit une abscisse ----------
   Calendrier : la case `mm-jj` (le 29 fevrier a la sienne). Jour de saison :
   le rang depuis le premier jour de risque du massif (glossaire), 1 = premier
   jour. La bande de reference existe sur les deux axes, calculee cote Python
   avec la meme population. */
function abscisse(e, i) {
  return etat.a === "cal" ? SLOT.get(mmdd(T0(e.origine) + i * DAY)) : i - e.decalage_rang + 1;
}
function domaine() {
  const m = MASSIF.get(etat.m);
  let lo = Infinity, hi = -Infinity;
  for (const s of m.saisons) {
    const e = D.series[etat.m][s];
    for (const i of [0, e.longueur - 1]) { const x = abscisse(e, i); lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  return [lo, hi];
}
/* Fenetre `coeur` en abscisses, pour une saison. */
function bornesCoeur(saison, e) {
  const y = +saison.slice(0, 4);
  const d0 = Date.UTC(y, COEUR.debut[0] - 1, COEUR.debut[1]);
  const d1 = Date.UTC(y + 1, COEUR.fin[0] - 1, COEUR.fin[1]);
  const o = T0(e.origine);
  const i0 = Math.round((d0 - o) / DAY), i1 = Math.round((d1 - o) / DAY);
  return [i0, i1];
}
function dansCoeur(saison, e, i) {
  const [i0, i1] = bornesCoeur(saison, e);
  return i >= i0 && i <= i1;
}

/* ---------- traces ---------- */
const W = 1100, L = 54, R = 14, TOP = 10, BAND = 22;

/* Un graphe : cadre, axes, fond de la fenetre coeur, bande de couverture. Renvoie un contexte de trace. */
function cadre(svgId, hauteur, [ymin, ymax], ticksY, unite) {
  const svg = $(svgId);
  svg.innerHTML = "";
  const H = TOP + hauteur + BAND + 34;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [x0, x1] = domaine();
  const px = x => L + (x - x0 + 0.5) / (x1 - x0 + 1) * (W - L - R);
  const py = y => TOP + (1 - (y - ymin) / (ymax - ymin)) * hauteur;
  const g = { svg, H, hauteur, px, py, x0, x1, ymin, ymax };

  // fond coeur de la saison lue
  const e = D.series[etat.m][etat.s];
  const [i0, i1] = bornesCoeur(etat.s, e);
  const a0 = abscisse(e, i0), a1 = abscisse(e, i1);
  el("rect", { x: px(Math.max(a0, x0)) - (W - L - R) / (x1 - x0 + 1) / 2, y: TOP, width: Math.max(0, px(Math.min(a1, x1)) - px(Math.max(a0, x0)) + (W - L - R) / (x1 - x0 + 1)), height: hauteur, fill: "var(--coeur)" }, svg);

  for (const t of ticksY) {
    el("line", { x1: L, x2: W - R, y1: py(t), y2: py(t), stroke: "var(--grid)" }, svg);
    el("text", { x: L - 7, y: py(t) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = t;
  }
  if (unite) el("text", { x: 4, y: TOP + 8, class: "tick" }, svg).textContent = unite;

  // graduation de l'axe des x
  const yAxe = TOP + hauteur;
  el("line", { x1: L, x2: W - R, y1: yAxe, y2: yAxe, stroke: "var(--rule)" }, svg);
  if (etat.a === "cal") {
    D.axe.forEach((c, i) => {
      if (i < x0 || i > x1 || c.slice(3) !== "01") return;
      el("line", { x1: px(i), x2: px(i), y1: yAxe, y2: yAxe + 4, stroke: "var(--rule)" }, svg);
      el("text", { x: px(i), y: yAxe + BAND + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = MOIS[+c.slice(0, 2) - 1];
    });
  } else {
    for (let r = 1; r <= x1; r += 30) {
      el("line", { x1: px(r), x2: px(r), y1: yAxe, y2: yAxe + 4, stroke: "var(--rule)" }, svg);
      el("text", { x: px(r), y: yAxe + BAND + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = "j" + r;
    }
  }
  return g;
}

/* Bande de couverture : une cellule par jour de la periode de diffusion, pleine si la valeur existe. */
function couverture(g, e, valeurs, debut, fin) {
  const y = g.hauteur + TOP + 6, h = BAND - 12, larg = (W - L - R) / (g.x1 - g.x0 + 1);
  let n = 0, total = 0;
  for (let i = debut; i <= fin; i++) {
    total++;
    const ok = valeurs[i] != null;
    if (ok) n++;
    el("rect", { x: g.px(abscisse(e, i)) - larg / 2, y, width: Math.max(larg, 0.8), height: h, fill: ok ? "var(--ink-muted)" : "var(--manque)", opacity: ok ? 0.45 : 0.9 }, g.svg);
  }
  return { n, total };
}
function legendeCov(id, c, extra) {
  const pct = c.total ? (100 * c.n / c.total).toFixed(1).replace(".", ",") : "—";
  const trous = c.total - c.n;
  $(id).innerHTML = `Couverture : <b>${c.n} jours avec valeur sur ${c.total}</b> de la période de diffusion (${pct} %)`
    + (trous ? ` · <span class="trou">${trous} jour${trous > 1 ? "s" : ""} sans valeur</span> (cellules rouges sous l'axe)` : "")
    + (extra ? " · " + extra : "");
}

/* ---------- lecture des series de la saison ---------- */
/* Periode d'un bloc : etendue du risque elargie a celle des valeurs du bloc, pour ne rien tronquer. */
function etendueBloc(e, valeurs) {
  let [a, z] = etendueRisque(e);
  valeurs.forEach((v, i) => { if (v != null) { if (a < 0 || i < a) a = i; if (i > z) z = i; } });
  return [a, z];
}
function etendueRisque(e) {
  let a = -1, b = -1;
  for (let i = 0; i < e.risque.length; i++) if (e.risque[i] !== ".") { if (a < 0) a = i; b = i; }
  return [a, b];
}
const niveauxRisque = e => [...e.risque].map(c => c === "." || c === "0" ? null : +c);

function curseur(g, id, rendu) {
  const ligne = el("line", { y1: TOP, y2: TOP + g.hauteur, stroke: "var(--ink-2)", "stroke-dasharray": "3 3", opacity: 0, class: "curseur" }, g.svg);
  const cible = el("rect", { x: L, y: TOP, width: W - L - R, height: g.hauteur + BAND, fill: "transparent" }, g.svg);
  const tip = $("tip");
  cible.addEventListener("mousemove", ev => {
    const r = g.svg.getBoundingClientRect();
    const xv = (ev.clientX - r.left) / r.width * W;
    const x = Math.round((xv - L) / (W - L - R) * (g.x1 - g.x0 + 1) + g.x0 - 0.5);
    const html = rendu(x);
    document.querySelectorAll(".curseur").forEach(c => { c.setAttribute("opacity", 1); c.setAttribute("x1", g.px(x)); c.setAttribute("x2", g.px(x)); });
    if (!html) { tip.style.opacity = 0; return; }
    tip.innerHTML = html;
    tip.style.opacity = 1;
    tip.style.left = Math.min(innerWidth - 270, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  cible.addEventListener("mouseleave", () => {
    tip.style.opacity = 0;
    document.querySelectorAll(".curseur").forEach(c => c.setAttribute("opacity", 0));
  });
}
function decalageInverse(e, x) {     // abscisse -> decalage en jours depuis l'origine de la serie
  if (etat.a === "rang") return x - 1 + e.decalage_rang;
  const o = T0(e.origine);
  for (let i = 0; i < e.longueur; i++) if (SLOT.get(mmdd(o + i * DAY)) === x) return i;
  return -1;
}
const jourTxt = (e, i) => dateFr(new Date(T0(e.origine) + i * DAY).toISOString().slice(0, 10));
const autresSaisons = () => MASSIF.get(etat.m).saisons.filter(s => s !== etat.s && SAISON.get(s).comparable);

/* ---------- graphe 1 : risque ---------- */
function grapheRisque() {
  const e = D.series[etat.m][etat.s];
  const niv = niveauxRisque(e);
  const g = cadre("g-risque", 210, [0.5, 5.5], [1, 2, 3, 4, 5], "indice");

  // bande mediane / interquartile : fenetre coeur, saisons comparables, >= min_saisons
  const b = (D.bandes[etat.a === "cal" ? "calendaire" : "rang"] || {})[etat.m];
  let nBande = 0;
  if (b) {
    const cases = etat.a === "cal" ? D.axe.length : D.rang_max;
    const abs = k => etat.a === "cal" ? k : k + 1;
    let haut = [], bas = [];
    const ferme = () => {
      if (haut.length) {
        el("path", { d: "M" + haut.concat(bas.reverse()).map(p => p.map(v => v.toFixed(1)).join(" ")).join("L") + "Z", fill: "var(--band)", opacity: 0.28 }, g.svg);
      }
      haut = []; bas = [];
    };
    const med = [];
    for (let k = 0; k < cases; k++) {
      const x = abs(k);
      if (b.q1[k] == null || x < g.x0 || x > g.x1) { ferme(); med.push(null); continue; }
      haut.push([g.px(x), g.py(b.q3[k] + 0.5)]);   // un niveau s'etend sur +-0,5 : le quartile est un niveau, pas un point
      bas.push([g.px(x), g.py(b.q1[k] - 0.5)]);
      med.push([g.px(x), g.py(b.mediane[k])]);
      nBande++;
    }
    ferme();
    el("path", { d: chemin(med), fill: "none", stroke: "var(--band)", "stroke-width": 2 }, g.svg);
  }

  // autres saisons : traits fins, dans la seule fenetre coeur
  if (etat.o) {
    for (const s of autresSaisons()) {
      const o = D.series[etat.m][s];
      const n = niveauxRisque(o);
      const pts = n.map((v, i) => v == null || !dansCoeur(s, o, i) ? null : [g.px(abscisse(o, i)), g.py(v)]);
      el("path", { d: chemin(pts), fill: "none", stroke: "var(--ink-muted)", "stroke-width": 0.8, opacity: 0.35 }, g.svg);
    }
  }
  // saison lue
  el("path", { d: chemin(niv.map((v, i) => v == null ? null : [g.px(abscisse(e, i)), g.py(v)])), fill: "none", stroke: "var(--s1)", "stroke-width": 1.8, "stroke-linejoin": "round" }, g.svg);
  // jours publies sans indice : marques sur l'axe, ni zero ni trou
  [...e.risque].forEach((c, i) => { if (c === "0") el("circle", { cx: g.px(abscisse(e, i)), cy: g.py(0.5), r: 2.2, fill: "none", stroke: "var(--ink-muted)" }, g.svg); });

  const [a, z] = etendueRisque(e);
  const c = couverture(g, e, niv.map((v, i) => e.risque[i] === "." ? null : 1), a, z);
  const sans = [...e.risque].filter(x => x === "0").length;
  legendeCov("cov-risque", c, sans ? `${sans} jour${sans > 1 ? "s" : ""} publié${sans > 1 ? "s" : ""} sans indice (cercles sur l'axe)` : "");
  $("sous-risque").innerHTML = `Saison <b>${esc(etat.s)}</b>${SAISON.get(etat.s).comparable ? "" : " (non comparable)"} en bleu ; bande grise : médiane et intervalle interquartile `
    + `de l'indice, <b>fenêtre ${esc(D.fenetre_defaut)}</b> (${esc(fenetreTexte)}), ${nBande ? `sur les saisons comparables, une case n'étant tracée qu'à partir de ${D.min_saisons_bande} saisons` : "<b>non calculable</b> pour ce massif (moins de " + D.min_saisons_bande + " saisons comparables)"}`
    + ` — la saison lue y entre quand elle est comparable. Fond bleuté : la fenêtre ${esc(D.fenetre_defaut)} de la saison lue.`
    + (etat.f === D.saison_complete ? ` Les indicateurs portent sur la saison entière, mais la bande et les autres saisons restent sur la fenêtre ${esc(D.fenetre_defaut)} : hors de celle-ci, les indices ne se comparent pas.` : "");
  $("lg-risque").innerHTML = `<span><i class="sw" style="background:var(--s1)"></i>saison lue</span>`
    + `<span><i class="sw" style="background:var(--band)"></i>médiane</span><span><i class="sw box" style="background:var(--band);opacity:.35"></i>quartiles</span>`
    + (etat.o ? `<span><i class="sw" style="background:var(--ink-muted);opacity:.5;height:1px"></i>autres saisons comparables (fenêtre ${esc(D.fenetre_defaut)} seulement)</span>` : "");
  curseur(g, "g-risque", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    const c = e.risque[i];
    const txt = c === "." ? "aucun bulletin" : c === "0" ? "publié sans indice" : `indice <b>${c}</b> — ${NIVEAUX[+c - 1]}`;
    let bande = "";
    if (b) { const k = etat.a === "cal" ? x : x - 1; if (b.q1[k] != null) bande = `<br>référence : médiane ${fr(b.mediane[k])}, quartiles ${b.q1[k]}–${b.q3[k]}`; }
    return `<b>${jourTxt(e, i)}</b> · jour ${i - e.decalage_rang + 1} de la saison<br>${txt}${bande}`;
  });
}

/* ---------- graphe 2 : epaisseur de neige ---------- */
function grapheNeige() {
  const e = D.series[etat.m][etat.s];
  const tr = etat.t;
  const mx = Math.max(10, ...[etat.s, ...autresSaisons()].flatMap(s => {
    const n = D.series[etat.m][s].neige?.[tr];
    return n ? [...nombres(n.nord), ...nombres(n.sud)].filter(v => v != null) : [];
  }));
  const haut = Math.ceil(mx / 100) * 100;
  const g = cadre("g-neige", 150, [0, haut], [0, haut / 2, haut], "cm");
  if (etat.o) {
    for (const s of autresSaisons()) {
      const o = D.series[etat.m][s], n = o.neige?.[tr];
      if (!n) continue;
      for (const [v, col] of [["nord", "var(--s1)"], ["sud", "var(--s2)"]])
        el("path", { d: chemin(nombres(n[v]).map((y, i) => y == null ? null : [g.px(abscisse(o, i)), g.py(y)])), fill: "none", stroke: col, "stroke-width": 0.8, opacity: 0.18 }, g.svg);
    }
  }
  const n = e.neige?.[tr];
  const nord = nombres(n?.nord), sud = nombres(n?.sud);
  if (n) for (const [vals, col] of [[nord, "var(--s1)"], [sud, "var(--s2)"]])
    el("path", { d: chemin(vals.map((y, i) => y == null ? null : [g.px(abscisse(e, i)), g.py(y)])), fill: "none", stroke: col, "stroke-width": 1.8, "stroke-linejoin": "round" }, g.svg);
  const vals = nord.map((v, i) => v ?? sud[i] ?? null);
  const [a, z] = etendueBloc(e, vals);
  const c = couverture(g, e, vals, a, z);
  const parVersant = v => nombres(n?.[v]).filter(x => x != null).length;
  const alt = e.altitudes_neige?.[tr]?.join(" / ");
  legendeCov("cov-neige", c, n ? `un jour compte dès qu'un versant est relevé (nord ${parVersant("nord")} j, sud ${parVersant("sud")} j)` : "aucun palier d'enneigement dans cette tranche pour cette saison");
  $("sous-neige").innerHTML = `Épaisseur du manteau au palier le plus haut de la tranche <b>${esc(trancheLibelle(tr))}</b>${alt ? ` (<b>${alt} m</b> cette saison ; le palier change d'époque)` : ""}, `
    + `versants nord et sud. Valeur indicative rattachée à l'altitude de référence, pas une mesure. Indexée sur la date que décrit le relevé (<code>jour</code>). Traits fins : autres saisons comparables, sur toute leur période, sans restriction à la fenêtre ${esc(D.fenetre_defaut)}.`;
  $("lg-neige").innerHTML = `<span><i class="sw" style="background:var(--s1)"></i>versant nord</span><span><i class="sw" style="background:var(--s2)"></i>versant sud</span>`
    + (etat.o ? `<span><i class="sw" style="height:1px;opacity:.4;background:var(--ink-muted)"></i>autres saisons comparables (traits fins)</span>` : "");
  curseur(g, "g-neige", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>nord : ${nord[i] == null ? "non relevé" : nord[i] + " cm"}<br>sud : ${sud[i] == null ? "non relevé" : sud[i] + " cm"}`;
  });
}

/* ---------- graphe 3 : isotherme 0 ---------- */
function grapheIso0() {
  const e = D.series[etat.m][etat.s];
  const iso = e.iso0;
  const tous = [etat.s, ...autresSaisons()].flatMap(s => { const o = D.series[etat.m][s].iso0; return o ? [...nombres(o.min), ...nombres(o.max)].filter(v => v != null) : []; });
  const hi = Math.max(1000, Math.ceil(Math.max(0, ...tous) / 1000) * 1000);
  const g = cadre("g-iso0", 150, [0, hi], Array.from({ length: hi / 1000 + 1 }, (_, k) => k * 1000), "m");
  if (etat.o) {
    for (const s of autresSaisons()) {
      const o = D.series[etat.m][s];
      if (!o.iso0) continue;
      el("path", { d: chemin(nombres(o.iso0.moyen).map((y, i) => y == null ? null : [g.px(abscisse(o, i)), g.py(y)])), fill: "none", stroke: "var(--ink-muted)", "stroke-width": 0.8, opacity: 0.3 }, g.svg);
    }
  }
  const mn = nombres(iso?.min), mxv = nombres(iso?.max), moy = nombres(iso?.moyen);
  // aire min-max, segment par segment : un trou ne se comble pas
  let h = [], b = [];
  const ferme = () => { if (h.length) el("path", { d: "M" + h.concat(b.reverse()).map(p => p.map(v => v.toFixed(1)).join(" ")).join("L") + "Z", fill: "var(--s1)", opacity: 0.22 }, g.svg); h = []; b = []; };
  mn.forEach((lo, i) => {
    if (lo == null || mxv[i] == null) { ferme(); return; }
    const x = g.px(abscisse(e, i)); h.push([x, g.py(mxv[i])]); b.push([x, g.py(lo)]);
  });
  ferme();
  el("path", { d: chemin(moy.map((y, i) => y == null ? null : [g.px(abscisse(e, i)), g.py(y)])), fill: "none", stroke: "var(--s1)", "stroke-width": 1.6 }, g.svg);
  const seuil = D.indicateurs[etat.m]?.[etat.s]?.[D.fenetre_defaut]?.meteo?.seuil_iso0_m
    ?? D.indicateurs[etat.m]?.[etat.s]?.[D.saison_complete]?.meteo?.seuil_iso0_m;
  if (seuil != null) {
    el("line", { x1: L, x2: W - R, y1: g.py(seuil), y2: g.py(seuil), stroke: "var(--s2)", "stroke-dasharray": "5 4" }, g.svg);
    el("text", { x: W - R - 4, y: g.py(seuil) - 4, "text-anchor": "end", class: "tick" }, g.svg).textContent = `seuil ${seuil} m`;
  }
  const [a, z] = etendueBloc(e, moy);
  const c = couverture(g, e, moy, a, z);
  legendeCov("cov-iso0", c, iso ? "" : "aucune prévision d'isotherme pour cette saison");
  $("sous-iso0").innerHTML = `Isotherme 0 °C <b>prévu</b> par le bulletin pour le jour de validité : moyenne des échéances 06 h et 12 h (trait) et amplitude min–max (aire). Prévision, pas observation. Trait fin : moyenne des autres saisons comparables, sur toute leur période, sans restriction à la fenêtre ${esc(D.fenetre_defaut)}.`;
  $("lg-iso0").innerHTML = `<span><i class="sw" style="background:var(--s1)"></i>moyenne du jour</span><span><i class="sw box" style="background:var(--s1);opacity:.3"></i>min–max</span>`
    + `<span><i class="sw" style="background:var(--s2)"></i>seuil de redoux</span>` + (etat.o ? `<span><i class="sw" style="height:1px;opacity:.5;background:var(--ink-muted)"></i>moyenne des autres saisons comparables</span>` : "");
  curseur(g, "g-iso0", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>` + (moy[i] == null ? "pas de prévision" : `moyenne ${moy[i]} m<br>min ${mn[i]} m · max ${mxv[i]} m`);
  });
}

/* ---------- graphe 4 : vent ---------- */
function grapheVent() {
  const e = D.series[etat.m][etat.s];
  const tr = etat.t;
  const v = nombres(e.vent?.[tr]);
  const hi = Math.max(D.seuil_vent_fort_kmh + 20, Math.ceil(Math.max(0, ...v.filter(x => x != null)) / 20) * 20);
  const g = cadre("g-vent", 130, [0, hi], [0, 50, 100, 150].filter(t => t <= hi), "km/h");
  const larg = (W - L - R) / (g.x1 - g.x0 + 1);
  v.forEach((y, i) => {
    if (y == null) return;
    el("rect", { x: g.px(abscisse(e, i)) - larg / 2, y: g.py(y), width: Math.max(larg - 0.4, 0.8), height: g.py(0) - g.py(y), fill: y > D.seuil_vent_fort_kmh ? "var(--s2)" : "var(--s1)", opacity: 0.8 }, g.svg);
  });
  el("line", { x1: L, x2: W - R, y1: g.py(D.seuil_vent_fort_kmh), y2: g.py(D.seuil_vent_fort_kmh), stroke: "var(--s2)", "stroke-dasharray": "5 4" }, g.svg);
  el("text", { x: W - R - 4, y: g.py(D.seuil_vent_fort_kmh) - 4, "text-anchor": "end", class: "tick" }, g.svg).textContent = `${D.seuil_vent_fort_kmh} km/h`;
  const [a, z] = etendueBloc(e, v);
  const c = couverture(g, e, v, a, z);
  const alt = e.altitudes_vent?.[tr]?.join(" / ");
  legendeCov("cov-vent", c, e.vent?.[tr] ? "" : "aucun vent prévu dans cette tranche pour cette saison");
  $("sous-vent").innerHTML = `Vitesse <b>prévue</b> la plus forte du jour (échéances 06 h et 12 h) dans la tranche <b>${esc(trancheLibelle(tr))}</b>${alt ? ` (altitude${alt.includes("/") ? "s" : ""} de vent : <b>${alt} m</b>)` : ""}. `
    + `Les vents relèvent de leur altitude, jamais de leur rang « bas / haut » dans le bulletin. Pas de fond de comparaison sur ce graphe.`;
  $("lg-vent").innerHTML = `<span><i class="sw box" style="background:var(--s1)"></i>vitesse</span><span><i class="sw box" style="background:var(--s2)"></i>au-dessus de ${D.seuil_vent_fort_kmh} km/h</span>`;
  curseur(g, "g-vent", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>` + (v[i] == null ? "pas de vent prévu" : `${v[i]} km/h`);
  });
}

const trancheLibelle = nom => { const t = D.tranches.find(t => t.nom === nom); return t ? `${nom} (${t.libelle})` : nom; };
const fenetreTexte = (() => { const f = COEUR; return `${f.debut[1]} ${MOIS[f.debut[0] - 1]} → ${f.fin[1]} ${MOIS[f.fin[0] - 1]}`; })();

/* ---------- indicateurs ---------- */
function tuile(k, v, n) { return `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`; }
function indicateurs() {
  const ind = D.indicateurs[etat.m]?.[etat.s] || {};
  const w = ind[etat.f] || {};
  const r = w.risque, fen = FEN.get(etat.f);
  const sais = SAISON.get(etat.s);
  const t = [];
  if (r) {
    const rep = MASSIF.get(etat.m).repere;
    const repere = etat.f === D.fenetre_defaut && rep && rep.risque_moyen != null && sais.comparable
      ? ` · moyenne du massif sur ${rep.saisons} saisons comparables : <b>${fr(rep.risque_moyen)}</b> (${rep.jours_avec_indice} j)` : "";
    t.push(tuile("Indice moyen", fr(r.risque_moyen), `sur ${r.jours_avec_indice} jours avec indice${r.jours_sans_indice ? `, ${r.jours_sans_indice} sans indice` : ""}${repere}`));
    t.push(tuile("Jours ≥ 3", r.jours_3_plus, `dont ${r.jours_4_plus} à 4 ou 5 (${r.jours_5} à 5), sur ${r.jours_avec_indice} jours`));
    t.push(tuile("Indice maximal", r.risque_max ?? "—", r.risque_max == null ? "aucun indice" : `atteint ${r.jours_au_max} jour${r.jours_au_max > 1 ? "s" : ""}, le ${dateFr(r.date_max)}`));
    t.push(tuile("Épisodes ≥ 3", r.episodes, `le plus long : ${fr(r.plus_long_episode)} jours`));
    t.push(tuile("Couverture", `${fr(r.couverture_pct)} %`, `${r.jours_couverts} jours sur ${r.jours_periode} de la fenêtre`));
  }
  const n = w.neige?.[etat.t];
  if (n) {
    t.push(tuile(`Neige · ${etat.t}`, `${fr(n.epaisseur_max_nord_cm)} cm`, `maximum au nord (${n.date_max_nord ? dateFr(n.date_max_nord) : "—"}) ; sud ${fr(n.epaisseur_max_sud_cm)} cm`));
    t.push(tuile("Jours enneigés", `${n.jours_enneiges_nord} / ${n.jours_observes_nord}`, `nord ; sud ${n.jours_enneiges_sud} / ${n.jours_observes_sud} jours observés`));
  }
  const cont = ind.continu;
  if (cont?.nord || cont?.sud) {
    const f = c => c && c.duree_jours != null ? `${c.duree_jours} j` : "—";
    t.push(tuile("Enneigement continu", f(cont.nord), `plus longue période sous ${(cont.nord || cont.sud).seuil_limite_m} m, nord ; sud ${f(cont.sud)} (saison entière)`));
  }
  const m = w.meteo;
  if (m && m.jours_avec_iso0) {
    t.push(tuile("Isotherme 0 °C", `${fr(m.iso0_min_m)}–${fr(m.iso0_max_m)} m`, `${m.jours_avec_iso0} jours ; ${m.jours_iso0_au_dessus_seuil} au-dessus de ${m.seuil_iso0_m} m ; ${m.episodes_redoux} redoux`));
  }
  const v = w.vent?.[etat.t];
  if (v) t.push(tuile(`Vent · ${etat.t}`, `${fr(v.vitesse_max_kmh)} km/h`, `maximum prévu ; ${v.jours_vent_fort} jours au-dessus de ${D.seuil_vent_fort_kmh} km/h sur ${v.jours_avec_vent}`));
  $("kpis").innerHTML = t.join("") || tuile("Indicateurs", "—", "aucune donnée pour cette combinaison");
}

/* ---------- avertissements et notes ---------- */
function alerte() {
  const s = SAISON.get(etat.s), f = FEN.get(etat.f);
  const a = [];
  if (!s.comparable) a.push(`<b>${esc(etat.s)} n'est pas une saison comparable</b> : ${esc(s.motif)}. Elle reste affichée, mais ne se compare à aucune autre.`);
  if (!f.comparable) a.push(`Indicateurs sur la <b>${esc(f.libelle)}</b> : lecture de cette saison isolément. L'indice moyen ne se compare pas à celui d'une autre saison hors de la fenêtre ${esc(D.fenetre_defaut)}, la sentinelle d'avant juin 2021 en altérant près de la moitié de l'écart.`);
  $("alerte").innerHTML = a.join("<br>");
}
function notes() {
  const m = MASSIF.get(etat.m);
  const n = [
    "Les trous sont des faits de l'archive, pas des défauts d'ingestion : ils s'affichent sans être comblés (cellules rouges sous chaque axe).",
    `Hors de la fenêtre ${esc(D.fenetre_defaut)} (fond bleuté), les jours sans enneigement d'avant juin 2021 sont sans indice, alors qu'ils reçoivent ensuite un indice réel : la bande grise et les autres saisons n'y sont donc pas tracées.`,
    "Un niveau de risque est ordinal : la bande donne des niveaux observés (quartiles), la moyenne des indicateurs est toujours accompagnée de son nombre de jours.",
    "Neige, isotherme et vent sont ceux du bulletin (valeurs indicatives et prévisions), non des mesures.",
  ];
  if (m.saisons.length < D.saisons.length) n.push(`Ce massif n'a des bulletins que sur ${m.saisons.length} des ${D.saisons.length} saisons de l'archive.`);
  $("notes").innerHTML = n.map(x => `<li>${x}</li>`).join("");
}

/* ---------- assemblage ---------- */
function remplirSelecteurs() {
  $("sm").innerHTML = D.massifs.map(m => `<option value="${m.id}">${esc(m.nom)}${m.departement ? " (" + esc(m.departement) + ")" : ""}</option>`).join("");
  $("st").innerHTML = D.tranches.map(t => `<option value="${t.nom}">${esc(t.nom)} · ${esc(t.libelle)}</option>`).join("");
  $("sf").innerHTML = D.fenetres.filter(f => f.nom === D.fenetre_defaut || f.nom === D.saison_complete)
    .map(f => `<option value="${f.nom}">${esc(f.nom === D.saison_complete ? "saison entière" : f.nom + " · " + fenetreTexte)}</option>`).join("");
}
function remplirSaisons() {
  $("ss").innerHTML = MASSIF.get(etat.m).saisons.map(s => `<option value="${s}">${s}${SAISON.get(s).comparable ? "" : " (non comparable)"}</option>`).join("");
}
function dessine() {
  $("sm").value = etat.m; remplirSaisons(); $("ss").value = etat.s; $("st").value = etat.t; $("sf").value = etat.f;
  $("ck-autres").checked = etat.o;
  $("ax-cal").setAttribute("aria-pressed", etat.a === "cal");
  $("ax-rang").setAttribute("aria-pressed", etat.a === "rang");
  const m = MASSIF.get(etat.m);
  $("titre").innerHTML = `${esc(m.nom)}<small>saison ${esc(etat.s)} · axe ${etat.a === "cal" ? "calendaire" : "en jours de saison"}</small>`;
  $("attrib").textContent = `${D.attribution}, archive arrêtée au ${dateFr(D.archive_jusqu_au)}`
    + (m.dernier_bulletin && m.dernier_bulletin !== D.archive_jusqu_au ? ` · dernier bulletin de ${m.nom} : ${dateFr(m.dernier_bulletin)}` : "");
  document.title = `${m.nom} ${etat.s} — fiche massif-saison`;
  alerte(); indicateurs();
  grapheRisque(); grapheNeige(); grapheIso0(); grapheVent();
  notes(); ecrireUrl();
}
function change(cle, valeur) {
  etat[cle] = valeur;
  if (cle === "m") {
    const s = MASSIF.get(etat.m).saisons; if (!s.includes(etat.s)) etat.s = s[s.length - 1];
    etat.t = trancheDefaut(etat.m);
  }
  dessine();
}
$("sm").addEventListener("change", e => change("m", +e.target.value));
$("ss").addEventListener("change", e => change("s", e.target.value));
$("st").addEventListener("change", e => change("t", e.target.value));
$("sf").addEventListener("change", e => change("f", e.target.value));
$("ax-cal").addEventListener("click", () => change("a", "cal"));
$("ax-rang").addEventListener("click", () => change("a", "rang"));
$("ck-autres").addEventListener("change", e => change("o", e.target.checked));
addEventListener("hashchange", () => { lireUrl(); dessine(); });

$("gen").textContent = `Page générée le ${dateFr(D.genere)}`;
remplirSelecteurs();
lireUrl();
dessine();
</script>
