<script>
const D = __DONNEES__;
/* Les bornes de fenetre et les seuils viennent du payload : definis une seule fois cote Python. */
const FEN = new Map(D.fenetres.map(f => [f.nom, f]));
const COEUR = FEN.get(D.fenetre_defaut);
const SAISON = new Map(D.saisons.map(s => [s.nom, s]));
const MASSIF = new Map(D.massifs.map(m => [m.id, m]));
const SLOT = new Map(D.axe.map((c, i) => [c, i]));
const METR = new Map(D.metriques.map(m => [m.cle, m]));
const MAX = D.max_courbes;
/* La saison lue est a l'encre ; les series comparees prennent bleu, orange, vert d'eau
   (--c1..--c3, validees deux a deux, daltonisme compris). Une couleur suit sa serie :
   memes teintes sur la courbe, les puces, le tableau et le classement. */
const LUE = "var(--ink)";
const COULEURS = ["var(--c1)", "var(--c2)", "var(--c3)"];
const libFen = f => f.nom === D.saison_complete ? "saison entière" : f.nom;
const jourLib = c => `${+c.slice(3)} ${MOIS[+c.slice(0, 2) - 1]}`;
const rangLib = r => r === 1 ? "1re" : `${r}e`;
const plur = (n, s, p) => `${n} ${n > 1 ? (p || s + "s") : s}`;

/* ---------- etat, porte par l'URL ----------
   m, s : la saison lue ; c : saisons du meme massif superposees ; n : massifs superposes
   sur la meme saison ; p : periode egale ; k, r, v : metrique, fenetre et versant du
   classement. Les cles c, n, p, k, v sont celles de l'ancien ecran de comparaison : un
   lien deja partage retrouve ses series (seule sa fenetre de classement, alors `f`,
   revient a coeur). */
const etat = { m: null, s: null, a: "cal", t: "moyenne", f: D.fenetre_defaut, o: true,
  c: [], n: [], p: true, k: D.metriques[0].cle, r: D.fenetre_defaut, v: "nord" };
/* Premiere tranche qui porte du vent pour ce massif (Aspe n'a que basse et haute). */
function trancheDefaut(m) {
  const t = D.tranches.find(t => Object.values(D.series[m]).some(e => e.vent?.[t.nom]));
  return t ? t.nom : D.tranches[0].nom;
}
/* Saisons et massifs superposes : jamais la serie lue elle-meme, plafond de MAX courbes en tout. */
function bornerComparees() {
  const saisons = MASSIF.get(etat.m).saisons;
  etat.c = [...new Set(etat.c)].filter(s => s !== etat.s && saisons.includes(s));
  etat.n = [...new Set(etat.n)].filter(id => id !== etat.m && D.series[id]?.[etat.s]);
  const place = MAX - 1;
  etat.c = etat.c.slice(0, place);
  etat.n = etat.n.slice(0, place - etat.c.length);
}
function lireUrl() {
  const p = PARTAGE.lire();
  const m = +p.get("m");
  etat.m = MASSIF.has(m) ? m : (MASSIF.has(65) ? 65 : D.massifs[0].id);
  const saisons = MASSIF.get(etat.m).saisons;
  etat.s = saisons.includes(p.get("s")) ? p.get("s") : saisons[saisons.length - 1];
  etat.a = p.get("a") === "rang" ? "rang" : "cal";
  etat.t = D.tranches.some(t => t.nom === p.get("t")) ? p.get("t") : trancheDefaut(etat.m);
  etat.f = FEN.get(p.get("f"))?.indicateurs ? p.get("f") : D.fenetre_defaut;
  etat.o = p.get("o") !== "0";
  etat.c = (p.get("c") || "").split(",").filter(Boolean);
  etat.n = (p.get("n") || "").split(",").filter(Boolean).map(Number);
  etat.p = p.get("p") !== "0";
  etat.k = METR.has(p.get("k")) ? p.get("k") : D.metriques[0].cle;
  etat.r = FEN.has(p.get("r")) ? p.get("r") : D.fenetre_defaut;
  etat.v = p.get("v") === "sud" ? "sud" : "nord";
  bornerComparees();
}
function ecrireUrl() {
  PARTAGE.ecrire({ m: etat.m, s: etat.s, a: etat.a, t: etat.t, f: etat.f, o: etat.o ? 1 : 0,
    c: etat.c.join(","), n: etat.n.join(","), p: etat.p ? 1 : 0, k: etat.k, r: etat.r, v: etat.v });
}

/* ---------- series comparees ----------
   Une entite est une serie (massif, saison). La premiere est la saison lue. */
const cacheSlots = new WeakMap();
function slots(e) {                  // abscisse calendaire (case de l'axe) de chaque jour de la serie
  let s = cacheSlots.get(e);
  if (!s) {
    const o = T0(e.origine);
    s = Int16Array.from({ length: e.longueur }, (_, i) => SLOT.get(mmdd(o + i * DAY)) ?? -1);
    cacheSlots.set(e, s);
  }
  return s;
}
/* Valeur d'un jour : undefined = jour sans bulletin, null = publie sans indice, nombre sinon. */
function valeurRisque(e, i) {
  const c = e.risque[i];
  return c === "." ? undefined : c === "0" ? null : +c;
}
function neige(e, tranche, versant) {
  const n = e.neige?.[tranche]?.[versant];
  if (!n) return null;
  return (e._n ??= {})[tranche + versant] ??= nombres(n);
}
function entite(mid, saison) {
  const e = D.series[mid][saison], s = SAISON.get(saison);
  return { mid, saison, e, comparable: s.comparable, motif: s.motif };
}
const comparees = () => [...etat.c.map(s => entite(etat.m, s)), ...etat.n.map(id => entite(id, etat.s))];
const entites = () => [entite(etat.m, etat.s), ...comparees()];
/* Nom d'une serie : la saison quand on compare des saisons, le massif quand on compare des
   massifs, les deux quand on melange. */
function nomEntite(en) {
  const massif = etat.n.length > 0, saison = etat.c.length > 0 || !massif;
  return [massif ? MASSIF.get(en.mid).nom : null, saison ? en.saison : null].filter(Boolean).join(" · ");
}

/* ---------- fenetre, periode commune, agregats ---------- */
function bornesFenetre(f) {
  if (!f.debut) return [0, D.axe.length - 1];
  return [SLOT.get(`${pad(f.debut[0])}-${pad(f.debut[1])}`), SLOT.get(`${pad(f.fin[0])}-${pad(f.fin[1])}`)];
}
/* Le bloc dit ce qu'est un jour "couvert" : un bulletin pour le risque, un releve pour la neige. */
const BLOC = {
  risque: { present: (en, i) => en.e.risque[i] !== "." },
  neige: { present: (en, i, o) => { const a = neige(en.e, o.t, o.v); return a != null && a[i] != null; } },
};
function etendue(en, bloc, [w0, w1], o) {
  const s = slots(en.e);
  let a = Infinity, b = -Infinity;
  for (let i = 0; i < en.e.longueur; i++) {
    if (s[i] < w0 || s[i] > w1 || !BLOC[bloc].present(en, i, o)) continue;
    a = Math.min(a, s[i]); b = Math.max(b, s[i]);
  }
  return a === Infinity ? null : [a, b];
}
/* Periode commune des series comparables ; les series non comparables ne la fixent pas
   (le confinement de 2019-2020 la ferait tomber a mi-mars pour tout le monde). Meme regle
   que `comparaison.periode_commune`, testee contre elle. */
function periode(liste, bloc, f, o = {}) {
  const w = bornesFenetre(f);
  // Jours calendaires de la periode : le 29 fevrier n'en est un que si une serie comparee l'a.
  const vus = new Set();
  liste.forEach(en => slots(en.e).forEach(x => vus.add(x)));
  const jours = (lo, hi) => { let n = 0; for (let x = lo; x <= hi; x++) if (vus.has(x)) n++; return n; };
  if (!etat.p) return { lo: w[0], hi: w[1], w, tronquee: false, limite: {}, vides: [], jours: jours(w[0], w[1]) };
  const base = liste.some(en => en.comparable) ? liste.filter(en => en.comparable) : liste;
  const ext = base.map(en => ({ en, r: etendue(en, bloc, w, o) }));
  const vides = ext.filter(x => !x.r).map(x => x.en);
  const pleines = ext.filter(x => x.r);
  if (!pleines.length) return { lo: 1, hi: 0, w, tronquee: true, limite: {}, vides, jours: 0 };
  const lo = Math.max(...pleines.map(x => x.r[0])), hi = Math.min(...pleines.map(x => x.r[1]));
  const qui = (cle, v) => pleines.filter(x => x.r[cle] === v).map(x => nomEntite(x.en));
  return {
    lo, hi, w, vides, jours: jours(lo, hi),
    tronquee: lo > w[0] || hi < w[1],
    limite: { debut: lo > w[0] ? qui(0, lo) : [], fin: hi < w[1] ? qui(1, hi) : [] },
  };
}
const vide = p => p.lo > p.hi;

/* Agregats d'une serie sur [lo, hi]. Memes definitions que les metriques de la couche Python :
   `risque_maxi IS NOT NULL` avant toute moyenne, les jours sans indice comptes a part. */
function agreger(en, bloc, p, o = {}) {
  const s = slots(en.e);
  const r = { couverts: 0, avec: 0, somme: 0, n3: 0, n4: 0, max: null };
  if (vide(p)) return { ...r, moyenne: null };
  const a = bloc === "neige" ? neige(en.e, o.t, o.v) : null;
  for (let i = 0; i < en.e.longueur; i++) {
    if (s[i] < p.lo || s[i] > p.hi) continue;
    const v = bloc === "risque" ? valeurRisque(en.e, i) : (a ? (a[i] ?? undefined) : undefined);
    if (v === undefined) continue;
    r.couverts++;
    if (v === null) continue;
    r.avec++; r.somme += v;
    if (bloc === "risque") { if (v >= D.seuil_haut) r.n3++; if (v >= D.seuil_tres_haut) r.n4++; }
    if (r.max === null || v > r.max) r.max = v;
  }
  r.moyenne = r.avec ? r.somme / r.avec : null;
  return r;
}
const VALEUR = {
  risque_moyen: a => a.moyenne,
  jours_3_plus: a => a.avec ? a.n3 : null,
  jours_4_plus: a => a.avec ? a.n4 : null,
  risque_max: a => a.max,
  epaisseur_max: a => a.max,
};
const blocDe = k => METR.get(k).indice ? "risque" : "neige";
const fmt = (k, v) => v == null ? "—" : k === "risque_moyen" ? v.toFixed(2).replace(".", ",") : String(v);
const fmtUnite = (k, v) => v == null ? "—" : fmt(k, v) + (METR.get(k).unite ? " " + METR.get(k).unite : "");

/* Texte de troncature : dans le sous-titre, jamais en note de bas de page. */
function texteTroncature(p, f) {
  const nom = libFen(f);
  if (!etat.p) return [`<b>Troncature désactivée</b> : séries lues sur toute la fenêtre ${esc(nom)}.`, `${f.debut ? `Fenêtre ${esc(f.libelle)}. ` : ""}Les périodes couvertes peuvent différer, les jours couverts sont affichés.`];
  if (vide(p)) return [`<b>Aucune période commune</b> dans la fenêtre ${esc(nom)} : rien n'est agrégé.`, ""];
  const lim = [...(p.limite.debut || []).map(n => `${esc(n)} commence le ${jourLib(D.axe[p.lo])}`), ...(p.limite.fin || []).map(n => `${esc(n)} s'arrête le ${jourLib(D.axe[p.hi])}`)];
  return [`<b>Comparaison tronquée à période égale</b> : du <b>${jourLib(D.axe[p.lo])}</b> au <b>${jourLib(D.axe[p.hi])}</b> (${p.jours} jours).`,
    `Période couverte par toutes les séries comparables dans la fenêtre ${esc(nom)}`
    + (p.tronquee ? ` — raccourcie par : ${lim.join(" ; ")}` : " — aucune série ne la raccourcit")
    + (p.vides.length ? `. Sans jour couvert, hors du calcul : ${p.vides.map(en => esc(nomEntite(en))).join(", ")}` : "") + "."];
}
const attrsPeriode = p => vide(p) ? "" : `${D.axe[p.lo]}..${D.axe[p.hi]}`;

/* ---------- selecteurs de comparaison ---------- */
function puces(conteneur, ids, libelle, couleur, retirer) {
  $(conteneur).innerHTML = ids.map((id, k) => `<span class="puce" style="border-left-color:${couleur(k)}">${esc(libelle(id))}<button type="button" data-id="${esc(id)}" aria-label="Retirer ${esc(libelle(id))}">×</button></span>`).join("");
  $(conteneur).querySelectorAll("button").forEach(b => b.addEventListener("click", () => retirer(b.dataset.id)));
}
function ajout(select, invite, options, ajouter) {
  const plein = etat.c.length + etat.n.length >= MAX - 1;
  select.innerHTML = `<option value="">${plein ? `maximum ${MAX} courbes` : invite}</option>`
    + options.map(o => `<option value="${esc(o.id)}">${esc(o.libelle)}</option>`).join("");
  select.disabled = plein || !options.length;
  select.onchange = () => { if (select.value) ajouter(select.value); };
}

/* ---------- axe : chaque jour d'une serie recoit une abscisse ----------
   Calendrier : la case `mm-jj` (le 29 fevrier a la sienne). Jour de saison :
   le rang depuis le premier jour de risque du massif (glossaire), 1 = premier
   jour. Les series comparees ne se superposent que sur l'axe calendaire : leurs
   rangs ne partent pas du meme jour. */
function abscisse(e, i) {
  return etat.a === "cal" ? SLOT.get(mmdd(T0(e.origine) + i * DAY)) : i - e.decalage_rang + 1;
}
function domaine() {
  const m = MASSIF.get(etat.m);
  let lo = Infinity, hi = -Infinity;
  for (const s of m.saisons) {
    const e = D.series[etat.m][s];
    for (const i of [0, e.longueur - 1]) { const x = abscisse(e, i); lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  return [lo, hi];
}
/* Fenetre `coeur` en abscisses, pour une saison. */
function bornesCoeur(saison, e) {
  const y = +saison.slice(0, 4);
  const d0 = Date.UTC(y, COEUR.debut[0] - 1, COEUR.debut[1]);
  const d1 = Date.UTC(y + 1, COEUR.fin[0] - 1, COEUR.fin[1]);
  const o = T0(e.origine);
  const i0 = Math.round((d0 - o) / DAY), i1 = Math.round((d1 - o) / DAY);
  return [i0, i1];
}

/* ---------- exports : les lignes sont accumulees par la trace elle-meme ----------
   Une ligne par point trace, en format long : serie (saison lue, serie comparee,
   moyenne des autres saisons...), saison, jour calendaire reel, abscisse de l'axe courant, valeur. */
const jourIso = (e, i) => new Date(T0(e.origine) + i * DAY).toISOString().slice(0, 10);
const abscisseLib = (e, i) => etat.a === "cal" ? D.axe[abscisse(e, i)] : abscisse(e, i);
const COLONNES = ["serie", "saison", "jour", "abscisse", "valeur", "remarque"];
const pointExport = (serie, saison, e, i, valeur, remarque = "") =>
  [serie, saison, jourIso(e, i), abscisseLib(e, i), valeur, remarque];
function exporter(svgId, nom, titre, lignes) {
  const m = MASSIF.get(etat.m);
  PARTAGE.enregistrer(svgId, { nom: `${nom}-${etat.m}-${etat.s}`, titre: `${titre} — ${m.nom}, saison ${etat.s}`, colonnes: COLONNES, lignes });
}

/* ---------- traces ---------- */
const W = 1100, L = 54, R = 14, TOP = 10, BAND = 22;

/* Un graphe : cadre, axes, fond de la fenetre coeur, bande de couverture. Renvoie un contexte de trace. */
function cadre(svgId, hauteur, [ymin, ymax], ticksY, unite) {
  const svg = $(svgId);
  svg.innerHTML = "";
  const H = TOP + hauteur + BAND + 34;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [x0, x1] = domaine();
  const px = x => L + (x - x0 + 0.5) / (x1 - x0 + 1) * (W - L - R);
  const py = y => TOP + (1 - (y - ymin) / (ymax - ymin)) * hauteur;
  const g = { svg, H, hauteur, px, py, x0, x1, ymin, ymax };

  // fond coeur de la saison lue
  const e = D.series[etat.m][etat.s];
  const [i0, i1] = bornesCoeur(etat.s, e);
  const a0 = abscisse(e, i0), a1 = abscisse(e, i1);
  el("rect", { x: px(Math.max(a0, x0)) - (W - L - R) / (x1 - x0 + 1) / 2, y: TOP, width: Math.max(0, px(Math.min(a1, x1)) - px(Math.max(a0, x0)) + (W - L - R) / (x1 - x0 + 1)), height: hauteur, fill: "var(--coeur)" }, svg);

  for (const t of ticksY) {
    el("line", { x1: L, x2: W - R, y1: py(t), y2: py(t), stroke: "var(--grid)" }, svg);
    el("text", { x: L - 7, y: py(t) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = t;
  }
  if (unite) el("text", { x: 4, y: TOP + 8, class: "tick" }, svg).textContent = unite;

  // graduation de l'axe des x
  const yAxe = TOP + hauteur;
  el("line", { x1: L, x2: W - R, y1: yAxe, y2: yAxe, stroke: "var(--rule)" }, svg);
  if (etat.a === "cal") {
    D.axe.forEach((c, i) => {
      if (i < x0 || i > x1 || c.slice(3) !== "01") return;
      el("line", { x1: px(i), x2: px(i), y1: yAxe, y2: yAxe + 4, stroke: "var(--rule)" }, svg);
      el("text", { x: px(i), y: yAxe + BAND + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = MOIS[+c.slice(0, 2) - 1];
    });
  } else {
    for (let r = 1; r <= x1; r += 30) {
      el("line", { x1: px(r), x2: px(r), y1: yAxe, y2: yAxe + 4, stroke: "var(--rule)" }, svg);
      el("text", { x: px(r), y: yAxe + BAND + 20, "text-anchor": "middle", class: "tick" }, svg).textContent = "j" + r;
    }
  }
  return g;
}

/* Bande de couverture : une cellule par jour de la periode de diffusion, pleine si la valeur existe. */
function couverture(g, e, valeurs, debut, fin) {
  const y = g.hauteur + TOP + 6, h = BAND - 12, larg = (W - L - R) / (g.x1 - g.x0 + 1);
  let n = 0, total = 0;
  for (let i = debut; i <= fin; i++) {
    total++;
    const ok = valeurs[i] != null;
    if (ok) n++;
    el("rect", { x: g.px(abscisse(e, i)) - larg / 2, y, width: Math.max(larg, 0.8), height: h, fill: ok ? "var(--ink-muted)" : "var(--manque)", opacity: ok ? 0.45 : 0.9 }, g.svg);
  }
  return { n, total };
}
function legendeCov(id, c, extra) {
  const pct = c.total ? (100 * c.n / c.total).toFixed(1).replace(".", ",") : "—";
  const trous = c.total - c.n;
  $(id).innerHTML = `Couverture : <b>${c.n} jours avec valeur sur ${c.total}</b> de la période de diffusion (${pct} %)`
    + (trous ? ` · <span class="trou">${trous} jour${trous > 1 ? "s" : ""} sans valeur</span> (cellules rouges sous l'axe)` : "")
    + (extra ? " · " + extra : "");
}

/* ---------- lecture des series de la saison ---------- */
/* Periode d'un bloc : etendue du risque elargie a celle des valeurs du bloc, pour ne rien tronquer. */
function etendueBloc(e, valeurs) {
  let [a, z] = etendueRisque(e);
  valeurs.forEach((v, i) => { if (v != null) { if (a < 0 || i < a) a = i; if (i > z) z = i; } });
  return [a, z];
}
function etendueRisque(e) {
  let a = -1, b = -1;
  for (let i = 0; i < e.risque.length; i++) if (e.risque[i] !== ".") { if (a < 0) a = i; b = i; }
  return [a, b];
}
const niveauxRisque = e => [...e.risque].map(c => c === "." || c === "0" ? null : +c);

function curseur(g, id, rendu) {
  const ligne = el("line", { y1: TOP, y2: TOP + g.hauteur, stroke: "var(--ink-2)", "stroke-dasharray": "3 3", opacity: 0, class: "curseur" }, g.svg);
  const cible = el("rect", { x: L, y: TOP, width: W - L - R, height: g.hauteur + BAND, fill: "transparent" }, g.svg);
  const tip = $("tip");
  cible.addEventListener("mousemove", ev => {
    const r = g.svg.getBoundingClientRect();
    const xv = (ev.clientX - r.left) / r.width * W;
    const x = Math.round((xv - L) / (W - L - R) * (g.x1 - g.x0 + 1) + g.x0 - 0.5);
    const html = rendu(x);
    document.querySelectorAll(".curseur").forEach(c => { c.setAttribute("opacity", 1); c.setAttribute("x1", g.px(x)); c.setAttribute("x2", g.px(x)); });
    if (!html) { tip.style.opacity = 0; return; }
    tip.innerHTML = html;
    tip.style.opacity = 1;
    tip.style.left = Math.min(innerWidth - 270, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  cible.addEventListener("mouseleave", () => {
    tip.style.opacity = 0;
    document.querySelectorAll(".curseur").forEach(c => c.setAttribute("opacity", 0));
  });
}
function decalageInverse(e, x) {     // abscisse -> decalage en jours depuis l'origine de la serie
  if (etat.a === "rang") return x - 1 + e.decalage_rang;
  const o = T0(e.origine);
  for (let i = 0; i < e.longueur; i++) if (SLOT.get(mmdd(o + i * DAY)) === x) return i;
  return -1;
}
const jourTxt = (e, i) => dateFr(new Date(T0(e.origine) + i * DAY).toISOString().slice(0, 10));
/* Moyenne des autres saisons comparables, case par case de l'axe courant, sur les seuls jours ou
   la saison a une valeur. Une case n'est retenue qu'a partir de D.min_saisons_bande saisons : en
   dessous, une moyenne n'est qu'une saison. Renvoie [{x, m, n}] ; l'echelle du graphe la lit
   avant le trace, pour que la moyenne ne sorte jamais du cadre. */
function moyenneAutres(valeursDe) {
  const somme = new Map(), nb = new Map();
  for (const s of autresSaisons()) {
    const o = D.series[etat.m][s], v = valeursDe(o);
    if (!v) continue;
    v.forEach((y, i) => { if (y == null) return; const x = abscisse(o, i); somme.set(x, (somme.get(x) || 0) + y); nb.set(x, (nb.get(x) || 0) + 1); });
  }
  return [...nb].filter(([, n]) => n >= D.min_saisons_bande).sort((a, b) => a[0] - b[0]).map(([x, n]) => ({ x, m: somme.get(x) / n, n }));
}
function traceMoyenneAutres(g, moyenne, serie, col, lignesExport) {
  const par = new Map(moyenne.map(c => [c.x, c]));
  const pts = [];
  for (let x = g.x0; x <= g.x1; x++) pts.push(par.has(x) ? [g.px(x), g.py(par.get(x).m)] : null);
  moyenne.forEach(c => lignesExport.push([serie, "autres saisons", "", etat.a === "cal" ? D.axe[c.x] : c.x, Math.round(c.m * 10) / 10, `moyenne de ${c.n} saisons`]));
  el("path", { d: chemin(pts), fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": "6 4", "stroke-linejoin": "round" }, g.svg);
}
const autresSaisons = () => MASSIF.get(etat.m).saisons.filter(s => s !== etat.s && SAISON.get(s).comparable);

/* ---------- graphe 1 : risque ----------
   Une courbe par serie, en marches (un niveau tient toute la journee), de 1 a 5. La saison
   lue est tracee sur toute sa diffusion ; les series comparees sur la seule fenetre coeur
   (hors d'elle, pres de la moitie de l'ecart entre epoques est la sentinelle d'avant juin
   2021) et sur l'axe calendaire. */
function grapheRisque() {
  const e = D.series[etat.m][etat.s];
  const g = cadre("g-risque", 220, [0.5, 5.5], [1, 2, 3, 4, 5], "indice");
  const larg = (W - L - R) / (g.x1 - g.x0 + 1);
  const lignes = [];
  const autres = comparees();
  const liste = entites();
  const calendaire = etat.a === "cal";
  const p = periode(liste, "risque", COEUR);
  const [w0, w1] = p.w;
  const dans = x => x >= w0 && x <= w1 && (!etat.p || (x >= p.lo && x <= p.hi));
  const visibles = calendaire ? autres : [];
  // les niveaux sont entiers : deux series egales se recouvriraient, d'ou un leger decalage
  const n = visibles.length + 1;
  const decal = k => (k - (n - 1) / 2) * 0.08;

  if (visibles.length && etat.p) {
    // hors periode commune, dans la fenetre coeur : fond grise, annonce par le sous-titre
    const zones = vide(p) ? [[w0, w1]] : [[w0, p.lo - 1], [p.hi + 1, w1]];
    for (const [a, b] of zones) if (b >= a) el("rect", { x: g.px(a) - larg / 2, y: TOP, width: (b - a + 1) * larg, height: g.hauteur, fill: "var(--hors)" }, g.svg);
  }
  const courbe = (pts, couleur, epais, attrs = {}) => {
    const d = chemin(pts);
    // liseret de la couleur du fond : une courbe qui en croise une autre reste lisible
    el("path", { d, fill: "none", stroke: "var(--page)", "stroke-width": epais + 2.5, "stroke-linejoin": "round" }, g.svg);
    el("path", { d, fill: "none", stroke: couleur, "stroke-width": epais, "stroke-linejoin": "round", ...attrs }, g.svg);
  };
  // series comparees d'abord : la saison lue passe par-dessus
  visibles.forEach((en, k) => {
    const sl = slots(en.e), pts = [], dy = decal(k + 1);
    for (let i = 0; i < en.e.longueur; i++) {
      const v = valeurRisque(en.e, i), x = sl[i];
      if (v == null || x < 0 || !dans(x)) { pts.push(null); continue; }
      pts.push([g.px(x) - larg / 2, g.py(v + dy)], [g.px(x) + larg / 2, g.py(v + dy)]);
      lignes.push([nomEntite(en), en.saison, jourIso(en.e, i), D.axe[x], v, en.comparable ? "série comparée" : "série comparée, non comparable : " + en.motif]);
    }
    const attrs = { "data-trace": nomEntite(en), "data-comparable": en.comparable ? 1 : 0 };
    if (!en.comparable) attrs["stroke-dasharray"] = "5 3";
    courbe(pts, COULEURS[k], 1.8, attrs);
  });
  // saison lue
  const pts = [], dy = decal(0);
  [...e.risque].forEach((c, i) => {
    if (c === ".") { pts.push(null); return; }
    lignes.push(["saison_lue", etat.s, jourIso(e, i), abscisseLib(e, i), c === "0" ? null : +c, c === "0" ? "publié sans indice" : ""]);
    if (c === "0") {          // publie sans indice : un cercle au pied de l'axe, ni zero ni trou
      pts.push(null);
      el("circle", { cx: g.px(abscisse(e, i)), cy: g.py(0.5) - 4, r: 2.2, fill: "none", stroke: "var(--ink-muted)" }, g.svg);
      return;
    }
    const x = g.px(abscisse(e, i)), y = g.py(+c + dy);
    pts.push([x - larg / 2, y], [x + larg / 2, y]);
  });
  courbe(pts, LUE, 2.2, { "data-lue": etat.s });
  exporter("g-risque", "risque", "Indice de risque", lignes);

  const [a, z] = etendueRisque(e);
  const c = couverture(g, e, [...e.risque].map(x => x === "." ? null : 1), a, z);
  const sans = [...e.risque].filter(x => x === "0").length;
  legendeCov("cov-risque", c, sans ? `${sans} jour${sans > 1 ? "s" : ""} publié${sans > 1 ? "s" : ""} sans indice (cercles sur l'axe)` : "");

  const sous = $("sous-risque");
  sous.dataset.periode = autres.length ? attrsPeriode(p) : "";
  sous.dataset.tronque = etat.p ? "1" : "0";
  let texte = `Indice de risque de 1 (faible) à 5 (très fort), jour par jour.`;
  let detail = `Échelle européenne du risque d'avalanche. Fond bleuté : la fenêtre ${esc(D.fenetre_defaut)} (${esc(fenetreTexte)}) de la saison lue.`;
  if (visibles.length) {
    const [court, long] = texteTroncature(p, COEUR);
    texte += " " + court;
    detail += ` ${long} Les séries comparées ne se tracent que sur la fenêtre ${esc(D.fenetre_defaut)}, seule où l'indice se compare entre saisons ; les courbes sont décalées de 0,08 niveau l'une de l'autre pour ne pas se recouvrir.`;
  } else if (autres.length) {
    texte += " Les séries comparées ne se superposent que sur l'axe calendaire.";
  }
  sous.innerHTML = texte + PARTAGE.plus(detail);
  const trait = (couleur, pointille) => `<i class="sw" style="${pointille ? `height:0;border-top:2px dashed ${couleur};background:none` : `background:${couleur};height:3px`}"></i>`;
  $("lg-risque").innerHTML = `<span>${trait(LUE)}${esc(nomEntite(entite(etat.m, etat.s)))}</span>`
    + visibles.map((en, k) => `<span>${trait(COULEURS[k], !en.comparable)}${esc(nomEntite(en))}${en.comparable ? "" : " (non comparable)"}</span>`).join("")
    + (visibles.length && etat.p && p.tronquee ? `<span><i class="sw box" style="background:var(--hors)"></i>hors période commune</span>` : "");

  const txtJour = v => v === undefined ? "aucun bulletin" : v === null ? "publié sans indice" : `indice <b>${v}</b> — ${NIVEAUX[v - 1]}`;
  curseur(g, "g-risque", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    let h = `<b>${jourTxt(e, i)}</b> · jour ${i - e.decalage_rang + 1} de la saison<br><span style="color:${LUE}">■</span> ${esc(nomEntite(entite(etat.m, etat.s)))} : ${txtJour(valeurRisque(e, i))}`;
    visibles.forEach((en, k) => {
      const j = slots(en.e).indexOf(x);
      h += `<br><span style="color:${COULEURS[k]}">■</span> ${esc(nomEntite(en))} : ${j < 0 ? "aucun bulletin" : txtJour(valeurRisque(en.e, j))}`;
    });
    return h;
  });
}

/* ---------- tableau recapitulatif ----------
   La saison lue et les series comparees, sur la fenetre coeur et leur periode commune. */
function tableau() {
  const liste = entites();
  const p = periode(liste, "risque", COEUR);
  const o = { t: etat.t, v: etat.v };

    `Neige max · ${etat.t} · ${etat.v}`];

      + `<td>${esc(nomEntite(en))}${etq}${motif}</td>`
      + c("couverts", a.couverts) + c("avec", a.avec)
      + c("moyenne", a.moyenne == null ? "—" : fmt("risque_moyen", a.moyenne))
      + c("n3", a.avec ? a.n3 : "—") + c("n4", a.avec ? a.n4 : "—") + c("max", a.max ?? "—")
      + c("neige", n.max == null ? "—" : `${n.max} cm`) + "</tr>";
  });
  $("table").innerHTML = `<thead><tr>${entete.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${lignes.join("")}</tbody>`;

  sous.innerHTML = (liste.length > 1 ? court : `Saison lue sur la fenêtre <b>${esc(D.fenetre_defaut)}</b> ; ajoutez des séries avec « Comparer avec » pour les mettre côte à côte.`)
    + PARTAGE.plus(long
    + " L'indice moyen se lit toujours avec les jours avec indice de sa ligne ; un niveau de risque est ordinal."
    + (pn.lo !== p.lo || pn.hi !== p.hi ? ` La neige est tronquée sur sa propre couverture : ${vide(pn) ? "aucun relevé commun" : `du ${jourLib(D.axe[pn.lo])} au ${jourLib(D.axe[pn.hi])}`}.` : ""));
}

/* ---------- classement des saisons du massif ---------- */
const COLONNES_RANG = ["massif_id", "saison", "metrique", "fenetre", "rang", "ex_aequo", "valeur", "jours_avec_valeur", "comparable", "motif"];
function classement() {
  const svg = $("g-rang");
  svg.innerHTML = "";
  const k = etat.k, m = METR.get(k), f = FEN.get(etat.r), mid = etat.m;
  const motifRefus = D.refus[k][etat.r];
  $("zone-neige").style.display = m.indice ? "none" : "";
  $("refus").innerHTML = motifRefus ? `<b>Classement refusé</b> : « ${esc(m.libelle)} » sur la fenêtre ${esc(libFen(f))}. ${esc(motifRefus)}` : "";
  $("refus").dataset.refus = motifRefus ? "1" : "0";
  const sous = $("sous-rang");
  const nom = MASSIF.get(mid).nom;
  if (motifRefus) {
    $("phrase").textContent = ""; $("cov-rang").textContent = "";
    sous.removeAttribute("data-periode"); sous.dataset.tronque = etat.p ? "1" : "0";
    sous.innerHTML = `Massif <b>${esc(nom)}</b>. ${m.indice ? "Une métrique d'indice ne se classe que sur la fenêtre " + esc(D.fenetre_defaut) + "." + PARTAGE.plus("Hors d'elle, une moitié environ de l'écart entre les époques est un artefact d'encodage.", "pourquoi") : ""}`;
    svg.setAttribute("viewBox", "0 0 10 10");
    PARTAGE.enregistrer(svg, { nom: `classement-${k}-${etat.r}-refuse`, titre: `Classement refusé : ${m.libelle}, fenêtre ${etat.r}`, colonnes: COLONNES_RANG, lignes: [] });
    return;
  }
  const liste = MASSIF.get(mid).saisons.map(s => entite(mid, s));
  const bloc = blocDe(k), o = { t: etat.t, v: etat.v };
  const altitudes = [...new Set(liste.flatMap(en => en.e.altitudes_neige?.[etat.t] || []))].sort((a, b) => a - b).join(" / ");
  const p = periode(liste, bloc, f, o);
  const lignes = liste.map(en => {
    const a = agreger(en, bloc, p, o);
    return { en, a, v: VALEUR[k](a) };
  });
  const classees = lignes.filter(x => x.en.comparable && x.v != null).sort((x, y) => y.v - x.v || x.en.saison.localeCompare(y.en.saison));
  let rang = 0;

  classees.forEach(x => { x.ex = classees.filter(y => y.rang === x.rang).length > 1; });
  const autres = lignes.filter(x => !classees.includes(x)).sort((x, y) => x.en.saison.localeCompare(y.en.saison));
  const rows = [...classees, ...autres];
  PARTAGE.enregistrer(svg, {
    nom: `classement-${k}-${etat.r}-${mid}`,
    titre: `Classement des saisons, ${m.libelle} — ${nom}, fenêtre ${etat.r}${etat.p ? ", période égale" : ""}`,
    colonnes: COLONNES_RANG,
    lignes: rows.map(x => [mid, x.en.saison, k, etat.r, x.rang ?? null, x.ex ? 1 : 0, x.v, x.a.avec, x.en.comparable ? 1 : 0, x.en.comparable ? "" : x.en.motif]),
  });

  // geometrie
  const RH = 30, LAB = 190, VAL = 210, top = 6;

  const defs = el("defs", {}, svg);

  el("rect", { width: 6, height: 6, fill: "var(--surface-2)" }, hach);
  el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: "var(--ink-muted)", "stroke-width": 2 }, hach);
  const ordinal = m.ordinal;
  const base = ordinal ? 1 : 0;
  const hi = ordinal ? 5 : Math.max(1, ...rows.map(x => x.v ?? 0));
  const bw = W - LAB - VAL;
  const bx = v => LAB + Math.max(0, (v - base) / (hi - base)) * bw;
  for (const t of ordinal ? [1, 2, 3, 4, 5] : [0, hi / 2, hi]) {
    const x = bx(t);
    el("line", { x1: x, x2: x, y1: top, y2: top + rows.length * RH, stroke: "var(--grid)" }, svg);
    el("text", { x, y: top + rows.length * RH + 16, "text-anchor": "middle", class: "tick" }, svg).textContent = Number.isInteger(t) ? t : t.toFixed(0);
  }
  // la saison lue a l'encre, les saisons superposees a la couleur de leur courbe, les autres en gris
  const couleurDe = sa => sa === etat.s ? LUE : etat.c.includes(sa) ? COULEURS[etat.c.indexOf(sa)] : null;
  rows.forEach((x, i) => {
    const y = top + i * RH, nc = !x.en.comparable;
    const g = el("g", { "data-saison": x.en.saison, "data-rang": x.rang ?? "", "data-valeur": x.v ?? "", "data-ex": x.ex ? 1 : 0, "data-comparable": nc ? 0 : 1 }, svg);
    el("text", { x: LAB - 10, y: y + RH / 2 + 4, "text-anchor": "end", class: "etiq" + (nc ? " nc" : "") }, g).textContent =
      (x.rang ? `${rangLib(x.rang)}${x.ex ? " ex aequo" : ""}  ` : "") + x.en.saison + (nc ? "  · non comparable" : "");
    if (x.v != null) {
      const col = couleurDe(x.en.saison);
      el("rect", {
        x: LAB, y: y + 5, width: Math.max(1.5, bx(x.v) - LAB), height: RH - 10, rx: 2,
        fill: nc ? "url(#hach)" : (col || "var(--band)"), opacity: nc || col ? 1 : 0.55,
        stroke: nc ? "var(--ink-muted)" : "none",
      }, g);
      el("text", { x: bx(x.v) + 8, y: y + RH / 2 + 4, class: "val" }, g).textContent =
        `${fmtUnite(k, x.v)} · ${x.a.avec} j${nc ? " · non classée" : ""}`;
    } else {
      el("text", { x: LAB + 8, y: y + RH / 2 + 4, class: "val" }, g).textContent = nc ? "non classée · sans valeur" : "sans valeur sur la période";
    }
    const t = el("title", {}, g);
    t.textContent = nc ? `${x.en.saison} : ${x.en.motif}` : `${x.en.saison} : ${fmtUnite(k, x.v)} sur ${x.a.avec} jours`;
  });

  // phrase partageable, descriptive
  const cible = etat.s;
  const ligne = classees.find(x => x.en.saison === cible);
  const rangTxt = ligne && classees.length >= D.min_saisons_classement ? `${rangLib(ligne.rang)}${ligne.ex ? " ex aequo" : ""}` : null;
  $("phrase").innerHTML = classees.length < D.min_saisons_classement
    ? `<b>Classement impossible</b> sur ${esc(nom)} : ${plur(classees.length, "saison comparable", "saisons comparables")} avec une valeur, il en faut au moins ${D.min_saisons_classement} pour donner un rang.`
    : rangTxt
    ? `<b>${esc(cible)}</b> : ${rangTxt} saison sur ${classees.length} saisons comparables, ${esc(nom)}, pour « ${esc(m.libelle.toLowerCase())} » : <b>${fmtUnite(k, ligne.v)}</b> sur ${ligne.a.avec} jours avec ${m.indice ? "indice" : "relevé"} (période ${vide(p) ? "—" : `${jourLib(D.axe[p.lo])} → ${jourLib(D.axe[p.hi])}`}).`
    : `<b>${esc(cible)}</b> n'est pas classée sur ${esc(nom)} : ${SAISON.get(cible)?.comparable === false ? "saison non comparable" : "aucune valeur sur la période"}.`;
  $("phrase").dataset.rang = rangTxt ? ligne.rang : "";
  $("phrase").dataset.ex = rangTxt && ligne.ex ? "1" : "0";
  sous.dataset.periode = attrsPeriode(p);
  sous.dataset.tronque = etat.p ? "1" : "0";
  const [court, long] = texteTroncature(p, f);
  sous.innerHTML = `Toutes les saisons de <b>${esc(nom)}</b>. ` + court + PARTAGE.plus(long
    + ` Barres triées sur les saisons comparables ; la saison lue est à l'encre, les saisons comparées à la couleur de leur courbe. Les saisons non comparables restent affichées en hachuré, avec leur motif au survol, sans rang.`
    + (ordinal ? " Axe gradué de 1 à 5 : l'indice est ordinal." : "")
    + (m.indice ? "" : ` Épaisseur au palier de la tranche <b>${esc(etat.t)}</b>, versant ${etat.v} : valeur indicative rattachée à l'altitude de référence, qui change d'époque en époque${altitudes ? ` (altitudes lues dans l'archive : ${esc(altitudes)} m)` : ""}.`));
  const total = lignes.reduce((n, x) => n + x.a.avec, 0);
  $("cov-rang").innerHTML = `Couverture — <b>${total} jours avec valeur</b> au total sur ${plur(liste.length, "saison")} de ${esc(nom)}, période de ${p.jours} jours calendaires.`
    + (autres.length ? ` ${autres.length} sans rang : ${autres.map(x => esc(x.en.saison)).join(", ")}.` : "");
}

/* ---------- graphe 2 : epaisseur de neige ---------- */
function grapheNeige() {
  const e = D.series[etat.m][etat.s];
  const tr = etat.t;
  const versants = [["nord", "var(--s1)"], ["sud", "var(--s2)"]];
  const moy = etat.o ? versants.map(([v]) => moyenneAutres(o => o.neige?.[tr] ? nombres(o.neige[tr][v]) : null)) : [];
  const mx = Math.max(10, ...[...nombres(e.neige?.[tr]?.nord), ...nombres(e.neige?.[tr]?.sud)].filter(v => v != null), ...moy.flat().map(c => c.m));
  const haut = Math.ceil(mx / 100) * 100;
  const g = cadre("g-neige", 150, [0, haut], [0, haut / 2, haut], "cm");
  const lignes = [];
  const n = e.neige?.[tr];
  const nord = nombres(n?.nord), sud = nombres(n?.sud);
  nord.forEach((y, i) => { if (y != null) lignes.push(pointExport("nord", etat.s, e, i, y)); });
  sud.forEach((y, i) => { if (y != null) lignes.push(pointExport("sud", etat.s, e, i, y)); });
  versants.forEach(([v, col], k) => { if (etat.o) traceMoyenneAutres(g, moy[k], "autres_saisons_moyenne_" + v, col, lignes); });
  exporter("g-neige", "neige-" + tr, "Épaisseur de neige, tranche " + tr + " (cm)", lignes);
  if (n) for (const [vals, col] of [[nord, "var(--s1)"], [sud, "var(--s2)"]])
    el("path", { d: chemin(vals.map((y, i) => y == null ? null : [g.px(abscisse(e, i)), g.py(y)])), fill: "none", stroke: col, "stroke-width": 1.8, "stroke-linejoin": "round" }, g.svg);
  const vals = nord.map((v, i) => v ?? sud[i] ?? null);
  const [a, z] = etendueBloc(e, vals);
  const c = couverture(g, e, vals, a, z);
  const parVersant = v => nombres(n?.[v]).filter(x => x != null).length;
  const alt = e.altitudes_neige?.[tr]?.join(" / ");
  legendeCov("cov-neige", c, n ? `un jour compte dès qu'un versant est relevé (nord ${parVersant("nord")} j, sud ${parVersant("sud")} j)` : "aucun palier d'enneigement dans cette tranche pour cette saison");
  $("sous-neige").innerHTML = `Épaisseur du manteau, palier le plus haut de la tranche <b>${esc(trancheLibelle(tr))}</b>${alt ? ` (<b>${alt} m</b>)` : ""}, versants nord et sud. Valeur indicative, pas une mesure.`
    + PARTAGE.plus(`${alt ? `Le palier est à ${alt} m cette saison et change d'époque. ` : ""}Valeur rattachée à l'altitude de référence. Indexée sur la date que décrit le relevé (<code>jour</code>). Pointillés : moyenne des autres saisons comparables, sur toute leur période, sans restriction à la fenêtre ${esc(D.fenetre_defaut)}. Chaque case ne moyenne que les saisons qui ont une valeur ce jour-là (début et fin de saison : souvent les seules enneigées) et n'est tracée qu'à partir de ${D.min_saisons_bande} saisons.`);
  $("lg-neige").innerHTML = `<span><i class="sw" style="background:var(--s1)"></i>versant nord</span><span><i class="sw" style="background:var(--s2)"></i>versant sud</span>`
    + (etat.o ? `<span><i class="sw tirets" style="color:var(--ink-2)"></i>moyenne des autres saisons comparables</span>` : "");
  curseur(g, "g-neige", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>nord : ${nord[i] == null ? "non relevé" : nord[i] + " cm"}<br>sud : ${sud[i] == null ? "non relevé" : sud[i] + " cm"}`;
  });
}

/* ---------- graphe 3 : isotherme 0 ---------- */
function grapheIso0() {
  const e = D.series[etat.m][etat.s];
  const iso = e.iso0;
  const tous = [...nombres(iso?.min), ...nombres(iso?.max)].filter(v => v != null);
  const moy0 = etat.o ? moyenneAutres(o => o.iso0 ? nombres(o.iso0.moyen) : null) : [];
  const hi = Math.max(1000, Math.ceil(Math.max(0, ...tous, ...moy0.map(c => c.m)) / 1000) * 1000);
  const g = cadre("g-iso0", 150, [0, hi], Array.from({ length: hi / 1000 + 1 }, (_, k) => k * 1000), "m");
  const lignes = [];
  const mn = nombres(iso?.min), mxv = nombres(iso?.max), moy = nombres(iso?.moyen);
  moy.forEach((y, i) => { if (y != null) lignes.push(pointExport("moyenne", etat.s, e, i, y)); });
  mn.forEach((y, i) => { if (y != null) lignes.push(pointExport("min", etat.s, e, i, y)); });
  mxv.forEach((y, i) => { if (y != null) lignes.push(pointExport("max", etat.s, e, i, y)); });
  if (etat.o) traceMoyenneAutres(g, moy0, "autres_saisons_moyenne", "var(--ink-2)", lignes);
  exporter("g-iso0", "iso0", "Isotherme 0 °C prévu (m)", lignes);
  // aire min-max, segment par segment : un trou ne se comble pas
  let h = [], b = [];
  const ferme = () => { if (h.length) el("path", { d: "M" + h.concat(b.reverse()).map(p => p.map(v => v.toFixed(1)).join(" ")).join("L") + "Z", fill: "var(--s1)", opacity: 0.22 }, g.svg); h = []; b = []; };
  mn.forEach((lo, i) => {
    if (lo == null || mxv[i] == null) { ferme(); return; }
    const x = g.px(abscisse(e, i)); h.push([x, g.py(mxv[i])]); b.push([x, g.py(lo)]);
  });
  ferme();
  el("path", { d: chemin(moy.map((y, i) => y == null ? null : [g.px(abscisse(e, i)), g.py(y)])), fill: "none", stroke: "var(--s1)", "stroke-width": 1.6 }, g.svg);
  const seuil = D.indicateurs[etat.m]?.[etat.s]?.[D.fenetre_defaut]?.meteo?.seuil_iso0_m
    ?? D.indicateurs[etat.m]?.[etat.s]?.[D.saison_complete]?.meteo?.seuil_iso0_m;
  if (seuil != null) {
    el("line", { x1: L, x2: W - R, y1: g.py(seuil), y2: g.py(seuil), stroke: "var(--s2)", "stroke-dasharray": "5 4" }, g.svg);
    el("text", { x: W - R - 4, y: g.py(seuil) - 4, "text-anchor": "end", class: "tick" }, g.svg).textContent = `seuil ${seuil} m`;
  }
  const [a, z] = etendueBloc(e, moy);
  const c = couverture(g, e, moy, a, z);
  legendeCov("cov-iso0", c, iso ? "" : "aucune prévision d'isotherme pour cette saison");
  $("sous-iso0").innerHTML = `Isotherme 0 °C <b>prévu</b> : moyenne des échéances 06 h et 12 h (trait), amplitude min–max (aire). Prévision, pas observation.`
    + PARTAGE.plus(`Pointillés : moyenne des autres saisons comparables (moyenne journalière de leur isotherme), sur toute leur période, sans restriction à la fenêtre ${esc(D.fenetre_defaut)} ; chaque case ne moyenne que les saisons qui ont une prévision ce jour-là, à partir de ${D.min_saisons_bande} saisons.`);
  $("lg-iso0").innerHTML = `<span><i class="sw" style="background:var(--s1)"></i>moyenne du jour</span><span><i class="sw box" style="background:var(--s1);opacity:.3"></i>min–max</span>`
    + `<span><i class="sw" style="background:var(--s2)"></i>seuil de redoux</span>` + (etat.o ? `<span><i class="sw tirets" style="color:var(--ink-2)"></i>moyenne des autres saisons comparables</span>` : "");
  curseur(g, "g-iso0", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>` + (moy[i] == null ? "pas de prévision" : `moyenne ${moy[i]} m<br>min ${mn[i]} m · max ${mxv[i]} m`);
  });
}

/* ---------- graphe 4 : vent ---------- */
function grapheVent() {
  const e = D.series[etat.m][etat.s];
  const tr = etat.t;
  const v = nombres(e.vent?.[tr]);
  exporter("g-vent", "vent-" + tr, "Vent prévu le plus fort du jour, tranche " + tr + " (km/h)",
    v.flatMap((y, i) => y == null ? [] : [pointExport("vent", etat.s, e, i, y, y > D.seuil_vent_fort_kmh ? "au-dessus de " + D.seuil_vent_fort_kmh + " km/h" : "")]));
  const hi = Math.max(D.seuil_vent_fort_kmh + 20, Math.ceil(Math.max(0, ...v.filter(x => x != null)) / 20) * 20);
  const g = cadre("g-vent", 130, [0, hi], [0, 50, 100, 150].filter(t => t <= hi), "km/h");
  const larg = (W - L - R) / (g.x1 - g.x0 + 1);
  v.forEach((y, i) => {
    if (y == null) return;
    el("rect", { x: g.px(abscisse(e, i)) - larg / 2, y: g.py(y), width: Math.max(larg - 0.4, 0.8), height: g.py(0) - g.py(y), fill: y > D.seuil_vent_fort_kmh ? "var(--s2)" : "var(--s1)", opacity: 0.8 }, g.svg);
  });
  el("line", { x1: L, x2: W - R, y1: g.py(D.seuil_vent_fort_kmh), y2: g.py(D.seuil_vent_fort_kmh), stroke: "var(--s2)", "stroke-dasharray": "5 4" }, g.svg);
  el("text", { x: W - R - 4, y: g.py(D.seuil_vent_fort_kmh) - 4, "text-anchor": "end", class: "tick" }, g.svg).textContent = `${D.seuil_vent_fort_kmh} km/h`;
  const [a, z] = etendueBloc(e, v);
  const c = couverture(g, e, v, a, z);
  const alt = e.altitudes_vent?.[tr]?.join(" / ");
  legendeCov("cov-vent", c, e.vent?.[tr] ? "" : "aucun vent prévu dans cette tranche pour cette saison");
  $("sous-vent").innerHTML = `Vitesse <b>prévue</b> la plus forte du jour, tranche <b>${esc(trancheLibelle(tr))}</b>${alt ? ` (<b>${alt} m</b>)` : ""}.`
    + PARTAGE.plus(`Échéances 06 h et 12 h${alt ? `, altitude${alt.includes("/") ? "s" : ""} de vent ${alt} m` : ""}. Les vents relèvent de leur altitude, jamais de leur rang « bas / haut » dans le bulletin. Pas de fond de comparaison sur ce graphe.`);
  $("lg-vent").innerHTML = `<span><i class="sw box" style="background:var(--s1)"></i>vitesse</span><span><i class="sw box" style="background:var(--s2)"></i>au-dessus de ${D.seuil_vent_fort_kmh} km/h</span>`;
  curseur(g, "g-vent", x => {
    const i = decalageInverse(e, x);
    if (i < 0 || i >= e.longueur) return "";
    return `<b>${jourTxt(e, i)}</b><br>` + (v[i] == null ? "pas de vent prévu" : `${v[i]} km/h`);
  });
}

const trancheLibelle = nom => { const t = D.tranches.find(t => t.nom === nom); return t ? `${nom} (${t.libelle})` : nom; };
const fenetreTexte = (() => { const f = COEUR; return `${f.debut[1]} ${MOIS[f.debut[0] - 1]} → ${f.fin[1]} ${MOIS[f.fin[0] - 1]}`; })();

/* ---------- indicateurs ---------- */
function tuile(k, v, n) { return `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`; }
/* Cinq chiffres : l'indice (moyenne avec ses jours, seuils, maximum), la neige et le vent de
   la tranche choisie. Une moyenne d'indice ne se lit jamais sans ses jours avec indice. */
function indicateurs() {
  const ind = D.indicateurs[etat.m]?.[etat.s] || {};
  const w = ind[etat.f] || {};
  const r = w.risque, t = [];
  if (r) {
    t.push(tuile("Indice moyen", fr(r.risque_moyen), `sur ${r.jours_avec_indice} jours avec indice`));
    t.push(tuile("Jours à risque ≥ 3", r.jours_3_plus, `dont ${r.jours_4_plus} à 4 ou 5`));
    t.push(tuile("Indice maximal", r.risque_max ?? "—", r.risque_max == null ? "aucun indice" : `${r.jours_au_max} jour${r.jours_au_max > 1 ? "s" : ""}, dès le ${dateFr(r.date_max)}`));
  }
  const n = w.neige?.[etat.t];
  if (n) t.push(tuile(`Neige max · ${etat.t}`, `${fr(n.epaisseur_max_nord_cm)} cm`, `versant nord${n.date_max_nord ? ", le " + dateFr(n.date_max_nord) : ""}`));
  const v = w.vent?.[etat.t];
  if (v) t.push(tuile(`Vent max · ${etat.t}`, `${fr(v.vitesse_max_kmh)} km/h`, `${v.jours_vent_fort} jours au-dessus de ${D.seuil_vent_fort_kmh} km/h`));
  $("kpis").innerHTML = t.join("") || tuile("Indicateurs", "—", "aucune donnée pour cette combinaison");
}

/* ---------- avertissements et notes ---------- */
function alerte() {
  const s = SAISON.get(etat.s), f = FEN.get(etat.f);
  const a = [];
  if (!s.comparable) a.push(`<b>${esc(etat.s)} n'est pas une saison comparable</b> : ${esc(s.motif)}.${PARTAGE.plus("Elle reste affichée, étiquetée, mais ne fixe pas la période commune et n'est jamais classée.", "suite")}`);
  for (const en of comparees()) if (!en.comparable && en.saison !== etat.s)
    a.push(`<b>${esc(en.saison)} n'est pas une saison comparable</b> : ${esc(en.motif)}.${PARTAGE.plus("Elle reste affichée, en pointillés, mais ne fixe pas la période commune et n'est jamais classée.", "suite")}`);
  if (!f.comparable) a.push(`Indicateurs sur la <b>${esc(libFen(f))}</b> : lecture de cette saison isolément.${PARTAGE.plus(`L'indice moyen ne se compare pas à celui d'une autre saison hors de la fenêtre ${esc(D.fenetre_defaut)}, la sentinelle d'avant ${esc(D.fin_sentinelle)} en altérant près de la moitié de l'écart.`, "pourquoi")}`);
  $("alerte").innerHTML = a.join("<br>");
}
function notes() {
  const m = MASSIF.get(etat.m);
  const n = [
    "Les trous sont des faits de l'archive, pas des défauts d'ingestion : ils s'affichent sans être comblés (cellules rouges sous chaque axe).",
    `Un niveau de risque est ordinal : la moyenne n'est jamais présentée sans son nombre de jours avec indice, et le classement garde le compte de jours par seuil.`,
    `L'indice ne se superpose et ne se classe que sur la fenêtre ${esc(D.fenetre_defaut)} (${esc(fenetreTexte)}) : avant ${esc(D.fin_sentinelle)}, les jours sans enneigement reçoivent une sentinelle sans indice, qui sort de la moyenne ; après, ils reçoivent un indice réel.`,
    "Neige, isotherme et vent sont ceux du bulletin (valeurs indicatives et prévisions), non des mesures.",
    `Dix saisons ne font pas un signal climatique, et les critères d'émission du risque ont évolué sur la période : les rangs décrivent l'archive, pas une tendance.`,
  ];
  if (m.saisons.length < D.saisons.length) n.push(`Ce massif n'a des bulletins que sur ${m.saisons.length} des ${D.saisons.length} saisons de l'archive.`);
  $("notes").innerHTML = `<details class="plus bloc"><summary>Notes de lecture</summary><ul>${n.map(x => `<li>${x}</li>`).join("")}</ul></details>`;
}

/* ---------- assemblage ---------- */
const libSaison = s => s + (SAISON.get(s).comparable ? "" : " (non comparable)");
function remplirSelecteurs() {
  $("sm").innerHTML = D.massifs.map(m => `<option value="${m.id}">${esc(m.nom)}${m.departement ? " (" + esc(m.departement) + ")" : ""}</option>`).join("");
  $("st").innerHTML = D.tranches.map(t => `<option value="${t.nom}">${esc(t.nom)} · ${esc(t.libelle)}</option>`).join("");
  $("sf").innerHTML = D.fenetres.filter(f => f.indicateurs)
    .map(f => `<option value="${f.nom}">${esc(f.nom === D.saison_complete ? "saison entière" : f.nom + " · " + fenetreTexte)}</option>`).join("");
  $("sk").innerHTML = D.metriques.map(m => `<option value="${m.cle}" title="${esc(m.description)}">${esc(m.libelle)}</option>`).join("");
  // Une fenetre refusee reste offerte : le refus s'affiche, il ne se devine pas.
  $("sr").innerHTML = D.fenetres.map(f => `<option value="${f.nom}">${esc(f.nom === D.saison_complete ? "saison entière" : f.nom + " · " + f.libelle)}</option>`).join("");
  $("sv").innerHTML = `<option value="nord">nord</option><option value="sud">sud</option>`;
}
function remplirComparaison() {
  const saisons = MASSIF.get(etat.m).saisons;
  puces("puces-saisons", etat.c, libSaison, k => COULEURS[k], s => change("c", etat.c.filter(x => x !== s)));
  ajout($("ajout-saison"), "+ une saison", saisons.filter(s => s !== etat.s && !etat.c.includes(s)).map(s => ({ id: s, libelle: libSaison(s) })),
    s => change("c", [...etat.c, s]));
  puces("puces-massifs", etat.n, id => MASSIF.get(+id).nom + " · " + etat.s, k => COULEURS[etat.c.length + k], id => change("n", etat.n.filter(x => x !== +id)));
  ajout($("ajout-massif"), `+ un massif en ${etat.s}`, D.massifs.filter(m => m.id !== etat.m && !etat.n.includes(m.id) && D.series[m.id]?.[etat.s]).map(m => ({ id: m.id, libelle: m.nom })),
    id => change("n", [...etat.n, +id]));
  $("ck-egale").checked = etat.p;
}
function dessine() {
  $("sm").value = etat.m;
  $("ss").innerHTML = MASSIF.get(etat.m).saisons.map(s => `<option value="${s}">${libSaison(s)}</option>`).join("");
  $("ss").value = etat.s; $("st").value = etat.t; $("sf").value = etat.f;
  $("sk").value = etat.k; $("sr").value = etat.r; $("sv").value = etat.v;
  $("ck-autres").checked = etat.o;
  $("ax-cal").setAttribute("aria-pressed", etat.a === "cal");
  $("ax-rang").setAttribute("aria-pressed", etat.a === "rang");
  remplirComparaison();
  const m = MASSIF.get(etat.m);
  const avec = comparees().map(nomEntite);
  $("titre").innerHTML = `${esc(m.nom)}<small>saison ${esc(etat.s)}${avec.length ? " · comparée à " + avec.map(esc).join(", ") : ""}</small>`;
  /* L'URL est ecrite avant les traces : l'en-tete des exports cite le lien courant. */
  ecrireUrl();
  $("attrib").textContent = m.dernier_bulletin && m.dernier_bulletin !== D.archive_jusqu_au ? `Dernier bulletin de ${m.nom} : ${dateFr(m.dernier_bulletin)}` : "";
  document.title = `${m.nom} ${etat.s} — massif`;
  alerte(); indicateurs();
  grapheRisque(); tableau(); grapheNeige(); grapheIso0(); grapheVent(); classement();
  notes();
}
function change(cle, valeur) {
  etat[cle] = valeur;
  if (cle === "m") {
    const s = MASSIF.get(etat.m).saisons; if (!s.includes(etat.s)) etat.s = s[s.length - 1];
    etat.t = trancheDefaut(etat.m);
