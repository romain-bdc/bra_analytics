<title>Carte des massifs BRA</title>
<style>
__POLICES__
__STYLE__
.carte{position:relative}
.carte svg{display:block;width:100%;height:auto;margin:0;touch-action:pan-y}
.carte svg.trace{cursor:crosshair;user-select:none}
.pays{fill:var(--pays);stroke:var(--pays-trait);stroke-width:.8;stroke-linejoin:round;pointer-events:none;vector-effect:non-scaling-stroke}
.massif{stroke:var(--page);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.massif:hover,.massif:focus-visible{stroke:var(--ink);stroke-width:2;outline:none}
.zonelab{font-stretch:80%;font-weight:600;letter-spacing:.02em;fill:var(--ink-muted);pointer-events:none}
.nomlab{font-weight:600;font-stretch:85%;fill:var(--ink);stroke:var(--page);stroke-width:3px;paint-order:stroke;
  stroke-linejoin:round;pointer-events:none;vector-effect:non-scaling-stroke}
.selection{fill:var(--coeur);stroke:var(--s1);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.sous-carte{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.zoom{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:6px 0 0;font-size:12.5px;color:var(--ink-muted)}
.zoom button[hidden]{display:none}
/* Le zoom par selection est reserve a la souris : sur ecran tactile, glisser fait defiler. */
@media (hover:none){.zoom{display:none}}

/* Cartouche : choix de la metrique et legende dans un cadre, comme la legende d'une carte
   topographique. Il recolore la carte voisine, sans defilement. */
.cote{border:1.5px solid var(--ink);padding:16px 18px 18px;background:var(--page);box-shadow:4px 4px 0 var(--surface-2)}
.metriques{border:0;margin:0 0 20px;padding:0;min-width:0}
.metriques legend,.cle .titre{padding:0;margin:0 0 8px;font-size:13px;font-weight:700;font-stretch:80%;letter-spacing:.02em;color:var(--ink)}
.metriques label{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 0 2px;font-size:13.5px;color:var(--ink-2);
  border-radius:3px;cursor:pointer}
.metriques label:hover{color:var(--ink);background:var(--surface-2)}
.metriques input{position:absolute;opacity:0;pointer-events:none}
.metriques label:has(input:checked){color:var(--page);background:var(--ink);font-weight:600}
.metriques label:has(input:focus-visible){outline:2px solid var(--s1);outline-offset:1px}
.metriques label:has(input:disabled){color:var(--ink-muted);cursor:not-allowed;background:none}
.metriques .motif{display:block;font-size:12px;font-weight:400;color:var(--ink-muted)}
.cle{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:0;font-size:12.5px;color:var(--ink-2)}
.cle .titre{margin:0}
.cle span{display:inline-flex;align-items:center;gap:8px}
.cle svg{width:22px;height:14px;flex:none;border-radius:2px}
.echelle{margin:14px 0 0;font-size:12px;line-height:1.5;color:var(--ink-muted)}
.cote .toggle{margin-top:14px;padding-left:0;text-decoration:underline;text-underline-offset:3px}
.cote .toggle:hover{background:none}
.cote .toggle[aria-pressed="true"]{background:none;color:var(--ink)}
.vue{display:grid;gap:16px 40px;padding-top:6px;border-top:0}
.reperes{margin-top:30px;border-top:1.5px solid var(--ink)}
.reperes h2{margin-bottom:16px}
.attrib{margin:16px 0 0;padding-top:10px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink-muted)}
.attrib a{color:var(--ink-2)}
.tables{margin-top:24px}
.tables[hidden]{display:none}
.scroller{overflow-x:auto}
table{font-size:12.5px}
th,td{padding:5px 10px;white-space:nowrap}
td.g{text-align:left;white-space:normal}
#tip .num{font-variant-numeric:tabular-nums;font-weight:600}
#tip .z{color:var(--ink-muted)}
#tip .alerte{display:block;margin-top:4px;padding:0;border:0;color:var(--ink-2)}
/* Etroit : le choix de metrique au-dessus de la carte, la legende dessous, sans cadre. */
@media (max-width:979px){
  .cote{display:contents}
  .metriques{order:-1;margin:0}
  .metriques label{display:inline-flex;margin:0 4px 4px 0}
  .metriques .motif{display:none}
}
/* Large : le cartouche a gauche, la carte a droite a hauteur d'ecran. La France vide a
   l'ouest, le cartouche occupe cette place sans jamais masquer une carte zoomee. */
@media (min-width:980px){
  .vue{grid-template-columns:300px minmax(0,1fr)}
  .vue>.cote{grid-column:1;grid-row:1;align-self:start;position:sticky;top:16px}
  .vue>.plan{grid-column:2;grid-row:1}
  .carte svg{height:min(calc(100vh - 210px),900px);min-height:460px}
}
@media (forced-colors:active){.massif{stroke:CanvasText}}
</style>

<div class="wrap">
<header>
  <h1 id="titre">Le risque d'avalanche, massif par massif</h1>
  <p class="lede" id="lede"></p>
</header>

<section class="panel vue">
  <div class="plan">
    <div class="carte"><svg id="carte" role="img"></svg></div>
    <p class="zoom"><span id="zoom-aide">Cliquer-glisser sur la carte pour zoomer sur une zone.</span>
      <button class="toggle" id="dezoom" hidden>Revenir à la France entière</button></p>
  </div>
  <div class="cote">
    <fieldset class="metriques" id="met"><legend>Métrique</legend></fieldset>
    <div class="cle" id="legende"></div>

    <button class="toggle" id="tbl" aria-pressed="false">Voir les données</button>
  </div>
</section>

<div class="tables" hidden><div class="scroller"><table id="table"></table></div></div>

<section class="panel reperes">

  <p class="attrib" id="attribution-contours"></p>
</section>

<footer>
  <span id="attribution"></span>
  <span>Page générée par <code>bra carte</code></span>

<div id="tip" role="status" aria-live="polite"></div>

<script>
__PARTAGE__
</script>
<script>
const D = __DONNEES__;
const NS = "http://www.w3.org/2000/svg";
const NIVEAUX = ["Faible", "Limité", "Marqué", "Fort", "Très fort"];
const RAMPE = ["--o1", "--o2", "--o3", "--o4", "--o5"];
/* Un maximum est un niveau de l'echelle europeenne : il prend la couleur de ce niveau. */
const NIVEAUX_COULEURS = ["--n1", "--n2", "--n3", "--n4", "--n5"];
/* Les zones de massifs.py sont en ASCII ; seule « Pyrenees » perd un accent a l'affichage. */
const zoneFr = z => z === "Pyrenees" ? "Pyrénées" : z;
const PAR_ID = new Map(D.massifs.map(m => [m.id, m]));
const NB_COMP = D.saisons_comparables.length;

/* ---------- utilitaires ---------- */
const el = (t, at = {}) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); return e; };
const nb = n => n == null ? "—" : n.toLocaleString("fr-FR");
// Tout texte venu du payload passe par `esc` avant `innerHTML` : les noms et
// motifs sont des constantes du repo aujourd'hui, mais un `<` ou un `&` dans
// un libelle futur casserait la page sans prevenir.
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const dec = (v, d = 2) => v == null ? "—" : v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => b ? (100 * a / b).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %" : "—";
const dateFr = iso => iso ? new Date(iso + "T00:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }) : "—";
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
/* Libelle de la fenetre recompose depuis ses bornes du payload, accentue pour l'affichage. */
const F = D.fenetre;
const fenetreTexte = `${F.debut[1]} ${MOIS[F.debut[0] - 1]} → ${F.fin[1]} ${MOIS[F.fin[0] - 1]}`;

/* ---------- projection ----------
   Equirectangulaire corrigee du cosinus de la latitude moyenne : sur 5 degres
   de latitude, l'ecart a une projection conforme est invisible, et le calcul
   tient en deux lignes sans bibliotheque cartographique. */
const anneaux = f => f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
/* L'etendue est celle de la France entiere : les massifs s'y situent, ils ne remplissent pas la page. */
for (const f of [...D.france.features, ...D.contours.features]) for (const poly of anneaux(f)) for (const r of poly) for (const [x, y] of r) {
  minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
}
const KX = Math.cos((minY + maxY) / 2 * Math.PI / 180);
const W = 900, PAD = 18;
const ECH = (W - 2 * PAD) / ((maxX - minX) * KX);
const H = Math.ceil((maxY - minY) * ECH + 2 * PAD);
const px = x => PAD + (x - minX) * KX * ECH;
const py = y => PAD + (maxY - y) * ECH;
const chemin = f => anneaux(f).map(poly => poly.map(r =>
  r.map(([x, y], i) => (i ? "L" : "M") + px(x).toFixed(1) + " " + py(y).toFixed(1)).join("") + "Z").join("")).join("");

/* ---------- classes de couleur ----------
   Rampe sequentielle a un seul ton, cinq pas. La moyenne et les comptes sont
   repartis en cinq classes egales sur l'etendue observee ; le maximum, deja
   ordinal, prend directement le pas de son niveau. */
const METRIQUES = D.metriques;
/* La metrique vit dans l'URL (spec section 6) sous la cle `mc` : un etat de la page se
   partage par son lien, et les cles des autres ecrans (massif, saison...) traversent la carte. */
const depuisUrl = () => {
  const h = PARTAGE.lire().get("mc");
  return METRIQUES.some(m => m.cle === h && m.disponible) ? h : D.metrique_defaut;
};
let metrique = depuisUrl();
const defMetrique = () => METRIQUES.find(m => m.cle === metrique);

function echelle(cle) {
  const vals = D.massifs.map(m => m[cle]).filter(v => v != null);
  if (cle === "risque_max") {
    return { pas: v => v - 1, bornes: NIVEAUX.map((n, k) => `${k + 1} — ${n}`), niveaux: true, rampe: NIVEAUX_COULEURS };
  }
  const entier = cle !== "risque_moyen";
  const g = entier ? 10 : 0.1;
  let lo = Math.floor(Math.min(...vals) / g) * g, hi = Math.ceil(Math.max(...vals) / g) * g;
  if (hi <= lo) hi = lo + g;
  const larg = (hi - lo) / 5;
  const pas = v => Math.min(4, Math.max(0, Math.floor((v - lo) / larg)));
  const fmt = v => entier ? nb(Math.round(v)) : dec(v, 2);
  return { pas, lo, hi, bornes: RAMPE.map((_, k) => `${fmt(lo + larg * k)} – ${fmt(lo + larg * (k + 1))}`), niveaux: false, rampe: RAMPE };
}

/* ---------- valeur affichee ---------- */
function valeurTexte(m, cle) {
  const v = m[cle];
  if (v == null) return "aucune donnée";
  if (cle === "risque_moyen") return dec(v);
  if (cle === "risque_max") return `${v} — ${NIVEAUX[v - 1]}`;
  if (cle === "jours_3_plus_par_saison") return `${dec(v, 1)} jours par saison`;
  return nb(v) + " jours";
}

/* ---------- infobulle ----------
   Une moyenne d'indice ordinal ne se lit jamais seule : jours couverts et jours
   a 4 ou 5 l'accompagnent toujours, quelle que soit la metrique choisie. */
const tip = document.getElementById("tip");
function contenu(m) {
  const cle = metrique, def = defMetrique();
  let h = `<b>${esc(m.nom)}</b> <span class="z">· ${zoneFr(m.zone)}</span><br>`;
  if (m.diffusion === "absente") {
    return h + `Aucun jour couvert sur la période : massif non diffusé sur ${D.libelle_saisons}.`;
  }
  h += `${def.libelle} <span class="num">${valeurTexte(m, cle)}</span><br>`;
  if (cle !== "risque_moyen") h += `indice moyen <span class="num">${dec(m.risque_moyen)}</span><br>`;
  h += `<span class="num">${nb(m.jours_couverts)}</span> jours couverts sur <span class="num">${nb(m.jours_periode)}</span>
        (<span class="num">${pct(m.jours_couverts, m.jours_periode)}</span>)<br>
        <span class="num">${nb(m.jours_4_plus)}</span> jours à risque 4 ou 5`;
  if (m.jours_5) h += ` <span class="z">(dont <span class="num">${nb(m.jours_5)}</span> à 5)</span>`;
  if (cle === "jours_3_plus_par_saison" && m.jours_3_plus != null) {
    h += `<span class="num">${nb(m.jours_3_plus)}</span> jours à 3 ou plus sur <span class="num">${m.saisons}</span> saison${m.saisons > 1 ? "s" : ""}<br>`;
  }
  if (cle === "risque_max" && m.risque_max != null) {
    h += `<br>atteint <span class="num">${nb(m.jours_au_max)}</span> jour${m.jours_au_max > 1 ? "s" : ""}, la première fois le ${dateFr(m.date_max)}`;
  }
  const sansIndice = m.jours_couverts - m.jours_avec_indice;
  if (sansIndice > 0) h += `<br><span class="num">${nb(sansIndice)}</span> jour${sansIndice > 1 ? "s" : ""} sans indice, hors moyenne`;
  h += `<br><span class="num">${m.saisons_presentes.length}</span> saison${m.saisons_presentes.length > 1 ? "s" : ""} sur <span class="num">${NB_COMP}</span> comparables`;
  if (m.diffusion === "partielle") {
    h += `<span class="alerte"><b>Diffusion partielle</b> — pas de bulletin sur : ${esc(m.saisons_manquantes.join(", "))}.`;
    if (cle === "jours_3_plus_par_saison") h += " La moyenne par saison porte sur les seules saisons diffusées.";
    h += `</span>`;
  }
  return h;
}
function place(ev) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(8, ev.clientX + 14), innerWidth - r.width - 8) + "px";
  tip.style.top = Math.min(Math.max(8, ev.clientY + 16), innerHeight - r.height - 8) + "px";
}

/* ---------- motifs : absence et diffusion partielle ----------
   Deux textures distinctes, pour que l'absence ne se lise jamais comme un zero :
   un massif sans donnee est hachure sur fond neutre, hors de la rampe ; un
   massif diffuse une partie de la periode garde sa couleur, surchargee d'une
   hachure fine dans l'autre sens. */
function motifs(svg) {
  const defs = el("defs");
  const absent = el("pattern", { id: "absent", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  absent.append(el("rect", { width: 6, height: 6, fill: "var(--vide)" }), el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: "var(--hachure)", "stroke-width": 1.4 }));
  const partiel = el("pattern", { id: "partiel", width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(135)" });
  partiel.append(el("line", { x1: 0, y1: 0, x2: 0, y2: 5, stroke: "var(--surface)", "stroke-width": 1.6 }));
  defs.append(absent, partiel);
  svg.appendChild(defs);
}

/* ---------- carte ---------- */
function carte() {
  const svg = document.getElementById("carte");
  svg.textContent = "";
  svg.dataset.largeur = W;
  motifs(svg);
  const sc = echelle(metrique);
  const zones = new Map();
  /* Fond : silhouette de la France, sous les massifs et hors de toute interaction. */
  for (const f of D.france.features) svg.appendChild(el("path", { d: chemin(f), class: "pays", "aria-hidden": "true" }));
  const lignesExport = [];
  const noms = [];
  for (const f of D.contours.features) {
    const m = PAR_ID.get(f.properties.code);
    if (!m) continue;
    lignesExport.push([m.id, m.nom, zoneFr(m.zone), metrique, m[metrique], m.jours_couverts, m.jours_periode, m.jours_4_plus, m.saisons_presentes.length, m.diffusion]);
    const d = chemin(f);
    const v = m[metrique];
    const fill = v == null ? "url(#absent)" : `var(${sc.rampe[sc.pas(v)]})`;
    const p = el("path", { d, fill, class: "massif", tabindex: 0, "aria-label": `${m.nom} : ${valeurTexte(m, metrique)}` });
    p.addEventListener("pointerenter", ev => { tip.innerHTML = contenu(m); tip.style.opacity = "1"; place(ev); });
    p.addEventListener("pointermove", place);
    p.addEventListener("pointerleave", () => { tip.style.opacity = "0"; });
    p.addEventListener("focus", () => {
      tip.innerHTML = contenu(m); tip.style.opacity = "1";
      const b = p.getBoundingClientRect(); place({ clientX: b.right, clientY: b.top });
    });
    p.addEventListener("blur", () => { tip.style.opacity = "0"; });
    svg.appendChild(p);
    if (m.diffusion === "partielle") svg.appendChild(el("path", { d, fill: "url(#partiel)", "pointer-events": "none" }));
    /* Etiquettes de zone : boite englobante des massifs de chaque zone. */
    const b = p.getBBox();
    noms.push([m.nom, b.x + b.width / 2, b.y + b.height / 2]);
    const z = zones.get(m.zone) || { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity };
    zones.set(m.zone, { x0: Math.min(z.x0, b.x), x1: Math.max(z.x1, b.x + b.width), y0: Math.min(z.y0, b.y), y1: Math.max(z.y1, b.y + b.height) });
  }
  for (const [nom, z] of zones) {
    /* Alpes du Nord et Corse : etiquette a gauche du haut du bloc ; les autres dessous. */
    const gauche = nom !== "Pyrenees" && nom !== "Alpes du Sud";
    const t = gauche
      ? el("text", { x: z.x0 - 12, y: z.y0 + 24, "text-anchor": "end", class: "zonelab" })
      : el("text", { x: (z.x0 + z.x1) / 2, y: z.y1 + 18, "text-anchor": "middle", class: "zonelab" });
    t.textContent = zoneFr(nom);
    svg.appendChild(t);
  }
  /* Noms des massifs : illisibles a l'echelle de la France, ils n'apparaissent qu'une fois zoome. */
  for (const [nom, x, y] of noms) {
    const t = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "middle", class: "nomlab" });
    t.textContent = nom;
    svg.appendChild(t);
  }
  appliqueVue();
  /* Une ligne par massif colore : la valeur est celle qui a choisi la teinte. */
  PARTAGE.enregistrer(svg, {
    nom: `carte-${metrique}`,
    titre: `${defMetrique().libelle}, ${D.libelle_saisons}`,
    colonnes: ["massif_id", "massif", "zone", "metrique", "valeur", "jours_couverts", "jours_periode", "jours_4_plus", "saisons_presentes", "diffusion"],
    lignes: lignesExport,
  });
  legende(sc);
}

function pastille(fill, surcharge) {
  const s = el("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
  s.appendChild(el("rect", { width: 16, height: 16, fill }));
  if (surcharge) for (let k = -16; k < 32; k += 5) s.appendChild(el("line", { x1: k, y1: 16, x2: k + 16, y2: 0, stroke: "var(--surface)", "stroke-width": 1.6 }));
  return s;
}
function pastilleAbsente() {
  const s = el("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
  s.appendChild(el("rect", { width: 16, height: 16, fill: "var(--vide)" }));
  for (let k = -16; k < 32; k += 6) s.appendChild(el("line", { x1: k, y1: 0, x2: k + 16, y2: 16, stroke: "var(--hachure)", "stroke-width": 1.4 }));
  return s;
}

function legende(sc) {
  const box = document.getElementById("legende");
  box.textContent = "";
  const titre = document.createElement("span");
  titre.className = "titre"; titre.textContent = "Légende";
  box.appendChild(titre);
  const present = new Set(D.massifs.map(m => m[metrique]).filter(v => v != null).map(sc.pas));
  sc.bornes.forEach((txt, k) => {
    if (sc.niveaux && !present.has(k)) return;
    const s = document.createElement("span");
    s.append(pastille(`var(${sc.rampe[k]})`), document.createTextNode(txt));
    box.appendChild(s);
  });
  const partiels = D.massifs.filter(m => m.diffusion === "partielle");
  const absents = D.massifs.filter(m => m.diffusion === "absente");
  if (partiels.length) {
    const s = document.createElement("span");
    s.append(pastille(`var(${sc.rampe[2]})`, true), document.createTextNode(`Diffusé une partie de la période (${partiels.map(m => m.nom).join(", ")})`));
    box.appendChild(s);
  }
  const s = document.createElement("span");
  s.append(pastilleAbsente(), document.createTextNode(absents.length ? `Aucune donnée (${absents.length} massif${absents.length > 1 ? "s" : ""})` : "Aucune donnée (aucun massif)"));
  box.appendChild(s);

  const e = document.getElementById("echelle");
  const cle = metrique;
  if (cle === "risque_moyen") {
    e.textContent = `Classes réparties sur l'étendue observée (${dec(sc.lo)} à ${dec(sc.hi)}) : deux teintes voisines peuvent ne différer que de quelques centièmes. L'échelle européenne va de 1 à 5 ; une moyenne d'indices ordinaux se lit avec ses jours, au survol.`;
  } else if (cle === "jours_3_plus_par_saison") {
    e.textContent = `Classes réparties sur l'étendue observée (${dec(sc.lo, 1)} à ${dec(sc.hi, 1)} jours par saison). Le compte est rapporté aux saisons diffusées, pour que les massifs hachurés, diffusés moins longtemps, se comparent aux autres ; le compte brut est au survol. Zéro jour est une valeur, colorée comme telle ; l'absence de donnée est hachurée à part.`;
  } else {
    e.textContent = "Indice le plus haut publié sur la période, sur l'échelle européenne. Le survol donne le nombre de jours où il a été atteint.";
  }
}

/* ---------- tuiles ---------- */
function tuiles() {
  const avec = D.massifs.filter(m => m.risque_moyen != null);
  const tri = [...avec].sort((a, b) => b.risque_moyen - a.risque_moyen);
  const haut = tri[0], bas = tri[tri.length - 1];
  const decrit = m => `${dec(m.risque_moyen)} — ${nb(m.jours_couverts)} jours couverts, ${nb(m.jours_4_plus)} à 4 ou 5`;
  const partiels = D.massifs.filter(m => m.diffusion === "partielle");
  const cases = [
    ["Indice moyen le plus haut", haut ? haut.nom : "—", haut ? decrit(haut) : ""],
    ["Indice moyen le plus bas", bas ? bas.nom : "—", bas ? decrit(bas) : ""],
    ["Diffusion partielle", nb(partiels.length) + " massif" + (partiels.length > 1 ? "s" : ""),
      partiels.map(m => `${m.nom} : ${m.saisons_presentes.length} saisons sur ${NB_COMP}`).join(" · ") || "tous diffusés sur toute la période"],
  ];
  document.getElementById("kpis").innerHTML = cases
    .map(([k, v, n]) => `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`).join("");
}

/* ---------- table ---------- */
function table() {
  const cle = metrique;
  const lignes = [...D.massifs].sort((a, b) => (b[cle] ?? -Infinity) - (a[cle] ?? -Infinity) || a.id - b.id);
  const statut = m => m.diffusion === "complete" ? "complète"
    : m.diffusion === "partielle" ? `partielle — manque ${m.saisons_manquantes.join(", ")}` : "aucune donnée";
  const t = document.getElementById("table");
  t.innerHTML = `<caption>${defMetrique().libelle} par massif · ${D.libelle_saisons}</caption>
    <thead><tr>${["Massif", "Zone", "Indice moyen", "Jours ≥ 3 par saison", "Jours ≥ 3", "Maximum", "Jours couverts", "Jours à 4 ou 5", "Saisons", "Diffusion"].map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead>
    <tbody>${lignes.map(m => `<tr><th scope="row">${esc(m.nom)}</th><td class="g">${zoneFr(m.zone)}</td><td>${dec(m.risque_moyen)}</td>
      <td>${dec(m.jours_3_plus_par_saison, 1)}</td><td>${nb(m.jours_3_plus)}</td><td>${m.risque_max ?? "—"}</td><td>${nb(m.jours_couverts)}</td><td>${nb(m.jours_4_plus)}</td>
      <td>${m.saisons_presentes.length} / ${NB_COMP}</td><td class="g">${statut(m)}</td></tr>`).join("")}</tbody>`;
}

/* ---------- textes ----------
   Le chapo decrit la metrique affichee : il change avec elle. */
function textes() {
  const def = defMetrique();
  const ecartees = Object.entries(D.saisons_ecartees).map(([s, motif]) => `${s} (${motif})`).join(" ; ");
  document.getElementById("carte").setAttribute("aria-label", `Carte des massifs : ${def.libelle}, ${D.libelle_saisons}`);
  document.getElementById("lede").innerHTML =
    `Couleur de chaque massif : ${esc(def.description)}. Période : <b>${D.libelle_saisons}</b>, fenêtre <b>${F.nom}</b>.`
    + PARTAGE.plus(`La fenêtre ${F.nom} (${fenetreTexte}) est la seule où les saisons se comparent : avant juin 2021, les journées à manteau insuffisant
     (début et fin de saison) ne recevaient pas d'indice et sortaient des moyennes. Saisons écartées : ${esc(ecartees) || "aucune"}.`);
}

/* ---------- choix de la metrique ---------- */
const choix = document.getElementById("met");
choix.insertAdjacentHTML("beforeend", METRIQUES.map(m => `<label><input type="radio" name="met" value="${m.cle}"`
  + `${m.disponible ? "" : " disabled"}${m.cle === metrique ? " checked" : ""}><span>${esc(m.libelle)}`
  + `${m.disponible ? "" : `<span class="motif">${esc(m.motif.split(" :")[0])}</span>`}</span></label>`).join(""));
const coche = () => choix.querySelectorAll("input").forEach(i => { i.checked = i.value === metrique; });

/* ---------- zoom par selection ----------
   Cliquer-glisser trace un cadre ; au relacher, le viewBox s'y ajuste (au rapport
   de la carte, zoom plafonne a x12). Le tactile garde le defilement de la page.
   Les traits ne grossissent pas (vector-effect) ; les textes sont recompenses. */
const svgCarte = document.getElementById("carte");
const dezoom = document.getElementById("dezoom");
const aide = document.getElementById("zoom-aide");
let vue = null;                                    // [x, y, l, h] ou null = France entiere
function appliqueVue() {
  const [x, y, w, h] = vue || [0, 0, W, H];
  svgCarte.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
  const k = W / w;
  /* Les hachures sont en unites de carte : sans correction, elles grossiraient avec le zoom. */
  for (const [id, rot] of [["absent", 45], ["partiel", 135]]) {
    const pat = svgCarte.querySelector("#" + id);
    if (pat) pat.setAttribute("patternTransform", `rotate(${rot}) scale(${1 / k})`);
  }
  svgCarte.querySelectorAll(".zonelab").forEach(t => t.setAttribute("font-size", 17 / k));
  svgCarte.querySelectorAll(".nomlab").forEach(t => { t.setAttribute("font-size", 13 / k); t.style.display = k >= 2.5 ? "" : "none"; });
  dezoom.hidden = !vue;
  aide.textContent = vue ? "Cliquer-glisser pour zoomer davantage, double-clic pour revenir." : "Cliquer-glisser sur la carte pour zoomer sur une zone.";
}
const pointSvg = ev => {
  const p = svgCarte.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svgCarte.getScreenCTM().inverse());
};
let depart = null, cadre = null;
svgCarte.classList.add("trace");
svgCarte.addEventListener("pointerdown", ev => {
  if (ev.pointerType === "touch" || ev.button !== 0) return;
  depart = { p: pointSvg(ev), cx: ev.clientX, cy: ev.clientY };
  svgCarte.setPointerCapture(ev.pointerId);
});
svgCarte.addEventListener("pointermove", ev => {
  if (!depart) return;
  if (!cadre) {
    if (Math.hypot(ev.clientX - depart.cx, ev.clientY - depart.cy) < 6) return;
    cadre = el("rect", { class: "selection" });
    svgCarte.appendChild(cadre);
    tip.style.opacity = "0";
  }
  const q = pointSvg(ev), a = depart.p;
  cadre.setAttribute("x", Math.min(a.x, q.x)); cadre.setAttribute("y", Math.min(a.y, q.y));
  cadre.setAttribute("width", Math.abs(q.x - a.x)); cadre.setAttribute("height", Math.abs(q.y - a.y));
});
function finSelection(ev) {
  if (!depart) return;
  if (cadre) {
    let x = +cadre.getAttribute("x"), y = +cadre.getAttribute("y"), w = +cadre.getAttribute("width"), h = +cadre.getAttribute("height");
    cadre.remove();
    const cx = x + w / 2, cy = y + h / 2;
    w = Math.max(w, h * W / H, W / 12); h = w * H / W;  // rapport de la carte, zoom x12 au plus
    vue = [cx - w / 2, cy - h / 2, w, h];
    appliqueVue();
  }
  depart = null; cadre = null;
  if (svgCarte.hasPointerCapture(ev.pointerId)) svgCarte.releasePointerCapture(ev.pointerId);
}
svgCarte.addEventListener("pointerup", finSelection);
svgCarte.addEventListener("pointercancel", finSelection);
svgCarte.addEventListener("dblclick", () => { vue = null; appliqueVue(); });
dezoom.addEventListener("click", () => { vue = null; appliqueVue(); });

PARTAGE.demarrer({ ecran: "carte", ...D.partage });

/* L'URL est ecrite avant la carte : l'en-tete de l'export cite le lien courant. */
function dessine() { PARTAGE.ecrire({ mc: metrique }); textes(); carte(); table(); }
choix.addEventListener("change", ev => { metrique = ev.target.value; dessine(); });
addEventListener("hashchange", () => { metrique = depuisUrl(); coche(); dessine(); tables(PARTAGE.lire().get("d") === "1"); });
const bouton = document.getElementById("tbl");
/* Tableaux ouverts : cle `d=1`, comme sur le tableau de bord, pour qu'une URL collee rouvre le meme ecran. */
function tables(on) {
  bouton.setAttribute("aria-pressed", String(on));
  bouton.textContent = on ? "Masquer les données" : "Voir les données";
  document.querySelectorAll(".tables").forEach(t => { t.hidden = !on; });
}
bouton.addEventListener("click", () => {
  const on = bouton.getAttribute("aria-pressed") !== "true";
  tables(on);
  PARTAGE.ecrire({ d: on ? 1 : null });
});
tuiles();
dessine();
tables(PARTAGE.lire().get("d") === "1");
</script>
