[project]
name = "bra-analytics"
version = "0.1.0"
description = "Ingestion, parsing et agregation des Bulletins d'Estimation du Risque d'Avalanche (Meteo-France)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bra = "bra_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bra_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
